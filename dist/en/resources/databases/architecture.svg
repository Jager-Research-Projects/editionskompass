<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc" xml:lang="en"><title id="title">Workflow models</title><desc id="desc">The three models show authoritative editing locations and controlled transfers.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#52685e"/></marker></defs><rect width="900" height="600" fill="#fffdf7"/><g font-family="Segoe UI,Arial,sans-serif" fill="#243d43"><text x="30" y="32" font-size="24" font-weight="bold">Workflow models</text><text x="30" y="68" font-size="19" font-weight="bold">A · Git and XML tools</text><g><rect x="30" y="90" width="154" height="80" rx="8" fill="#e7ecdf" stroke="#52685e"/><text x="107.0" y="130.0" text-anchor="middle" font-size="15">Edit TEI</text></g><path d="M184 130 L204 130" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="206" y="90" width="154" height="80" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="283.0" y="130.0" text-anchor="middle" font-size="15">Check + commit</text></g><path d="M360 130 L380 130" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="382" y="90" width="154" height="80" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="459.0" y="130.0" text-anchor="middle" font-size="15">Git data version</text></g><path d="M536 130 L556 130" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="558" y="90" width="154" height="80" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="635.0" y="130.0" text-anchor="middle" font-size="15">XML queries</text></g><path d="M712 130 L732 130" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="734" y="90" width="154" height="80" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="811.0" y="130.0" text-anchor="middle" font-size="15">Publication</text></g><text x="30" y="199" font-size="14">Record changes in Git; XML tools read the identified version.</text><text x="30" y="238" font-size="19" font-weight="bold">B · Git leads; the database provides access</text><g><rect x="30" y="260" width="154" height="80" rx="8" fill="#e7ecdf" stroke="#52685e"/><text x="107.0" y="300.0" text-anchor="middle" font-size="15">Git data version</text></g><path d="M184 300 L204 300" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="206" y="260" width="154" height="80" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="283.0" y="300.0" text-anchor="middle" font-size="15">Checked import</text></g><path d="M360 300 L380 300" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="382" y="260" width="154" height="80" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="459.0" y="300.0" text-anchor="middle" font-size="15">XML database</text></g><path d="M536 300 L556 300" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="558" y="260" width="154" height="80" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="635.0" y="300.0" text-anchor="middle" font-size="15">Query / interface</text></g><path d="M712 300 L732 300" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="734" y="260" width="154" height="80" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="811.0" y="300.0" text-anchor="middle" font-size="15">Feedback</text></g><text x="30" y="369" font-size="14">Corrections return to Git; import again after checking.</text><text x="30" y="408" font-size="19" font-weight="bold">C · Edit in a database and connect it to Git</text><g><rect x="30" y="430" width="154" height="80" rx="8" fill="#e7ecdf" stroke="#52685e"/><text x="107.0" y="470.0" text-anchor="middle" font-size="15">Edit in database</text></g><path d="M184 470 L204 470" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="206" y="430" width="154" height="80" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="283.0" y="470.0" text-anchor="middle" font-size="15">Defined export</text></g><path d="M360 470 L380 470" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="382" y="430" width="154" height="80" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="459.0" y="470.0" text-anchor="middle" font-size="15">Compare + check</text></g><path d="M536 470 L556 470" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="558" y="430" width="154" height="80" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="635.0" y="470.0" text-anchor="middle" font-size="15">Git commit</text></g><path d="M712 470 L732 470" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="734" y="430" width="154" height="80" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="811.0" y="470.0" text-anchor="middle" font-size="15">Release</text></g><text x="30" y="539" font-size="14">Export at agreed stages; define the scope of the preserved history.</text></g></svg>