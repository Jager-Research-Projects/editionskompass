<?xml version="1.0" encoding="utf-8"?>
<svg aria-labelledby="graph-title-export graph-desc-export" role="img" viewBox="0 0 1100 1430" xmlns="http://www.w3.org/2000/svg"><title id="graph-title-export">Decision-making methods for Rätselhaft!</title><desc id="graph-desc-export">Publication structure, local access and version reference determine the use. Care routes lead to the receipt of data under different conditions.</desc><defs><marker id="arrow-export" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#7a8d83"/></marker></defs><style>.node{fill:#edf0e6;stroke:#9bab9f;stroke-width:1.5}.selected{fill:#233b42;stroke:#233b42}.label{font:17px 'Segoe UI',Arial;text-anchor:middle;fill:#233b42}.selected-label{fill:#fffdf7}.question{font:20px Georgia;text-anchor:middle;fill:#9b4734}.edge{stroke:#94a397;stroke-width:1.6;fill:none;marker-end:url(#arrow-export)}.choice{cursor:pointer}.choice:focus rect{stroke:#ac492f;stroke-width:4}</style><rect fill="#fffdf7" height="1430" width="1100"/><text class="label" style="font-size:28px;font-weight:bold" x="550" y="45">One corpus. Several viable ways.</text><text class="label" x="550" y="76">Neutral overview · Check requirements together</text><text class="question" x="550" y="135">How do others find the relevant collection?</text><g><rect class="node" height="65" rx="10" width="500" x="40" y="165"/><text class="label" x="290" y="203.5">Curated inventory with entry</text></g><path class="edge" d="M290 230L550 280"/><g><rect class="node" height="65" rx="10" width="500" x="560" y="165"/><text class="label" x="810" y="203.5">Adult workstation</text></g><path class="edge" d="M810 230L550 280"/><g><rect class="node" height="65" rx="10" width="780" x="160" y="280"/><text class="label" x="550" y="318.5">Task: to make relevant data, rules and entry visible</text></g><path class="edge" d="M550 345L550 390"/><text class="question" x="550" y="425">How does the local investigation begin?</text><g><rect class="node" height="65" rx="10" width="500" x="40" y="455"/><text class="label" x="290" y="493.5">Versioned complete downloads</text></g><path class="edge" d="M290 520L550 570"/><g><rect class="node" height="65" rx="10" width="500" x="560" y="455"/><text class="label" x="810" y="493.5">Only via the running server</text></g><path class="edge" d="M810 520L550 570"/><g><rect class="node" height="65" rx="10" width="780" x="160" y="570"/><text class="label" x="550" y="608.5">Task: Provide data independently of server and team</text></g><path class="edge" d="M550 635L550 680"/><text class="question" x="550" y="715">Which version is being examined?</text><g><rect class="node" height="65" rx="10" width="326.6666666666667" x="40" y="745"/><text class="label" x="203.33333333333334" y="783.5">Verified release + archive</text></g><path class="edge" d="M203.33333333333334 810L550 860"/><g><rect class="node" height="65" rx="10" width="326.6666666666667" x="386.6666666666667" y="745"/><text class="label" x="550" y="783.5">Exact Committance</text></g><path class="edge" d="M550 810L550 860"/><g><rect class="node" height="65" rx="10" width="326.6666666666667" x="733.3333333333334" y="745"/><text class="label" x="896.6666666666667" y="783.5">Current main</text></g><path class="edge" d="M896.6666666666667 810L550 860"/><g><rect class="node" height="65" rx="10" width="780" x="160" y="860"/><text class="label" x="550" y="898.5">Task: Identifying data, selection and procedures intelligible</text></g><path class="edge" d="M550 925L550 970"/><text class="question" x="550" y="1005">What is the commitment after the sponsor?</text><g><rect class="node" height="65" rx="10" width="240" x="40" y="1035"/><text class="label" x="160" y="1073.5">Actively Maintain</text></g><path class="edge" d="M160 1100L550 1150"/><g><rect class="node" height="65" rx="10" width="240" x="300" y="1035"/><text class="label" x="420" y="1073.5">Preserving</text></g><path class="edge" d="M420 1100L550 1150"/><g><rect class="node" height="65" rx="10" width="240" x="560" y="1035"/><text class="label" x="680" y="1073.5">Transfer</text></g><path class="edge" d="M680 1100L550 1150"/><g><rect class="node" height="65" rx="10" width="240" x="820" y="1035"/><text class="label" x="940" y="1073.5">Completed</text></g><path class="edge" d="M940 1100L550 1150"/><g><rect class="node" height="65" rx="10" width="780" x="160" y="1150"/><text class="label" x="550" y="1188.5">Together: Get understandable data and make commitment visible</text></g><text class="label" x="550" y="1350">All ways: tested releases, understandable documentation and tested handover.</text><text class="label" x="550" y="1384">Change requires re-examination; different ways mean different work.</text></svg>