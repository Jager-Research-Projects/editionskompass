<svg aria-labelledby="repo-tree-title-static repo-tree-desc-static" role="img" viewBox="0 0 520 980" xmlns="http://www.w3.org/2000/svg"><title id="repo-tree-title-static">Folder structure of the corpus repos</title><desc id="repo-tree-desc-static">The main directory contains README, license, citation information and change log. The folders schema, docs, examples and tests are located next to it. data contains one XML file per book or collection.</desc><style>.repo-select{cursor:pointer}.repo-select:focus .node-bg{stroke:#a94a32;stroke-width:4}.repo-selected .node-bg{stroke:#a94a32;stroke-width:2.5}</style><rect fill="#fffdf7" height="980" width="520"/><rect fill="#243d43" height="66" rx="8" width="492" x="14" y="16"/><path d="M28 35h9l4 5h17v14H28Z" fill="#dae3d0" stroke="#597462" stroke-width="1.5"/><text fill="#fffdf7" font-family="Consolas,monospace" font-size="24" x="74" y="58">Raetsel corpus/</text><path d="M42 82V139H76" fill="none" stroke="#829885" stroke-width="2"/><g><rect class="node-bg" fill="#f1f3eb" height="65" rx="6" stroke="#c3cdbd" width="430" x="76" y="110"/><path d="M90 121h16l7 7v14H90Z M106 121v8h7" fill="#fffdf7" stroke="#62766b" stroke-width="1.5"/><text fill="#243d43" font-family="Consolas,monospace" font-size="24" x="128" y="137">README.md</text><text fill="#42594b" font-family="Arial,sans-serif" font-size="20" x="88" y="163">Introduction and first investigation</text></g><path d="M42 82V217H76" fill="none" stroke="#829885" stroke-width="2"/><g><rect class="node-bg" fill="#f1f3eb" height="65" rx="6" stroke="#c3cdbd" width="430" x="76" y="188"/><path d="M90 199h16l7 7v14H90Z M106 199v8h7" fill="#fffdf7" stroke="#62766b" stroke-width="1.5"/><text fill="#243d43" font-family="Consolas,monospace" font-size="24" x="128" y="215">LICENSE</text><text fill="#42594b" font-family="Arial,sans-serif" font-size="20" x="88" y="241">Rights of use</text></g><path d="M42 82V295H76" fill="none" stroke="#829885" stroke-width="2"/><g><rect class="node-bg" fill="#f