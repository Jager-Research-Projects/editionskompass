<?xml version="1.0" encoding="utf-8"?>
<svg aria-label="Comparison of work schedules Front-end development" role="img" viewBox="0 0 1060 410" xmlns="http://www.w3.org/2000/svg"><title>From late frontend block to graded development</title><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#243d43}</style><text font-size="24" x="25" y="35">Frontend: prepare early, expand on pilot stock</text><path d="M930 65V356" stroke="#a94a32" stroke-dasharray="5 5"/><text font-size="12" x="850" y="65">Beneficiary</text><text font-size="16" x="25" y="100">Order of business in application</text><text font-size="13" x="25" y="135">Edition work</text><rect fill="#627f71" height="28" rx="3" width="510" x="270" y="116"/><text font-size="13" x="25" y="183">Front end</text><rect fill="#a94a32" height="28" rx="3" width="190" x="740" y="164"/><text font-size="12" x="740" y="213">Little time for feedback</text><text font-size="16" x="25" y="259">Adapted order of business</text><rect fill="#b9c4b6" height="30" rx="3" stroke="#627f71" width="100" x="270" y="280"/><text font-size="13" text-anchor="middle" x="320.0" y="335">Forward</text><rect fill="#849b87" height="30" rx="3" stroke="#627f71" width="130" x="420" y="280"/><text font-size="13" text-anchor="middle" x="485.0" y="335">Pilot</text><rect fill="#627f71" height="30" rx="3" stroke="#627f71" width="230" x="555" y="280"/><text font-size="13" text-anchor="middle" x="670.0" y="335">Extension</text><rect fill="#e1e8df" height="30" rx="3" stroke="#627f71" width="115" x="815" y="280"/><text font-size="13" text-anchor="middle" x="872.5" y="335">Optimize</text><path d="M800 270V320" stroke="#a94a32" stroke-width="2"/><text font-size="12" text-anchor="middle" x="800" y="360">Core decrease</text><text font-size="13" x="25" y="394">Expansion begins with representative TEI. Feedback and optimizations accompany the edition work.</text></svg>