<?xml version="1.0" encoding="utf-8"?>
<svg aria-label="Historical textual genesis and modern Git history" role="img" viewBox="0 0 960 370" xmlns="http://www.w3.org/2000/svg"><title>Historical textual genesis and modern Git history</title><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10" fill="none" stroke="#60756c" stroke-width="1.5"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#243d43}.box{fill:#fffdf7;stroke:#b9c4b6}.decision{fill:#e7ecdf;stroke:#7f9686}.line{fill:none;stroke:#60756c;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:12px;fill:#52685e}.node{font-size:15px;font-weight:600}</style><text font-size="23" x="28" y="35">Two stories of the same place</text><rect class="decision" height="66" rx="9" width="440" x="25" y="75"/><text class="node" text-anchor="middle" x="245.0" y="101">Hartmann's work on the manuscript</text><text class="node" text-anchor="middle" x="245.0" y="121">Delete · Complete · Reorder</text><rect class="decision" height="66" rx="9" width="440" x="495" y="75"/><text class="node" text-anchor="middle" x="715.0" y="101">Our work on the edition</text><text class="node" text-anchor="middle" x="715.0" y="121">Read · Distinguishing · Correct</text><text font-size="17" text-decoration="line-through" x="48" y="185">The city was in front of her.</text><text font-size="17" x="48" y="221">Marginal addition: as if it did not belong here</text><text font-size="17" x="518" y="185">working version: Thore → Gates</text><text font-size="17" x="518" y="221">Sentence correction: here → there</text><text class="label" x="48" y="290">Historical writings are interpreted.</text><text class="label" x="518" y="290">Git documents modern changes.</text><text font-size="16" x="28" y="343">A commit date is not a date of a historical writing layer.</text></svg>