<svg aria-label="Plan, secure support and expected progress" role="img" viewBox="0 0 1060 615" xmlns="http://www.w3.org/2000/svg"><title>Plan, secure support and expected progress</title><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10" fill="none" stroke="#60756c" stroke-width="1.5"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#243d43}.box{fill:#fffdf7;stroke:#b9c4b6}.decision{fill:#e7ecdf;stroke:#7f9686}.line{fill:none;stroke:#60756c;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:12px;fill:#52685e}.node{font-size:15px;font-weight:600}</style><text font-size="24" x="25" y="34">Plan, funding and expected progress</text><rect fill="#627f71" height="14" rx="2" width="25" x="25" y="58"/><text font-size="13" x="60" y="70">Project sites + full infrastructure</text><rect fill="#e1e8df" height="14" rx="2" stroke="#627f71" stroke-dasharray="4 3" width="25" x="460" y="58"/><text font-size="13" x="495" y="70">Continue work; secure support separately</text><path d="M37 89L44 96L37 103L30 96Z" fill="#fffdf7" stroke="#a94a32" stroke-width="2"/><text font-size="13" x="60" y="101">Final objective in the application</text><circle cx="473" cy="96" fill="#fffdf7" r="6" stroke="#627f71" stroke-width="2"/><text font-size="13" x="495" y="101">Expected completion</text><path d="M340 155V535" stroke="#7f9686" stroke-dasharray="4 5"/><path d="M700 155V535" stroke="#a94a32" stroke-dasharray="5 5"/><text class="label" x="340" y="145">Start of project</text><text class="label" x="700" y="133">Number of posts / target date</text><text class="label" x="700" y="150">in the application</text><text font-size="16" x="25" y="193">Project support</text><rect fill="#a94a32" height="29" rx="4" width="360" x="340" y="172"/><text font-size="13" x="715" y="192">Jobs and full project operation end</text><text font-size="16" x="25" y="246">Dissertations</text><text font-size="14" x="45" y="283">Luke</text><rect fill="#fffdf7" height="23" rx="3" stroke="#7f9686" stroke-dasharray="3 3" width="75" x="265" y="266"/><rect data-person="lukas" fill="#627f71" height="23" rx="3" width="360" x="340" y="266"/><rect fill="#e1e8df" height="23" rx="3" stroke="#627f71" stroke-dasharray="4 3" width="120" x="700" y="266"/><path d="M700 269L708 277.5L700 286L692 277.5Z" fill="#fffdf7" stroke="#a94a32" stroke-width="2"/><circle cx="820" cy="277.5" fill="#fffdf7" r="6" stroke="#627f71" stroke-width="2"/><text font-size="14" x="45" y="330">Nora</text><rect data-person="nora" fill="#627f71" height="23" rx="3" width="320" x="380" y="313"/><rect fill="#e1e8df" height="23" rx="3" stroke="#627f71" stroke-dasharray="4 3" width="175" x="700" y="313"/><path d="M700 316L708 324.5L700 333L692 324.5Z" fill="#fffdf7" stroke="#a94a32" stroke-width="2"/><circle cx="875" cy="324.5" fill="#fffdf7" r="6" stroke="#627f71" stroke-width="2"/><text font-size="16" x="25" y="413">Book</text><rect fill="#627f71" height="25" rx="3" width="360" x="340" y="394"/><rect fill="#e1e8df" height="25" rx="3" stroke="#627f71" stroke-dasharray="4 3" width="220" x="700" y="394"/><path d="M700 398L708 406.5L700 415L692 406.5Z" fill="#fffdf7" stroke="#a94a32" stroke-width="2"/><circle cx="920" cy="406.5" fill="#fffdf7" r="6" stroke="#627f71" stroke-width="2"/><text font-size="16" x="25" y="509">Edition Frontend</text><rect fill="#627f71" height="25" rx="3" width="360" x="340" y="490"/><rect fill="#e1e8df" height="25" rx="3" stroke="#627f71" stroke-dasharray="4 3" width="290" x="700" y="490"/><path d="M700 494L708 502.5L700 511L692 502.5Z" fill="#fffdf7" stroke="#a94a32" stroke-width="2"/><circle cx="990" cy="502.5" fill="#fffdf7" r="6" stroke="#627f71" stroke-width="2"/><path d="M340 434H920" stroke="#8a6c2f" stroke-width="3"/><text font-size="13" x="340" y="456">Sentence means secured – even at later completion.</text><text font-size="13" x="25" y="565">Lukas started before the start of the project. Nora developed her project after hiring.</text><text font-size="13" x="25" y="590">Full infrastructure and support are not automatically secured after the end of the job.</text></svg>