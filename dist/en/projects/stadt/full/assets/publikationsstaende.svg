<svg aria-label="Publication levels and return flow" role="img" viewBox="0 0 960 400" xmlns="http://www.w3.org/2000/svg"><title>Publication levels and return flow</title><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10" fill="none" stroke="#60756c" stroke-width="1.5"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#243d43}.box{fill:#fffdf7;stroke:#b9c4b6}.decision{fill:#e7ecdf;stroke:#7f9686}.line{fill:none;stroke:#60756c;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:12px;fill:#52685e}.node{font-size:15px;font-weight:600}</style><rect class="box" height="66" rx="9" width="260" x="20" y="45"/><text class="node" text-anchor="middle" x="150.0" y="71">TEI V1</text><text class="node" text-anchor="middle" x="150.0" y="91">Checked delivery level</text><path class="line" d="M280 78L345 78"/><rect class="box" height="66" rx="9" width="260" x="350" y="45"/><text class="node" text-anchor="middle" x="480.0" y="71">Publisher's sentence</text><text class="node" text-anchor="middle" x="480.0" y="91">Technical correction</text><path class="line" d="M610 78L675 78"/><rect class="decision" height="66" rx="9" width="260" x="680" y="45"/><text class="node" text-anchor="middle" x="810.0" y="71">TEI V2</text><text class="node" text-anchor="middle" x="810.0" y="91">Tested returned</text><path class="line" d="M810 111V180H155V225"/><path class="line" d="M810 180H475V225"/><path class="line" d="M810 111V225"/><rect class="box" height="66" rx="9" width="260" x="25" y="225"/><text class="node" text-anchor="middle" x="155.0" y="251">TEI download</text><text class="node" text-anchor="middle" x="155.0" y="271">Name actual version</text><rect class="box" height="66" rx="9" width="260" x="345" y="225"/><text class="node" text-anchor="middle" x="475.0" y="251">Book reference</text><text class="node" text-anchor="middle" x="475.0" y="271">Document correction status</t