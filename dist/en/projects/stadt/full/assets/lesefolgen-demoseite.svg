<?xml version="1.0" encoding="utf-8"?>
<svg aria-label="Manuscript demo page with main text and marginal note" role="img" viewBox="0 0 760 510" xmlns="http://www.w3.org/2000/svg"><title>Manuscript demo page · Sheet 12r</title><rect fill="#fffdf7" height="494" rx="3" stroke="#b9c4b6" width="744" x="8" y="8"/><text fill="#52685e" font-family="Segoe UI,Arial" font-size="14" x="45" y="50">Die andere Stadt · Sheet 12r · Manuscript demo page</text><path d="M45 70H710" stroke="#b9c4b6"/><g data-zone="seq-clara"><rect class="source-zone" fill="none" height="85" rx="5" stroke="#b9c4b6" stroke-dasharray="4 4" width="650" x="45" y="95"/><text fill="#52685e" font-family="Segoe UI,Arial" font-size="12" x="57" y="117">Clara at the gate</text><text fill="#243d43" font-family="Georgia,serif" font-size="22" font-style="italic" x="57" y="147">Clara stopped at the gate.</text></g><g data-zone="seq-stadt"><rect class="source-zone" fill="none" height="105" rx="5" stroke="#b9c4b6" stroke-dasharray="4 4" width="475" x="220" y="310"/><text fill="#52685e" font-family="Segoe UI,Arial" font-size="12" x="232" y="332">The city is getting dark</text><text fill="#243d43" font-family="Georgia,serif" font-size="22" font-style="italic" x="232" y="362">Behind the windows were</text><text fill="#243d43" font-family="Georgia,serif" font-size="22" font-style="italic" x="232" y="391">the lamps are extinguished.</text></g><g data-zone="seq-schritte"><rect class="source-zone" fill="none" height="85" rx="5" stroke="#b9c4b6" stroke-dasharray="4 4" width="650" x="45" y="200"/><text fill="#52685e" font-family="Segoe UI,Arial" font-size="12" x="57" y="222">The steps</text><text fill="#243d43" font-family="Georgia,serif" font-size="22" font-style="italic" x="57" y="252">Only now did she hear the steps on the patch.</text></g><text fill="#52685e" font-family="Segoe UI,Arial" font-size="12" x="45" y="469">Main text and marginal note are arranged differently in the views.</text></svg>