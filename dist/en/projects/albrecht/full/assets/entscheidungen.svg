<?xml version="1.0" encoding="utf-8"?>
<svg aria-labelledby="dg-title dg-desc" role="img" viewBox="0 0 1100 1480" xmlns="http://www.w3.org/2000/svg"><title id="dg-title">Decision-making methods of the Academy Edition</title><desc id="dg-desc">Organization, operation, repository editing and data maintenance branch out and result in joint integration. After review and approvals, publishers, public data and archives are served. Model and host changes require re-examination.</desc><defs><marker id="dg-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#7e8c87"/></marker></defs><style>.dg-box{fill:#f1f4ed;stroke:#a6b6ae;stroke-width:1.5}.dg-choice{cursor:pointer}.dg-choice:focus rect{stroke:#a54b35;stroke-width:4}.dg-selected{fill:#233b42;stroke:#233b42}.dg-t{font:17px 'Segoe UI',Arial,sans-serif;fill:#233b42;text-anchor:middle}.dg-selected-text{fill:white}.dg-label{font:16px 'Segoe UI',Arial,sans-serif;fill:#a54b35;text-anchor:middle}.dg-line{fill:none;stroke:#a6b6ae;stroke-width:1.6;marker-end:url(#dg-arrow)}.dg-note{font:15px 'Segoe UI',Arial,sans-serif;fill:#516169;text-anchor:middle}</style><rect fill="#fffdf8" height="1480" width="1100"/><text class="dg-t" style="font-size:26px;font-weight:bold" x="550" y="40">Academy Edition: Connecting Decisions</text><text class="dg-note" x="550" y="72">Neutral overview · several paths can be sustainable</text><path class="dg-line" d="M550 94L195 158"/><g><rect class="dg-box" height="64" rx="12" width="320" x="35" y="158"/><text class="dg-t" x="195" y="196">Autonomous editorial services</text></g><path class="dg-line" d="M195 222L550 277"/><path d="M550 94L550 102" fill="none" stroke="#a6b6ae" stroke-width="1.6"/><path class="dg-line" d="M550 144L550 158"/><g><rect class="dg-box" height="64" rx="12" width="320" x="390" y="158"/><text class="dg-t" x="550" y="196">Federated working groups</text></g><path class="dg-line" d="M550 222L550 277"/><path class="dg-line" d="M550 94L905 158"/><g><rect class="dg-box" height="64" rx="12" width="320" x="745" y="158"/><text class="dg-t" x="905" y="196">Central Editors</text></g><path class="dg-line" d="M905 222L550 277"/><text class="dg-label" x="550" y="130">Who decides together?</text><circle cx="550" cy="280" fill="#a6b6ae" r="4"/><path class="dg-line" d="M550 284L195 363"/><g><rect class="dg-box" height="64" rx="12" width="320" x="35" y="363"/><text class="dg-t" x="195" y="401">Lead University</text></g><path class="dg-line" d="M195 427L550 482"/><path d="M550 284L550 307" fill="none" stroke="#a6b6ae" stroke-width="1.6"/><path class="dg-line" d="M550 349L550 363"/><g><rect class="dg-box" height="64" rx="12" width="320" x="390" y="363"/><text class="dg-t" x="550" y="401">Joint Academy Director</text></g><path class="dg-line" d="M550 427L550 482"/><path class="dg-line" d="M550 284L905 363"/><g><rect class="dg-box" height="64" rx="12" width="320" x="745" y="363"/><text class="dg-t" x="905" y="401">External Service</text></g><path class="dg-line" d="M905 427L550 482"/><text class="dg-label" x="550" y="335">Who's in charge of the operation?</text><circle cx="550" cy="485" fill="#a6b6ae" r="4"/><path class="dg-line" d="M550 489L195 568"/><g><rect class="dg-box" height="64" rx="12" width="320" x="35" y="568"/><text class="dg-t" x="195" y="606">A total repo</text></g><path class="dg-line" d="M195 632L550 687"/><path d="M550 489L550 512" fill="none" stroke="#a6b6ae" stroke-width="1.6"/><path class="dg-line" d="M550 554L550 568"/><g><rect class="dg-box" height="64" rx="12" width="320" x="390" y="568"/><text class="dg-t" x="550" y="606">Sectors + Standards</text></g><path class="dg-line" d="M550 632L550 687"/><path class="dg-line" d="M550 489L905 568"/><g><rect class="dg-box" height="64" rx="12" width="320" x="745" y="568"/><text class="dg-t" x="905" y="606">Volume/package repos</text></g><path class="dg-line" d="M905 632L550 687"/><text class="dg-label" x="550" y="540">How are working repositorys tailored?</text><circle cx="550" cy="690" fill="#a6b6ae" r="4"/><path class="dg-line" d="M550 694L195 773"/><g><rect class="dg-box" height="64" rx="12" width="320" x="35" y="773"/><text class="dg-t" x="195" y="811">Git-centered</text></g><path class="dg-line" d="M195 837L550 892"/><path d="M550 694L550 717" fill="none" stroke="#a6b6ae" stroke-width="1.6"/><path class="dg-line" d="M550 759L550 773"/><g><rect class="dg-box" height="64" rx="12" width="320" x="390" y="773"/><text class="dg-t" x="550" y="811">Hybrid: responsibility per type of data</text></g><path class="dg-line" d="M550 837L550 892"/><path class="dg-line" d="M550 694L905 773"/><g><rect class="dg-box" height="64" rx="12" width="320" x="745" y="773"/><text class="dg-t" x="905" y="811">Database Centered</text></g><path class="dg-line" d="M905 837L550 892"/><text class="dg-label" x="550" y="745">Where is the relevant data maintenance located?</text><circle cx="550" cy="895" fill="#a6b6ae" r="4"/><path class="dg-line" d="M550 899L550 970"/><g><rect class="dg-box" height="64" rx="12" width="580" x="260" y="970"/><text class="dg-t" x="550" y="1008">Verified data packages → joint integration</text></g><path class="dg-line" d="M550 1034L550 1080"/><g><rect class="dg-box" height="64" rx="12" width="580" x="260" y="1080"/><text class="dg-t" x="550" y="1118">Fixed test bench, test report, post-processing</text></g><path class="dg-line" d="M550 1144L550 1190"/><g><rect class="dg-box" height="64" rx="12" width="580" x="260" y="1190"/><text class="dg-t" x="550" y="1228">Scientific and appropriate legal approvals</text></g><path class="dg-line" d="M550 1254L195 1300"/><g><rect class="dg-box" height="64" rx="12" width="320" x="35" y="1300"/><text class="dg-t" x="195" y="1338">Publishing package → Book</text></g><path class="dg-line" d="M550 1254L550 1300"/><g><rect class="dg-box" height="64" rx="12" width="320" x="390" y="1300"/><text class="dg-t" x="550" y="1338">Public data → Web</text></g><path class="dg-line" d="M550 1254L905 1300"/><g><rect class="dg-box" height="64" rx="12" width="320" x="745" y="1300"/><text class="dg-t" x="905" y="1338">Results + protected process</text></g><text class="dg-note" x="550" y="1405">Return journeys: Reports and typesetting corrections back to the relevant data.</text><text class="dg-note" x="550" y="1432">Host/model change: re-examine export, responsibilities and reconstruction.</text><text class="dg-note" x="550" y="1459">Together: manual, scientific mandates and regulated approaches.</text></svg>