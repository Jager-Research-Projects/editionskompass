<?xml version="1.0" encoding="utf-8"?>
<svg aria-labelledby="flow-title flow-desc" class="anna-flow" height="1500" role="img" viewBox="0 0 900 1500" width="900" xmlns="http://www.w3.org/2000/svg"><title id="flow-title">Anna: Ways from the Edition Project to Publication</title><desc id="flow-desc">Working format TEI or Markdown; merging of Git source data. Institutional or other hosting; independent choice of publication host. A separate adjusted publication repository on the same or other host leads to the verified approval. Possible issues are data with agreed archiving, website and print edition.</desc><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M1 1L9 5L1 9" fill="none" stroke="#9baeb4" stroke-width="1.5"/></marker><marker id="arrow-active" markerHeight="6" markerWidth="6" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path d="M1 1L9 5L1 9" fill="none" stroke="#173c39" stroke-width="1.5"/></marker></defs><rect fill="#fffefb" height="1500" width="900"/><g font-family="Arial, sans-serif"><path d="M450 87V135" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-width="1.6"/><path d="M450 199V230H210V270" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-width="1.6"/><path d="M450 199V230H690V270" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-width="1.6"/><path d="M210 350V385H450V410" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-width="1.6"/><path d="M690 350V385H450V410" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-width="1.6"/><path d="M450 478V535" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-width="1.6"/><path d="M450 599V630H210V670" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-width="1.6"/><path d="M450 599V630H690V670" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-width="1.6"/><path d="M210 750V785H450V815" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-width="1.6"/><path d="M690 750V785H450V815" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-width="1.6"/><path d="M450 879V910H210V950" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-width="1.6"/><path d="M450 879V910H690V950" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-width="1.6"/><path d="M210 1034V1070H450V1110" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-width="1.6"/><path d="M690 1034V1070H450V1110" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-width="1.6"/><path d="M450 1180V1225H150V1280" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-dasharray="6 5" stroke-width="1.6"/><path d="M450 1180V1280" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-dasharray="6 5" stroke-width="1.6"/><path d="M450 1180V1225H750V1280" fill="none" marker-end="url(#arrow)" stroke="#9baeb4" stroke-dasharray="6 5" stroke-width="1.6"/><g aria-hidden="true"><rect fill="#f7fbff" height="32" rx="16" stroke="#c5d8e2" width="156" x="132" y="224"/><text fill="#244d65" font-size="17" text-anchor="middle" x="210" y="246">TEI</text></g><g aria-hidden="true"><rect fill="#f7fbff" height="32" rx="16" stroke="#c5d8e2" width="156" x="612" y="224"/><text fill="#244d65" font-size="17" text-anchor="middle" x="690" y="246">Markdown</text></g><g aria-hidden="true"><rect fill="#f7fbff" height="32" rx="16" stroke="#c5d8e2" width="156" x="132" y="624"/><text fill="#244d65" font-size="17" text-anchor="middle" x="210" y="646">University</text></g><g aria-hidden="true"><rect fill="#f7fbff" height="32" rx="16" stroke="#c5d8e2" width="156" x="612" y="624"/><text fill="#244d65" font-size="17" text-anchor="middle" x="690" y="646">Individual</text></g><g aria-hidden="true"><rect fill="#f7fbff" height="32" rx="16" stroke="#c5d8e2" width="156" x="132" y="904"/><text fill="#244d65" font-size="17" text-anchor="middle" x="210" y="926">Same host</text></g><g aria-hidden="true"><rect fill="#f7fbff" height="32" rx="16" stroke="#c5d8e2" width="156" x="612" y="904"/><text fill="#244d65" font-size="17" text-anchor="middle" x="690" y="926">Other host</text></g><g aria-label="Anna: Edition project" class="flow-node" id="flow-project" role="img"><title>Anna wants to explore a historical text scientifically. The overview shows possible ways. An highlighted selection means a planning, not an already executed institution.</title><rect fill="#e6f2fc" height="62" rx="18" stroke="#bdced9" stroke-width="1.2" width="340" x="280" y="25"/><text fill="#164b70" font-size="19" font-weight="600" text-anchor="middle" x="450" y="63">Anna: Edition project</text></g><g aria-label="Work format?" class="flow-node" id="flow-format" role="img"><title>TEI and Markdown are two working ways. TEI provides established editorial semantics; Markdown requires its own conventions and remains the less preferred alternative. Both can be versioned with Git.</title><rect fill="#f5faff" height="64" rx="18" stroke="#bdced9" stroke-dasharray="4 4" stroke-width="1.2" width="260" x="320" y="135"/><text fill="#164b70" font-size="19" font-weight="600" text-anchor="middle" x="450" y="174">Work format?</text></g><g aria-label="oXygen Author: TEI + prepared schema" class="flow-node" id="flow-tei" role="img"><title>Anna chooses TEI and a prepared oXygen author environment. schema, templates and Git connection facilitate the work. The selection sets the working format to TEI; an actual tool access has yet to be clarified.</title><rect fill="#e6f2fc" height="80" rx="18" stroke="#bdced9" stroke-width="1.2" width="300" x="60" y="270"/><text fill="#164b70" font-size="19" font-weight="600" text-anchor="middle" x="210" y="306">oXygen Author</text><text fill="#164b70" font-size="16" font-weight="400" text-anchor="middle" x="210" y="331">TEI + prepared schema</text></g><g aria-label="Preview text editor: Markdown + Conventions" class="flow-node" id="flow-markdown" role="img"><title>Anna can work with Markdown and check a preview regularly. Own rules for editorial statements, IDs and references are necessary. The selection sets the alternative work path; she does not claim TEI-comparable semantics.</title><rect fill="#e6f2fc" height="80" rx="18" stroke="#bdced9" stroke-width="1.2" width="300" x="540" y="270"/><text fill="#164b70" font-size="19" font-weight="600" text-anchor="middle" x="690" y="306">Previewed Text Editor</text><text fill="#164b70" font-size="16" font-weight="400" text-anchor="middle" x="690" y="331">Markdown + Conventions</text></g><g aria-label="Git-based source data" class="flow-node" id="flow-data" role="img"><title>The two format paths merge again: Files and saved changes are versioned with Git. Different semantics, checks and output paths remain.</title><rect fill="#e6f2fc" height="68" rx="18" stroke="#bdced9" stroke-width="1.2" width="340" x="280" y="410"/><text fill="#164b70" font-size="19" font-weight="600" text-anchor="middle" x="450" y="451">Git-based source data</text></g><g aria-label="Work host?" class="flow-node" id="flow-workhost" role="img"><title>This is about the place of private working repositorys. Hosting and consulting are different services. The choice does not necessarily determine the future publication location.</title><rect fill="#f5faff" height="64" rx="18" stroke="#bdced9" stroke-dasharray="4 4" stroke-width="1.2" width="260" x="320" y="535"/><text fill="#164b70" font-size="19" font-weight="600" text-anchor="middle" x="450" y="574">Work host?</text></g><g aria-label="Institutional GitLab: Advice to clarify separately" class="flow-node" id="flow-uni" role="img"><title>Anna can use an institutional GitLab. The node chooses the model offer with advice; in the selection on the left she can also hire pure hosting. Access, consultation and long-term continuity are to be clarified concretely.</title><rect fill="#e6f2fc" height="80" rx="18" stroke="#bdced9" stroke-width="1.2" width="300" x="60" y="670"/><text fill="#164b70" font-size="19" font-weight="600" text-anchor="middle" x="210" y="706">Institutional GitLab</text><text fill="#164b70" font-size="16" font-weight="400" text-anchor="middle" x="210" y="731">Clearing advice separately</text></g><g aria-label="GitHub / other service: Clear access and support" class="flow-node" id="flow-other" role="img"><title>An individually selected suitable service can take up the private working repository. GitHub is an example. Anna clarifies account, disposition, support and backup path. Another service does not yet determine a public publication location.</title><rect fill="#e6f2fc" height="80" rx="18" stroke="#bdced9" stroke-width="1.2" width="300" x="540" y="670"/><text fill="#164b70" font-size="19" font-weight="600" text-anchor="middle" x="690" y="706">GitHub / Other Service</text><text fill="#164b70" font-size="16" font-weight="400" text-anchor="middle" x="690" y="731">Clear access and support</text></g><g aria-label="Publication host?" class="flow-node" id="flow-pubhost" role="img"><title>Same or other hosting service? This is a different question than the same or separate Repo. For Anna, a separate publication repository with cleaned-up files remains the preferred architecture – on both host paths.</title><rect fill="#f5faff" height="64" rx="18" stroke="#bdced9" stroke-dasharray="4 4" stroke-width="1.2" width="260" x="320" y="815"/><text fill="#164b70" font-size="19" font-weight="600" text-anchor="middle" x="450" y="854">Publication host?</text></g><g aria-label="Own publication repository: on the same host" class="flow-node" id="flow-same" role="img"><title>Anna plans a separate public publication repository with the previous hosting service. It only takes over audited files without private work history. Same host expressly does not mean to make the private working repository public.</title><rect fill="#e6f2fc" height="84" rx="18" stroke="#bdced9" stroke-width="1.2" width="300" x="60" y="950"/><text fill="#164b70" font-size="19" font-weight="600" text-anchor="middle" x="210" y="988">Publication repo</text><text fill="#164b70" font-size="16" font-weight="400" text-anchor="middle" x="210" y="1013">on the same host</text></g><g aria-label="Own publication repository: on another host" class="flow-node" id="flow-different" role="img"><title>Anna can work privately on the Uni-GitLab and publish an adjusted version for example on another service. Again, it is a separate publication repository. Export, access and output path are set up appropriately.</title><rect fill="#e6f2fc" height="84" rx="18" stroke="#bdced9" stroke-width="1.2" width="300" x="540" y="950"/><text fill="#164b70" font-size="19" font-weight="600" text-anchor="middle" x="690" y="988">Publication repo</text><text fill="#164b70" font-size="16" font-weight="400" text-anchor="middle" x="690" y="1013">on another host</text></g><g aria-label="Tested release: after conscious approval" class="flow-node" id="flow-release" role="img"><title>A approval, which is responsible for technical matters, will be able to work together. Prior to this, content, rights, metadata, attribution and achievable publication history will be examined.</title><rect fill="#e6f2fc" height="70" rx="18" stroke="#bdced9" stroke-width="1.2" width="340" x="280" y="1110"/><text fill="#164b70" font-size="19" font-weight="600" text-anchor="middle" x="450" y="1141">Verified release</text><text fill="#164b70" font-size="16" font-weight="400" text-anchor="middle" x="450" y="1166">after conscious approval</text></g><g aria-label="Edition data: + agreed to transfer the archive" class="flow-node" id="flow-archive" role="img"><title>Released TEI or other documented edition data are provided reusable. Archive carriers, metadata and persistent identifiers are to be agreed in addition. A Git host alone does not guarantee archiving.</title><rect fill="#e6f2fc" height="90" rx="18" stroke="#bdced9" stroke-width="1.2" width="260" x="20" y="1280"/><text fill="#164b70" font-size="19" font-weight="600" text-anchor="middle" x="150" y="1321">Edition data</text><text fill="#164b70" font-size="16" font-weight="400" text-anchor="middle" x="150" y="1346">+ agreed transfer of archive</text></g><g aria-label="Static website: e.g. via GitHub Pages" class="flow-node" id="flow-web" role="img"><title>A small website makes text and comment readable without TEI knowledge. The shared data require a suitable output path to HTML. GitHub Pages is a possible static hosting service; it does not automatically create an edition of raw TEI files.</title><rect fill="#e6f2fc" height="90" rx="18" stroke="#bdced9" stroke-width="1.2" width="260" x="320" y="1280"/><text fill="#164b70" font-size="19" font-weight="600" text-anchor="middle" x="450" y="1321">Static website</text><text fill="#164b70" font-size="16" font-weight="400" text-anchor="middle" x="450" y="1346">e.g. about GitHub Pages</text></g><g aria-label="Optional print edition: with or without publisher" class="flow-node" id="flow-print" role="img"><title>A print edition can be created from a tested version with suitable sentence template. A publisher is an opportunity with cost, performance and rights questions. Later digital revisions do not change distributed print copies.</title><rect fill="#e6f2fc" height="90" rx="18" stroke="#bdced9" stroke-width="1.2" width="260" x="620" y="1280"/><text fill="#164b70" font-size="19" font-weight="600" text-anchor="middle" x="750" y="1321">Optional print edition</text><text fill="#164b70" font-size="16" font-weight="400" text-anchor="middle" x="750" y="1346">with or without publisher</text></g><text fill="#173c39" font-size="15" text-anchor="middle" x="450" y="1405">dashed arrows: possible output after a verified approval.</text><text fill="#173c39" font-size="14" text-anchor="middle" x="450" y="1435">Overview of possible paths · no selection specified</text><text fill="#52645b" font-size="13" text-anchor="middle" x="450" y="1462">Own publication repository on both ways. Current selection is planning, no proof of implementation.</text><text fill="#52645b" font-size="12" text-anchor="middle" x="450" y="1486">Editionskompass · Anna · 20 October 2026</text></g></svg>