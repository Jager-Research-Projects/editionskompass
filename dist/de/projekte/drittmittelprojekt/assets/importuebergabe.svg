<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="Kontrollierte Übernahme aus Transkribus"><title>Kontrollierte Übernahme aus Transkribus</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#60756c" stroke-width="1.5"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#243d43}.box{fill:#fffdf7;stroke:#b9c4b6}.decision{fill:#e7ecdf;stroke:#7f9686}.line{fill:none;stroke:#60756c;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:12px;fill:#52685e}.node{font-size:15px;font-weight:600}</style><text x="25" y="35" font-size="24">Ein Export wird zur gemeinsamen Editionsgrundlage</text><rect x="30" y="70" width="260" height="66" rx="9" class="box"/><text x="160.0" y="96" text-anchor="middle" class="node">Basistranskription prüfen</text><text x="160.0" y="116" text-anchor="middle" class="node">Text · Layout · Randbereiche</text><path class="line" d="M290 103L340 103"/><rect x="350" y="70" width="260" height="66" rx="9" class="box"/><text x="480.0" y="96" text-anchor="middle" class="node">Exportstand sichern</text><text x="480.0" y="116" text-anchor="middle" class="node">Format · Prüfsumme · Herkunft</text><path class="line" d="M610 103L660 103"/><rect x="670" y="70" width="260" height="66" rx="9" class="box"/><text x="800.0" y="96" text-anchor="middle" class="node">Nach TEI überführen</text><text x="800.0" y="116" text-anchor="middle" class="node">Versioniertes Verfahren</text><path class="line" d="M800 136V190H480V225"/><rect x="280" y="225" width="400" height="66" rx="9" class="decision"/><text x="480.0" y="251" text-anchor="middle" class="node">Import abnehmen</text><text x="480.0" y="271" text-anchor="middle" class="node">Danach TEI/Git maßgeblich</text><path class="line" d="M480 291L480 335"/><rect x="280" y="335" width="400" height="66" rx="9" class="box"/><text x="480.0" y="361" text-an