<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 615" role="img" aria-label="Plan, gesicherte Unterstützung und erwarteter Verlauf"><title>Plan, gesicherte Unterstützung und erwarteter Verlauf</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#60756c" stroke-width="1.5"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#243d43}.box{fill:#fffdf7;stroke:#b9c4b6}.decision{fill:#e7ecdf;stroke:#7f9686}.line{fill:none;stroke:#60756c;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:12px;fill:#52685e}.node{font-size:15px;font-weight:600}</style><text x="25" y="34" font-size="24">Plan, Förderung und erwarteter Verlauf</text><rect x="25" y="58" width="25" height="14" rx="2" fill="#627f71"/><text x="60" y="70" font-size="13">Projektstellen + volle Infrastruktur</text><rect x="460" y="58" width="25" height="14" rx="2" fill="#e1e8df" stroke="#627f71" stroke-dasharray="4 3"/><text x="495" y="70" font-size="13">Weiterarbeit; Unterstützung gesondert sichern</text><path d="M37 89L44 96L37 103L30 96Z" fill="#fffdf7" stroke="#a94a32" stroke-width="2"/><text x="60" y="101" font-size="13">Abschlussziel im Antrag</text><circle cx="473" cy="96" r="6" fill="#fffdf7" stroke="#627f71" stroke-width="2"/><text x="495" y="101" font-size="13">Voraussichtlicher Abschluss</text><path d="M340 155V535" stroke="#7f9686" stroke-dasharray="4 5"/><path d="M700 155V535" stroke="#a94a32" stroke-dasharray="5 5"/><text x="340" y="145" class="label">Projektbeginn</text><text x="700" y="133" class="label">Stellenende / Zieltermin</text><text x="700" y="150" class="label">im Antrag</text><text x="25" y="193" font-size="16">Projektförderung</text><rect x="340" y="172" width="360" height="29" rx="4" fill="#a94a32"/><text x="715" y="192" font-size="13">Stellen und voller Projektbetrieb enden</text><text x="25" y="246" font-size="16">Dissertationen</text><text x="45" y="283" font-size="14">Lukas</text><rect x="265" y="266" width="75" height="23" rx="3" fill="#fffdf7" stroke="#7f9686" stroke-dasharray="3 3"/><rect data-person="lukas" x="340" y="266" width="360" height="23" rx="3" fill="#627f71"/><rect x="700" y="266" width="120" height="23" rx="3" fill="#e1e8df" stroke="#627f71" stroke-dasharray="4 3"/><path d="M700 269L708 277.5L700 286L692 277.5Z" fill="#fffdf7" stroke="#a94a32" stroke-width="2"/><circle cx="820" cy="277.5" r="6" fill="#fffdf7" stroke="#627f71" stroke-width="2"/><text x="45" y="330" font-size="14">Nora</text><rect data-person="nora" x="380" y="313" width="320" height="23" rx="3" fill="#627f71"/><rect x="700" y="313" width="175" height="23" rx="3" fill="#e1e8df" stroke="#627f71" stroke-dasharray="4 3"/><path d="M700 316L708 324.5L700 333L692 324.5Z" fill="#fffdf7" stroke="#a94a32" stroke-width="2"/><circle cx="875" cy="324.5" r="6" fill="#fffdf7" stroke="#627f71" stroke-width="2"/><text x="25" y="413" font-size="16">Buch</text><rect x="340" y="394" width="360" height="25" rx="3" fill="#627f71"/><rect x="700" y="394" width="220" height="25" rx="3" fill="#e1e8df" stroke="#627f71" stroke-dasharray="4 3"/><path d="M700 398L708 406.5L700 415L692 406.5Z" fill="#fffdf7" stroke="#a94a32" stroke-width="2"/><circle cx="920" cy="406.5" r="6" fill="#fffdf7" stroke="#627f71" stroke-width="2"/><text x="25" y="509" font-size="16">Editionsfrontend</text><rect x="340" y="490" width="360" height="25" rx="3" fill="#627f71"/><rect x="700" y="490" width="290" height="25" rx="3" fill="#e1e8df" stroke="#627f71" stroke-dasharray="4 3"/><path d="M700 494L708 502.5L700 511L692 502.5Z" fill="#fffdf7" stroke="#a94a32" stroke-width="2"/><circle cx="990" cy="502.5" r="6" fill="#fffdf7" stroke="#627f71" stroke-width="2"/><path d="M340 434H920" stroke="#8a6c2f" stroke-width="3"/><text x="340" y="456" font-size="13">Satzmittel gesichert – auch bei späterer Fertigstellung.</text><text x="25" y="565" font-size="13">Lukas hat vor Projektbeginn begonnen. Nora hat ihr Vorhaben nach der Einstellung entwickelt.</text><text x="25" y="590" font-size="13">Nach Stellenende sind volle Infrastruktur und Betreuung nicht automatisch gesichert.</text></svg>