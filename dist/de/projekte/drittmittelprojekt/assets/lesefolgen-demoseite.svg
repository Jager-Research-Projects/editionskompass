<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-label="Manuskript-Demoseite mit Haupttext und Randnotiz"><title>Manuskript-Demoseite · Blatt 12r</title><rect x="8" y="8" width="744" height="494" rx="3" fill="#fffdf7" stroke="#b9c4b6"/><text x="45" y="50" fill="#52685e" font-family="Segoe UI,Arial" font-size="14">Die andere Stadt · Blatt 12r · Manuskript-Demoseite</text><path d="M45 70H710" stroke="#b9c4b6"/><g data-zone="seq-clara"><rect class="source-zone" x="45" y="95" width="650" height="85" rx="5" fill="none" stroke="#b9c4b6" stroke-dasharray="4 4"/><text x="57" y="117" font-family="Segoe UI,Arial" font-size="12" fill="#52685e">Clara am Tor</text><text x="57" y="147" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#243d43">Clara blieb am Tore stehen.</text></g><g data-zone="seq-stadt"><rect class="source-zone" x="220" y="310" width="475" height="105" rx="5" fill="none" stroke="#b9c4b6" stroke-dasharray="4 4"/><text x="232" y="332" font-family="Segoe UI,Arial" font-size="12" fill="#52685e">Die Stadt wird dunkel</text><text x="232" y="362" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#243d43">Hinter den Fenstern wurden</text><text x="232" y="391" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#243d43">die Lampen gelöscht.</text></g><g data-zone="seq-schritte"><rect class="source-zone" x="45" y="200" width="650" height="85" rx="5" fill="none" stroke="#b9c4b6" stroke-dasharray="4 4"/><text x="57" y="222" font-family="Segoe UI,Arial" font-size="12" fill="#52685e">Die Schritte</text><text x="57" y="252" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#243d43">Erst jetzt hörte sie die Schritte auf dem Pflaster.</text></g><text x="45" y="469" fill="#52685e" font-family="Segoe UI,Arial" font-size="12">Haupttext und Randnotiz werden in den Ansichten unterschiedlich angeordnet.</text></svg>