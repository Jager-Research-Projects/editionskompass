<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-label="Historische Textgenese und moderne Git-Geschichte"><title>Historische Textgenese und moderne Git-Geschichte</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#60756c" stroke-width="1.5"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#243d43}.box{fill:#fffdf7;stroke:#b9c4b6}.decision{fill:#e7ecdf;stroke:#7f9686}.line{fill:none;stroke:#60756c;stroke-width:1.6;marker-end:url(#arrow)}.label{font-size:12px;fill:#52685e}.node{font-size:15px;font-weight:600}</style><text x="28" y="35" font-size="23">Zwei Geschichten derselben Stelle</text><rect x="25" y="75" width="440" height="66" rx="9" class="decision"/><text x="245.0" y="101" text-anchor="middle" class="node">Hartmanns Arbeit am Manuskript</text><text x="245.0" y="121" text-anchor="middle" class="node">Streichen · Ergänzen · Umordnen</text><rect x="495" y="75" width="440" height="66" rx="9" class="decision"/><text x="715.0" y="101" text-anchor="middle" class="node">Unsere Arbeit an der Edition</text><text x="715.0" y="121" text-anchor="middle" class="node">Lesen · Auszeichnen · Korrigieren</text><text x="48" y="185" font-size="17" text-decoration="line-through">Die Stadt lag vor ihr.</text><text x="48" y="221" font-size="17">Randzusatz: als gehörte sie nicht hierher</text><text x="518" y="185" font-size="17">Arbeitsstand: Thore → Tore</text><text x="518" y="221" font-size="17">Satzkorrektur: hierher → dorthin</text><text x="48" y="290" class="label">Historische Schreibhandlungen werden interpretiert.</text><text x="518" y="290" class="label">Git dokumentiert moderne Änderungen.</text><text x="28" y="343" font-size="16">Ein Commitdatum ist kein Datum einer historischen Schreibschicht.</text></svg>