<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" class="cascade-svg" role="img" aria-labelledby="cascade-title cascade-desc"><title id="cascade-title">Eine Ursache, mehrere Folgen: Ende der Universitätsanbindung</title><desc id="cascade-desc">Ein mögliches Ende der institutionellen Anbindung kann Repo-Zugang, Werkzeugberechtigung, Beratung und Publikationsdienste betreffen. Jede Bedingung wird einzeln geprüft. Migration, Werkzeugzugang, Dokumentation und Prüfung des Publikationswegs helfen, die Weiterarbeit zu ermöglichen.</desc><defs><marker id="cascade-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#9baeb4" stroke-width="1.5"/></marker></defs><rect width="1200" height="720" fill="#fffefb"/><g font-family="Arial, sans-serif"><path d="M600 100V145H157.5V210" stroke="#9baeb4" stroke-width="1.6" fill="none" marker-end="url(#cascade-arrow)"/><path d="M157.5 300V360" stroke="#9baeb4" stroke-width="1.6" fill="none" marker-end="url(#cascade-arrow)"/><path d="M157.5 445V490H600V550" stroke="#9baeb4" stroke-width="1.6" fill="none" marker-end="url(#cascade-arrow)"/><path d="M600 100V145H452.5V210" stroke="#9baeb4" stroke-width="1.6" fill="none" marker-end="url(#cascade-arrow)"/><path d="M452.5 300V360" stroke="#9baeb4" stroke-width="1.6" fill="none" marker-end="url(#cascade-arrow)"/><path d="M452.5 445V490H600V550" stroke="#9baeb4" stroke-width="1.6" fill="none" marker-end="url(#cascade-arrow)"/><path d="M600 100V145H747.5V210" stroke="#9baeb4" stroke-width="1.6" fill="none" marker-end="url(#cascade-arrow)"/><path d="M747.5 300V360" stroke="#9baeb4" stroke-width="1.6" fill="none" marker-end="url(#cascade-arrow)"/><path d="M747.5 445V490H600V550" stroke="#9baeb4" stroke-width="1.6" fill="none" marker-end="url(#cascade-arrow)"/><path d="M600 100V145H1042.5V210" stroke="#9baeb4" stroke-width="1.6" fill="none" marker-end="url(#cascade-arrow)"/><path d="M1042.5 300V360" stroke="#9baeb4" stroke-width="1.6" fill="none" marker-end="url(#cascade-arrow)"/><path d="M1042.5 445V490H600V550" stroke="#9baeb4" stroke-width="1.6" fill="none" marker-end="url(#cascade-arrow)"/><g ><rect x="390" y="25" width="420" height="75" rx="17" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.5"/><text x="600" y="56.5" text-anchor="middle" font-size="18" fill="#164b70">Ende der</text><text x="600" y="80.5" text-anchor="middle" font-size="18" fill="#164b70">Universitätsanbindung</text></g><rect x="480" y="125" width="240" height="34" rx="16" fill="#fffefb"/><text x="600" y="148" text-anchor="middle" font-size="16" fill="#52645b">kann mehrere Dienste betreffen</text><g role="img" aria-label="Repo-Zugang gefährdet?: Mögliche Folge · gesondert klären"><rect x="25" y="210" width="265" height="90" rx="17" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.5"/><text x="157.5" y="237" text-anchor="middle" font-size="18" fill="#164b70">Repo-Zugang</text><text x="157.5" y="261" text-anchor="middle" font-size="18" fill="#164b70">gefährdet?</text><text x="157.5" y="285" text-anchor="middle" font-size="14" fill="#164b70">Mögliche Folge · gesondert klären</text></g><g ><rect x="25" y="360" width="265" height="85" rx="17" fill="#f2f7fa" stroke="#bdced9" stroke-width="1.5"/><text x="157.5" y="384.5" text-anchor="middle" font-size="18" fill="#164b70">Arbeitsrepo umziehen</text><text x="157.5" y="408.5" text-anchor="middle" font-size="18" fill="#164b70">nach Anleitung</text><text x="157.5" y="432.5" text-anchor="middle" font-size="14" fill="#164b70">Bei entsprechendem Bedarf</text></g><g role="img" aria-label="oXygen-Berechtigung gefährdet?: Mögliche Folge · gesondert klären"><rect x="320" y="210" width="265" height="90" rx="17" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.5"/><text x="452.5" y="237" text-anchor="middle" font-size="18" fill="#164b70">oXygen-Berechtigung</text><text x="452.5" y="261" text-anchor="middle" font-size="18" fill="#164b70">gefährdet?</text><text x="452.5" y="285" text-anchor="middle" font-size="14" fill="#164b70">Mögliche Folge · gesondert klären</text></g><g ><rect x="320" y="360" width="265" height="85" rx="17" fill="#f2f7fa" stroke="#bdced9" stroke-width="1.5"/><text x="452.5" y="384.5" text-anchor="middle" font-size="18" fill="#164b70">Berechtigung klären oder</text><text x="452.5" y="408.5" text-anchor="middle" font-size="18" fill="#164b70">passendes Werkzeug wählen</text><text x="452.5" y="432.5" text-anchor="middle" font-size="14" fill="#164b70">Bei entsprechendem Bedarf</text></g><g role="img" aria-label="Beratung weiter verfügbar?: Mögliche Folge · gesondert klären"><rect x="615" y="210" width="265" height="90" rx="17" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.5"/><text x="747.5" y="237" text-anchor="middle" font-size="18" fill="#164b70">Beratung</text><text x="747.5" y="261" text-anchor="middle" font-size="18" fill="#164b70">weiter verfügbar?</text><text x="747.5" y="285" text-anchor="middle" font-size="14" fill="#164b70">Mögliche Folge · gesondert klären</text></g><g ><rect x="615" y="360" width="265" height="85" rx="17" fill="#f2f7fa" stroke="#bdced9" stroke-width="1.5"/><text x="747.5" y="384.5" text-anchor="middle" font-size="18" fill="#164b70">Anleitungen pflegen; bei Bedarf</text><text x="747.5" y="408.5" text-anchor="middle" font-size="18" fill="#164b70">Ersatzberatung vereinbaren</text><text x="747.5" y="432.5" text-anchor="middle" font-size="14" fill="#164b70">Bei entsprechendem Bedarf</text></g><g role="img" aria-label="Institutionelle Publikations- dienste weiter verfügbar?: Mögliche Folge · gesondert klären"><rect x="910" y="210" width="265" height="90" rx="17" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.5"/><text x="1042.5" y="237" text-anchor="middle" font-size="18" fill="#164b70">Institutionelle Publikations-</text><text x="1042.5" y="261" text-anchor="middle" font-size="18" fill="#164b70">dienste weiter verfügbar?</text><text x="1042.5" y="285" text-anchor="middle" font-size="14" fill="#164b70">Mögliche Folge · gesondert klären</text></g><g ><rect x="910" y="360" width="265" height="85" rx="17" fill="#f2f7fa" stroke="#bdced9" stroke-width="1.5"/><text x="1042.5" y="384.5" text-anchor="middle" font-size="18" fill="#164b70">Publikations-Host und</text><text x="1042.5" y="408.5" text-anchor="middle" font-size="18" fill="#164b70">Ausgabeweg prüfen</text><text x="1042.5" y="432.5" text-anchor="middle" font-size="14" fill="#164b70">Bei entsprechendem Bedarf</text></g><g ><rect x="430" y="550" width="340" height="65" rx="17" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.5"/><text x="600" y="588.5" text-anchor="middle" font-size="18" fill="#164b70">Weiterarbeit ermöglichen</text></g><text x="600" y="655" text-anchor="middle" font-size="16" fill="#173c39">Eine gemeinsame Ursache bedeutet nicht, dass alle Folgen eintreten.</text><text x="600" y="681" text-anchor="middle" font-size="14" fill="#52645b">Zugänge einzeln klären. Maßnahmen planen, prüfen und dokumentieren; ihre Wirkung ist noch nicht nachgewiesen.</text><text x="600" y="706" text-anchor="middle" font-size="12" fill="#52645b">Editionskompass · Anna · neutrale Übersicht · 20. Oktober 2026</text></g></svg>