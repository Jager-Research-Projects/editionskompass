<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" class="anna-flow" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">Anna: Wege vom Editionsprojekt zur Publikation</title><desc id="flow-desc">Arbeitsformat TEI oder Markdown; Zusammenführung bei Git-Quelldaten. Institutionelles oder anderes Hosting; eigenständige Wahl des Publikations-Hosts. Ein eigenes bereinigtes Publikationsrepo auf gleichem oder anderem Host führt zur geprüften Freigabe. Mögliche Ausgaben sind Daten mit vereinbarter Archivierung, Website und Druckfassung.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#9baeb4" stroke-width="1.5"/></marker><marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#173c39" stroke-width="1.5"/></marker></defs><rect width="900" height="1500" fill="#fffefb"/><g font-family="Arial, sans-serif"><path d="M450 87V135" fill="none" stroke="#9baeb4" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M450 199V230H210V270" fill="none" stroke="#9baeb4" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M450 199V230H690V270" fill="none" stroke="#9baeb4" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M210 350V385H450V410" fill="none" stroke="#9baeb4" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M690 350V385H450V410" fill="none" stroke="#9baeb4" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M450 478V535" fill="none" stroke="#9baeb4" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M450 599V630H210V670" fill="none" stroke="#9baeb4" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M450 599V630H690V670" fill="none" stroke="#9baeb4" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M210 750V785H450V815" fill="none" stroke="#9baeb4" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M690 750V785H450V815" fill="none" stroke="#9baeb4" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M450 879V910H210V950" fill="none" stroke="#9baeb4" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M450 879V910H690V950" fill="none" stroke="#9baeb4" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M210 1034V1070H450V1110" fill="none" stroke="#9baeb4" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M690 1034V1070H450V1110" fill="none" stroke="#9baeb4" stroke-width="1.6"  marker-end="url(#arrow)"/><path d="M450 1180V1225H150V1280" fill="none" stroke="#9baeb4" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M450 1180V1280" fill="none" stroke="#9baeb4" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M450 1180V1225H750V1280" fill="none" stroke="#9baeb4" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g aria-hidden="true"><rect x="132" y="224" width="156" height="32" rx="16" fill="#f7fbff" stroke="#c5d8e2"/><text x="210" y="246" text-anchor="middle" font-size="17" fill="#244d65">TEI</text></g><g aria-hidden="true"><rect x="612" y="224" width="156" height="32" rx="16" fill="#f7fbff" stroke="#c5d8e2"/><text x="690" y="246" text-anchor="middle" font-size="17" fill="#244d65">Markdown</text></g><g aria-hidden="true"><rect x="132" y="624" width="156" height="32" rx="16" fill="#f7fbff" stroke="#c5d8e2"/><text x="210" y="646" text-anchor="middle" font-size="17" fill="#244d65">Universität</text></g><g aria-hidden="true"><rect x="612" y="624" width="156" height="32" rx="16" fill="#f7fbff" stroke="#c5d8e2"/><text x="690" y="646" text-anchor="middle" font-size="17" fill="#244d65">Individuell</text></g><g aria-hidden="true"><rect x="132" y="904" width="156" height="32" rx="16" fill="#f7fbff" stroke="#c5d8e2"/><text x="210" y="926" text-anchor="middle" font-size="17" fill="#244d65">Gleicher Host</text></g><g aria-hidden="true"><rect x="612" y="904" width="156" height="32" rx="16" fill="#f7fbff" stroke="#c5d8e2"/><text x="690" y="926" text-anchor="middle" font-size="17" fill="#244d65">Anderer Host</text></g><g role="img" aria-label="Anna: Editionsprojekt" class="flow-node" id="flow-project"><title>Anna möchte einen historischen Text wissenschaftlich erschließen. Die Übersicht zeigt mögliche Wege. Eine hervorgehobene Auswahl bedeutet eine Planung, keine bereits ausgeführte Einrichtung.</title><rect x="280" y="25" width="340" height="62" rx="18" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.2" /><text x="450" y="63" text-anchor="middle" font-size="19" font-weight="600" fill="#164b70">Anna: Editionsprojekt</text></g><g role="img" aria-label="Arbeitsformat?" class="flow-node" id="flow-format"><title>TEI und Markdown sind zwei Arbeitswege. TEI bietet etablierte editorische Semantik; Markdown benötigt eigene Konventionen und bleibt die weniger bevorzugte Alternative. Beide können mit Git versioniert werden.</title><rect x="320" y="135" width="260" height="64" rx="18" fill="#f5faff" stroke="#bdced9" stroke-width="1.2" stroke-dasharray="4 4"/><text x="450" y="174" text-anchor="middle" font-size="19" font-weight="600" fill="#164b70">Arbeitsformat?</text></g><g role="img" aria-label="oXygen Author: TEI + vorbereitetes Schema" class="flow-node" id="flow-tei"><title>Anna wählt TEI und eine vorbereitete oXygen-Author-Umgebung. Schema, Vorlagen und Git-Anbindung erleichtern die Arbeit. Die Auswahl setzt das Arbeitsformat auf TEI; ein tatsächlicher Werkzeugzugang ist noch zu klären.</title><rect x="60" y="270" width="300" height="80" rx="18" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.2" /><text x="210" y="306" text-anchor="middle" font-size="19" font-weight="600" fill="#164b70">oXygen Author</text><text x="210" y="331" text-anchor="middle" font-size="16" font-weight="400" fill="#164b70">TEI + vorbereitetes Schema</text></g><g role="img" aria-label="Texteditor mit Vorschau: Markdown + Konventionen" class="flow-node" id="flow-markdown"><title>Anna kann mit Markdown arbeiten und regelmäßig eine Vorschau prüfen. Eigene Regeln für editorische Aussagen, IDs und Verweise sind nötig. Die Auswahl setzt den alternativen Arbeitsweg; sie behauptet keine TEI-vergleichbare Semantik.</title><rect x="540" y="270" width="300" height="80" rx="18" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.2" /><text x="690" y="306" text-anchor="middle" font-size="19" font-weight="600" fill="#164b70">Texteditor mit Vorschau</text><text x="690" y="331" text-anchor="middle" font-size="16" font-weight="400" fill="#164b70">Markdown + Konventionen</text></g><g role="img" aria-label="Git-gestützte Quelldaten" class="flow-node" id="flow-data"><title>Die beiden Formatwege führen wieder zusammen: Dateien und gespeicherte Änderungen werden mit Git versioniert. Unterschiedliche Semantik, Prüfungen und Ausgabewege bleiben bestehen.</title><rect x="280" y="410" width="340" height="68" rx="18" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.2" /><text x="450" y="451" text-anchor="middle" font-size="19" font-weight="600" fill="#164b70">Git-gestützte Quelldaten</text></g><g role="img" aria-label="Arbeits-Host?" class="flow-node" id="flow-workhost"><title>Hier geht es um den Ort des privaten Arbeitsrepos. Hosting und Beratung sind unterschiedliche Leistungen. Die Wahl legt den späteren Publikationsort nicht zwingend fest.</title><rect x="320" y="535" width="260" height="64" rx="18" fill="#f5faff" stroke="#bdced9" stroke-width="1.2" stroke-dasharray="4 4"/><text x="450" y="574" text-anchor="middle" font-size="19" font-weight="600" fill="#164b70">Arbeits-Host?</text></g><g role="img" aria-label="Institutionelles GitLab: Beratung gesondert klären" class="flow-node" id="flow-uni"><title>Anna kann ein institutionelles GitLab nutzen. Der Knoten wählt das Modellangebot mit Beratung; in der Auswahl links kann sie auch reines Hosting einstellen. Zugang, Beratung und langfristige Kontinuität sind konkret zu klären.</title><rect x="60" y="670" width="300" height="80" rx="18" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.2" /><text x="210" y="706" text-anchor="middle" font-size="19" font-weight="600" fill="#164b70">Institutionelles GitLab</text><text x="210" y="731" text-anchor="middle" font-size="16" font-weight="400" fill="#164b70">Beratung gesondert klären</text></g><g role="img" aria-label="GitHub / anderer Dienst: Zugang und Unterstützung klären" class="flow-node" id="flow-other"><title>Ein individuell gewählter geeigneter Dienst kann das private Arbeitsrepo aufnehmen. GitHub ist ein Beispiel. Anna klärt Konto, Verfügung, Unterstützung und Sicherungsweg. Ein anderer Dienst bestimmt noch keinen öffentlichen Publikationsort.</title><rect x="540" y="670" width="300" height="80" rx="18" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.2" /><text x="690" y="706" text-anchor="middle" font-size="19" font-weight="600" fill="#164b70">GitHub / anderer Dienst</text><text x="690" y="731" text-anchor="middle" font-size="16" font-weight="400" fill="#164b70">Zugang und Unterstützung klären</text></g><g role="img" aria-label="Publikations-Host?" class="flow-node" id="flow-pubhost"><title>Gleicher oder anderer Hostingdienst? Das ist eine andere Frage als dieselbes oder separates Repo. Für Anna bleibt ein eigenes Publikationsrepo mit bereinigten Dateien die bevorzugte Architektur – auf beiden Host-Wegen.</title><rect x="320" y="815" width="260" height="64" rx="18" fill="#f5faff" stroke="#bdced9" stroke-width="1.2" stroke-dasharray="4 4"/><text x="450" y="854" text-anchor="middle" font-size="19" font-weight="600" fill="#164b70">Publikations-Host?</text></g><g role="img" aria-label="Eigenes Publikationsrepo: auf demselben Host" class="flow-node" id="flow-same"><title>Anna plant ein separates öffentliches Publikationsrepo beim bisherigen Hostingdienst. Sie übernimmt nur geprüfte Dateien ohne private Arbeitsgeschichte. Gleicher Host bedeutet ausdrücklich nicht, das private Arbeitsrepo öffentlich zu machen.</title><rect x="60" y="950" width="300" height="84" rx="18" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.2" /><text x="210" y="988" text-anchor="middle" font-size="19" font-weight="600" fill="#164b70">Eigenes Publikationsrepo</text><text x="210" y="1013" text-anchor="middle" font-size="16" font-weight="400" fill="#164b70">auf demselben Host</text></g><g role="img" aria-label="Eigenes Publikationsrepo: auf einem anderen Host" class="flow-node" id="flow-different"><title>Anna kann privat auf dem Uni-GitLab arbeiten und einen bereinigten Stand etwa auf einem anderen Dienst publizieren. Auch hier ist es ein separates Publikationsrepo. Export, Zugriff und Ausgabeweg werden passend eingerichtet.</title><rect x="540" y="950" width="300" height="84" rx="18" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.2" /><text x="690" y="988" text-anchor="middle" font-size="19" font-weight="600" fill="#164b70">Eigenes Publikationsrepo</text><text x="690" y="1013" text-anchor="middle" font-size="16" font-weight="400" fill="#164b70">auf einem anderen Host</text></g><g role="img" aria-label="Geprüfter Release: nach bewusster Freigabe" class="flow-node" id="flow-release"><title>Die Wege laufen bei einer fachlich verantworteten Freigabe zusammen. Vorher werden Inhalt, Rechte, Metadaten, Attribution und erreichbare Publikationsgeschichte geprüft. Eine noch interne Arbeit oder ein Prüfausschnitt ist noch kein öffentlicher Release.</title><rect x="280" y="1110" width="340" height="70" rx="18" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.2" /><text x="450" y="1141" text-anchor="middle" font-size="19" font-weight="600" fill="#164b70">Geprüfter Release</text><text x="450" y="1166" text-anchor="middle" font-size="16" font-weight="400" fill="#164b70">nach bewusster Freigabe</text></g><g role="img" aria-label="Editionsdaten: + vereinbarte Archivübergabe" class="flow-node" id="flow-archive"><title>Freigegebene TEI- oder andere dokumentierte Editionsdaten werden nachnutzbar bereitgestellt. Archivträger, Metadaten und persistente Kennung sind zusätzlich zu vereinbaren. Ein Git-Host allein garantiert die Archivierung nicht.</title><rect x="20" y="1280" width="260" height="90" rx="18" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.2" /><text x="150" y="1321" text-anchor="middle" font-size="19" font-weight="600" fill="#164b70">Editionsdaten</text><text x="150" y="1346" text-anchor="middle" font-size="16" font-weight="400" fill="#164b70">+ vereinbarte Archivübergabe</text></g><g role="img" aria-label="Statische Website: z. B. über GitHub Pages" class="flow-node" id="flow-web"><title>Eine kleine Website macht Text und Kommentar ohne TEI-Kenntnisse lesbar. Die freigegebenen Daten benötigen einen passenden Ausgabeweg zu HTML. GitHub Pages ist ein möglicher statischer Hostingdienst; es erzeugt nicht automatisch eine Edition aus rohen TEI-Dateien.</title><rect x="320" y="1280" width="260" height="90" rx="18" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.2" /><text x="450" y="1321" text-anchor="middle" font-size="19" font-weight="600" fill="#164b70">Statische Website</text><text x="450" y="1346" text-anchor="middle" font-size="16" font-weight="400" fill="#164b70">z. B. über GitHub Pages</text></g><g role="img" aria-label="Optionale Druckfassung: mit oder ohne Verlag" class="flow-node" id="flow-print"><title>Aus einem geprüften Stand kann mit geeigneter Satzvorlage eine Druckfassung entstehen. Ein Verlag ist eine Chance mit Kosten-, Leistungs- und Rechtefragen. Spätere digitale Revisionen verändern verteilte Druckexemplare nicht.</title><rect x="620" y="1280" width="260" height="90" rx="18" fill="#e6f2fc" stroke="#bdced9" stroke-width="1.2" /><text x="750" y="1321" text-anchor="middle" font-size="19" font-weight="600" fill="#164b70">Optionale Druckfassung</text><text x="750" y="1346" text-anchor="middle" font-size="16" font-weight="400" fill="#164b70">mit oder ohne Verlag</text></g><text x="450" y="1405" text-anchor="middle" fill="#173c39" font-size="15">Gestrichelte Pfeile: mögliche Ausgaben nach einer geprüften Freigabe.</text><text x="450" y="1435" text-anchor="middle" fill="#173c39" font-size="14">Übersicht möglicher Wege · keine Auswahl vorgegeben</text><text x="450" y="1462" text-anchor="middle" fill="#52645b" font-size="13">Eigenes Publikationsrepo auf beiden Wegen. Aktuelle Auswahl ist Planung, kein Umsetzungsnachweis.</text><text x="450" y="1486" text-anchor="middle" fill="#52645b" font-size="12">Editionskompass · Anna · 20. Oktober 2026</text></g></svg>