<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1430" role="img" aria-labelledby="graph-title-export graph-desc-export"><title id="graph-title-export">Entscheidungswege für Rätselhaft!</title><desc id="graph-desc-export">Publikationsstruktur, lokaler Zugang und Versionsbezug bestimmen die Nutzung. Pflegewege führen unter unterschiedlichen Voraussetzungen zum Erhalt der Daten.</desc><defs><marker id="arrow-export" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7a8d83"/></marker></defs><style>.node{fill:#edf0e6;stroke:#9bab9f;stroke-width:1.5}.selected{fill:#233b42;stroke:#233b42}.label{font:17px 'Segoe UI',Arial;text-anchor:middle;fill:#233b42}.selected-label{fill:#fffdf7}.question{font:20px Georgia;text-anchor:middle;fill:#9b4734}.edge{stroke:#94a397;stroke-width:1.6;fill:none;marker-end:url(#arrow-export)}.choice{cursor:pointer}.choice:focus rect{stroke:#ac492f;stroke-width:4}</style><rect width="1100" height="1430" fill="#fffdf7"/><text x="550" y="45" class="label" style="font-size:28px;font-weight:bold">Ein Korpus. Mehrere tragfähige Wege.</text><text x="550" y="76" class="label">Neutrale Übersicht · Voraussetzungen gemeinsam prüfen</text><text x="550" y="135" class="question">Wie finden andere den maßgeblichen Bestand?</text><g ><rect x="40" y="165" width="500" height="65" rx="10" class="node"/><text class="label" x="290" y="203.5">Kuratierter Bestand mit Einstieg</text></g><path class="edge" d="M290 230L550 280"/><g ><rect x="560" y="165" width="500" height="65" rx="10" class="node"/><text class="label" x="810" y="203.5">Gewachsene Arbeitsablage</text></g><path class="edge" d="M810 230L550 280"/><g ><rect x="160" y="280" width="780" height="65" rx="10" class="node"/><text class="label" x="550" y="318.5">Aufgabe: maßgebliche Daten, Regeln und Einstieg sichtbar machen</text></g><path class="edge" d="M550 345L550 390"/><text x="550" y="425" class="question">Wie beginnt die lokale Untersuchung?</text><g ><rect x="40" y="455" width="500" height="65" rx="10" class="node"/><text class="label" x="290" y="493.5">Versionierte vollständige Downloads</text></g><path class="edge" d="M290 520L550 570"/><g ><rect x="560" y="455" width="500" height="65" rx="10" class="node"/><text class="label" x="810" y="493.5">Nur über den laufenden Server</text></g><path class="edge" d="M810 520L550 570"/><g ><rect x="160" y="570" width="780" height="65" rx="10" class="node"/><text class="label" x="550" y="608.5">Aufgabe: Daten unabhängig von Server und Team nutzbar anbieten</text></g><path class="edge" d="M550 635L550 680"/><text x="550" y="715" class="question">Welche Fassung wird untersucht?</text><g ><rect x="40" y="745" width="326.6666666666667" height="65" rx="10" class="node"/><text class="label" x="203.33333333333334" y="783.5">Geprüfter Release + Archiv</text></g><path class="edge" d="M203.33333333333334 810L550 860"/><g ><rect x="386.6666666666667" y="745" width="326.6666666666667" height="65" rx="10" class="node"/><text class="label" x="550" y="783.5">Exakter Commitstand</text></g><path class="edge" d="M550 810L550 860"/><g ><rect x="733.3333333333334" y="745" width="326.6666666666667" height="65" rx="10" class="node"/><text class="label" x="896.6666666666667" y="783.5">Jeweils aktueller main</text></g><path class="edge" d="M896.6666666666667 810L550 860"/><g ><rect x="160" y="860" width="780" height="65" rx="10" class="node"/><text class="label" x="550" y="898.5">Aufgabe: Daten, Auswahl und Verfahren nachvollziehbar bezeichnen</text></g><path class="edge" d="M550 925L550 970"/><text x="550" y="1005" class="question">Welche Zusage gilt nach Förderende?</text><g ><rect x="40" y="1035" width="240" height="65" rx="10" class="node"/><text class="label" x="160" y="1073.5">Aktiv pflegen</text></g><path class="edge" d="M160 1100L550 1150"/><g ><rect x="300" y="1035" width="240" height="65" rx="10" class="node"/><text class="label" x="420" y="1073.5">Konservierend</text></g><path class="edge" d="M420 1100L550 1150"/><g ><rect x="560" y="1035" width="240" height="65" rx="10" class="node"/><text class="label" x="680" y="1073.5">Übertragen</text></g><path class="edge" d="M680 1100L550 1150"/><g ><rect x="820" y="1035" width="240" height="65" rx="10" class="node"/><text class="label" x="940" y="1073.5">Abgeschlossen</text></g><path class="edge" d="M940 1100L550 1150"/><g ><rect x="160" y="1150" width="780" height="65" rx="10" class="node"/><text class="label" x="550" y="1188.5">Gemeinsam: verständliche Daten erhalten und Zusage sichtbar machen</text></g><text x="550" y="1350" class="label">Alle Wege: geprüfte Releases, verständliche Dokumentation und getestete Übergabe.</text><text x="550" y="1384" class="label">Wechsel brauchen erneute Prüfung; unterschiedliche Wege bedeuten unterschiedliche Arbeit.</text></svg>