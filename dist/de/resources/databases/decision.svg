<svg xmlns="http://www.w3.org/2000/svg" width="900" height="760" viewBox="0 0 900 760" role="img" aria-labelledby="title desc" xml:lang="de"><title id="title">Entscheidungsgraph</title><desc id="desc">Vom praktischen Abfragebedarf zum Arbeitsmodell und zur Betriebsvereinbarung.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#52685e"/></marker></defs><rect width="900" height="760" fill="#fffdf7"/><g font-family="Segoe UI,Arial,sans-serif" fill="#243d43"><text x="30" y="32" font-size="24" font-weight="bold">Entscheidungsgraph</text><g><rect x="180" y="65" width="540" height="65" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="450.0" y="97.5" text-anchor="middle" font-size="15">Drei reale Abfragen und zwei Webfunktionen prüfen</text></g><g><rect x="30" y="185" width="340" height="70" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="200.0" y="220.0" text-anchor="middle" font-size="15">Dateiabfragen genügen</text></g><g><rect x="465" y="185" width="400" height="70" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="665.0" y="220.0" text-anchor="middle" font-size="15">Ein indizierter Dienst bringt Nutzen</text></g><g><rect x="30" y="330" width="270" height="75" rx="8" fill="#e7ecdf" stroke="#52685e"/><text x="165.0" y="367.5" text-anchor="middle" font-size="15">A · Git + XML-Werkzeuge</text></g><g><rect x="370" y="330" width="235" height="75" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="487.5" y="367.5" text-anchor="middle" font-size="15">Bearbeitung in Git</text></g><g><rect x="630" y="330" width="235" height="75" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="747.5" y="367.5" text-anchor="middle" font-size="15">Bearbeitung in der DB</text></g><g><rect x="335" y="465" width="285" height="75" rx="8" fill="#e7ecdf" stroke="#52685e"/><text x="477.5" y="502.5" text-anchor="middle" font-size="15">B · Geprüfter Import</text></g><g><rect x="640" y="465" width="235" height="75" rx="8" fill="#e7ecdf" stroke="#52685e"/><text x="757.5" y="492.5" text-anchor="middle" font-size="15">C · Definierter Export nach</text><text x="757.5" y="512.5" text-anchor="middle" font-size="15">Git</text></g><g><rect x="280" y="600" width="595" height="60" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="577.5" y="630.0" text-anchor="middle" font-size="15">Betrieb und XML-Kompetenz verbindlich klären</text></g><g><rect x="30" y="690" width="845" height="55" rx="8" fill="#fffdf7" stroke="#52685e"/><text x="452.5" y="717.5" text-anchor="middle" font-size="15">Öffentlichen Weiterbetrieb oder eigenständige Abschlussausgabe vereinbaren</text></g><path d="M360 130 L200 185" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><path d="M540 130 L665 185" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><path d="M200 255 L165 330" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><path d="M600 255 L490 330" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 255 L750 330" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 405 L475 465" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 405 L750 465" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><path d="M475 540 L475 600" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 540 L750 600" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><path d="M450 660 L450 690" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/><path d="M165 405 L165 690" fill="none" stroke="#52685e" stroke-width="2" marker-end="url(#arrow)"/></g></svg>