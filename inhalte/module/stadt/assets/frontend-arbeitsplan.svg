<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 410" role="img" aria-label="Arbeitsplanvergleich Frontendentwicklung"><title>Vom späten Frontendblock zur gestuften Entwicklung</title><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#243d43}</style><text x="25" y="35" font-size="24">Frontend: früh vorbereiten, am Pilotbestand ausbauen</text><path d="M930 65V356" stroke="#a94a32" stroke-dasharray="5 5"/><text x="850" y="65" font-size="12">Förderende</text><text x="25" y="100" font-size="16">Arbeitsplan im Antrag</text><text x="25" y="135" font-size="13">Editionsarbeit</text><rect x="270" y="116" width="510" height="28" rx="3" fill="#627f71"/><text x="25" y="183" font-size="13">Frontendausbau</text><rect x="740" y="164" width="190" height="28" rx="3" fill="#a94a32"/><text x="740" y="213" font-size="12">Wenig Zeit für Rückmeldungen</text><text x="25" y="259" font-size="16">Angepasster Arbeitsplan</text><rect x="270" y="280" width="100" height="30" rx="3" fill="#b9c4b6" stroke="#627f71"/><text x="320.0" y="335" text-anchor="middle" font-size="13">Vorlauf</text><rect x="420" y="280" width="130" height="30" rx="3" fill="#849b87" stroke="#627f71"/><text x="485.0" y="335" text-anchor="middle" font-size="13">Pilot</text><rect x="555" y="280" width="230" height="30" rx="3" fill="#627f71" stroke="#627f71"/><text x="670.0" y="335" text-anchor="middle" font-size="13">Ausbau</text><rect x="815" y="280" width="115" height="30" rx="3" fill="#e1e8df" stroke="#627f71"/><text x="872.5" y="335" text-anchor="middle" font-size="13">Optimieren</text><path d="M800 270V320" stroke="#a94a32" stroke-width="2"/><text x="800" y="360" text-anchor="middle" font-size="12">Kernabnahme</text><text x="25" y="394" font-size="13">Ausbau beginnt mit repräsentativer TEI. Rückmeldungen und Optimierungen begleiten die Editionsarbeit.</text></svg>