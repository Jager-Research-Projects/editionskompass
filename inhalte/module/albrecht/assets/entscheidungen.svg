<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1480" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Entscheidungswege der Akademieedition</title><desc id="dg-desc">Organisation, Betrieb, Repository-Zuschnitt und Datenpflege verzweigen und führen zur gemeinsamen Integration zusammen. Nach Begutachtung und Freigaben werden Verlag, öffentliche Daten und Archiv bedient. Modell- und Hostwechsel benötigen erneute Prüfung.</desc><defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7e8c87"/></marker></defs><style>.dg-box{fill:#f1f4ed;stroke:#a6b6ae;stroke-width:1.5}.dg-choice{cursor:pointer}.dg-choice:focus rect{stroke:#a54b35;stroke-width:4}.dg-selected{fill:#233b42;stroke:#233b42}.dg-t{font:17px 'Segoe UI',Arial,sans-serif;fill:#233b42;text-anchor:middle}.dg-selected-text{fill:white}.dg-label{font:16px 'Segoe UI',Arial,sans-serif;fill:#a54b35;text-anchor:middle}.dg-line{fill:none;stroke:#a6b6ae;stroke-width:1.6;marker-end:url(#dg-arrow)}.dg-note{font:15px 'Segoe UI',Arial,sans-serif;fill:#516169;text-anchor:middle}</style><rect width="1100" height="1480" fill="#fffdf8"/><text x="550" y="40" class="dg-t" style="font-size:26px;font-weight:bold">Akademieedition: Entscheidungen verbinden</text><text x="550" y="72" class="dg-note">Neutrale Übersicht · mehrere Wege können tragfähig sein</text><path class="dg-line" d="M550 94L195 158"/><g ><rect x="35" y="158" width="320" height="64" rx="12" class="dg-box"/><text x="195" y="196" class="dg-t">Autonome Bandredaktionen</text></g><path class="dg-line" d="M195 222L550 277"/><path d="M550 94L550 102" fill="none" stroke="#a6b6ae" stroke-width="1.6"/><path class="dg-line" d="M550 144L550 158"/><g ><rect x="390" y="158" width="320" height="64" rx="12" class="dg-box"/><text x="550" y="196" class="dg-t">Föderierte Arbeitsgruppen</text></g><path class="dg-line" d="M550 222L550 277"/><path class="dg-line" d="M550 94L905 158"/><g ><rect x="745" y="158" width="320" height="64" rx="12" class="dg-box"/><text x="905" y="196" class="dg-t">Zentrale Redaktion</text></g><path class="dg-line" d="M905 222L550 277"/><text x="550" y="130" class="dg-label">Wer entscheidet gemeinsam?</text><circle cx="550" cy="280" r="4" fill="#a6b6ae"/><path class="dg-line" d="M550 284L195 363"/><g ><rect x="35" y="363" width="320" height="64" rx="12" class="dg-box"/><text x="195" y="401" class="dg-t">Federführende Universität</text></g><path class="dg-line" d="M195 427L550 482"/><path d="M550 284L550 307" fill="none" stroke="#a6b6ae" stroke-width="1.6"/><path class="dg-line" d="M550 349L550 363"/><g ><rect x="390" y="363" width="320" height="64" rx="12" class="dg-box"/><text x="550" y="401" class="dg-t">Gemeinsamer Akademieträger</text></g><path class="dg-line" d="M550 427L550 482"/><path class="dg-line" d="M550 284L905 363"/><g ><rect x="745" y="363" width="320" height="64" rx="12" class="dg-box"/><text x="905" y="401" class="dg-t">Externer Dienst</text></g><path class="dg-line" d="M905 427L550 482"/><text x="550" y="335" class="dg-label">Wer trägt den Betrieb?</text><circle cx="550" cy="485" r="4" fill="#a6b6ae"/><path class="dg-line" d="M550 489L195 568"/><g ><rect x="35" y="568" width="320" height="64" rx="12" class="dg-box"/><text x="195" y="606" class="dg-t">Ein Gesamtrepo</text></g><path class="dg-line" d="M195 632L550 687"/><path d="M550 489L550 512" fill="none" stroke="#a6b6ae" stroke-width="1.6"/><path class="dg-line" d="M550 554L550 568"/><g ><rect x="390" y="568" width="320" height="64" rx="12" class="dg-box"/><text x="550" y="606" class="dg-t">Bereiche + Standards</text></g><path class="dg-line" d="M550 632L550 687"/><path class="dg-line" d="M550 489L905 568"/><g ><rect x="745" y="568" width="320" height="64" rx="12" class="dg-box"/><text x="905" y="606" class="dg-t">Band-/Paketrepos</text></g><path class="dg-line" d="M905 632L550 687"/><text x="550" y="540" class="dg-label">Wie werden Arbeitsrepos zugeschnitten?</text><circle cx="550" cy="690" r="4" fill="#a6b6ae"/><path class="dg-line" d="M550 694L195 773"/><g ><rect x="35" y="773" width="320" height="64" rx="12" class="dg-box"/><text x="195" y="811" class="dg-t">Git-zentriert</text></g><path class="dg-line" d="M195 837L550 892"/><path d="M550 694L550 717" fill="none" stroke="#a6b6ae" stroke-width="1.6"/><path class="dg-line" d="M550 759L550 773"/><g ><rect x="390" y="773" width="320" height="64" rx="12" class="dg-box"/><text x="550" y="811" class="dg-t">Hybrid: Zuständigkeit je Datenart</text></g><path class="dg-line" d="M550 837L550 892"/><path class="dg-line" d="M550 694L905 773"/><g ><rect x="745" y="773" width="320" height="64" rx="12" class="dg-box"/><text x="905" y="811" class="dg-t">Datenbank-zentriert</text></g><path class="dg-line" d="M905 837L550 892"/><text x="550" y="745" class="dg-label">Wo liegt die maßgebliche Datenpflege?</text><circle cx="550" cy="895" r="4" fill="#a6b6ae"/><path class="dg-line" d="M550 899L550 970"/><g ><rect x="260" y="970" width="580" height="64" rx="12" class="dg-box"/><text x="550" y="1008" class="dg-t">Geprüfte Datenpakete → gemeinsame Integration</text></g><path class="dg-line" d="M550 1034L550 1080"/><g ><rect x="260" y="1080" width="580" height="64" rx="12" class="dg-box"/><text x="550" y="1118" class="dg-t">Fixierter Prüfstand, Gutachten, Nachbearbeitung</text></g><path class="dg-line" d="M550 1144L550 1190"/><g ><rect x="260" y="1190" width="580" height="64" rx="12" class="dg-box"/><text x="550" y="1228" class="dg-t">Wissenschaftliche und passende rechtliche Freigaben</text></g><path class="dg-line" d="M550 1254L195 1300"/><g ><rect x="35" y="1300" width="320" height="64" rx="12" class="dg-box"/><text x="195" y="1338" class="dg-t">Verlagspaket → Buch</text></g><path class="dg-line" d="M550 1254L550 1300"/><g ><rect x="390" y="1300" width="320" height="64" rx="12" class="dg-box"/><text x="550" y="1338" class="dg-t">Öffentliche Daten → Web</text></g><path class="dg-line" d="M550 1254L905 1300"/><g ><rect x="745" y="1300" width="320" height="64" rx="12" class="dg-box"/><text x="905" y="1338" class="dg-t">Ergebnisse + geschützter Prozess</text></g><text x="550" y="1405" class="dg-note">Rückwege: Gutachten und Satzkorrekturen zurück in die maßgeblichen Daten.</text><text x="550" y="1432" class="dg-note">Host-/Modellwechsel: Export, Zuständigkeiten und Wiederaufbau erneut prüfen.</text><text x="550" y="1459" class="dg-note">Gemeinsam: Handbuch, wissenschaftliche Mandate und geregelte Zugänge.</text></svg>