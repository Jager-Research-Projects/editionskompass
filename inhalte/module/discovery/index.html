*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}a{color:#10674e}a:hover{text-decoration-thickness:2px}.shell{max-width:1120px;margin:auto;padding:0 22px}header{background:#102e27;color:white}header .shell{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:15px;padding-bottom:15px}.brand{font-weight:850;font-size:1.18rem;letter-spacing:-.035em}header nav{display:flex;gap:7px;flex-wrap:wrap}.navbtn{border:1px solid #658076;background:transparent;color:#fff;padding:9px 12px;border-radius:999px}.navbtn.active,.navbtn:hover{background:#fff;color:#123c31}main{padding-top:30px;padding-bottom:60px}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:24px;align-items:center}.eyebrow{font-size:.76rem;font-weight:800;color:#12694e;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:clamp(2.2rem,5.5vw,4rem);line-height:1.06;letter-spacing:-.065em;margin:12px 0}.hero p{font-size:1.1rem;line-height:1.65;color:#465c55}.art{background:#e2ece2;min-height:260px;border-radius:26px;display:flex;align-items:center;justify-content:center;padding:15px}.art svg{width:100%;max-width:360px}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.btn{border:0;background:#12694e;color:white;padding:13px 17px;border-radius:13px;font-weight:750;box-shadow:0 3px 0 #0c4b38}.btn:hover{background:#0b523c}.btn.secondary{background:#e0ebe2;color:#173c32;box-shadow:none}.btn.ghost{background:white;color:#29473b;border:1px solid var(--line);box-shadow:none}.btn:disabled{opacity:.48;cursor:not-allowed}.small{font-size:.86rem}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:25px;box-shadow:0 12px 34px #1730290a;margin-top:20px}.panel h2{font-size:1.65rem;letter-spacing:-.045em;margin:5px 0 12px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.stat{background:#e5ede7;border-radius:16px;padding:14px}.stat strong{display:block;font-size:1.75rem;line-height:1.3}.stat span{color:#526b5e;font-size:.82rem}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0}.mode{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.mode h3{margin:5px 0}.mode p{line-height:1.55;color:var(--muted)}.tag{font-weight:800;font-size:.72rem;letter-spacing:.08em;color:#12694e;text-transform:uppercase}.question{font-size:clamp(1.35rem,3vw,2rem);letter-spacing:-.035em;line-height:1.35;margin:15px 0 22px}.answer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{display:block;text-align:left;padding:21px;border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font-weight:700;min-height:94px;line-height:1.45}.choice:hover:not(:disabled){border-color:var(--green);background:#f1faf4}.choice.selected{border-color:var(--green);background:#e5f5e9}.choice:disabled{cursor:default}.choice.correct{border-color:#147950;background:#e7f7ee}.choice.wrong{border-color:#b95b42;background:#faeee9}.feedback{border-left:5px solid #198057;background:#f1f7ef;padding:18px 21px;margin-top:19px;border-radius:0 15px 15px 0}.feedback.wrong{border-color:var(--coral);background:#fcf3ee}.feedback h3{margin:0 0 10px}.detail{line-height:1.68;color:#29483d}.detail p{margin:9px 0}.detail strong{color:#12382a}.pill{display:inline-block;border-radius:999px;background:#e8efe9;color:#476051;font-size:.77rem;padding:6px 10px;margin:3px 5px 3px 0}.progress{height:8px;background:#e2e9e4;border-radius:10px;overflow:hidden;margin:14px 0 22px}.bar{height:100%;background:#15835a;transition:width .2s}.smallcaps{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#4d7262}.relations{display:grid;gap:12px}.edge{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fbfdf9}.edge p{line-height:1.5;margin:6px 0}.edge-header{display:flex;align-items:center;flex-wrap:wrap;gap:9px}.edge button{border:0;background:#e4eee5;color:#0e5d45;border-radius:9px;padding:8px 10px;font-weight:700}.edge button:hover{background:#cfe5d2}.search{width:100%;padding:13px 15px;border-radius:12px;border:1px solid #b8c9bd;background:white}.browse-list{display:grid;gap:9px;max-height:410px;overflow:auto}.browse-item{display:block;text-align:left;background:#f7faf7;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);width:100%}.browse-item:hover{background:#eaf5eb}.gloss{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gloss article{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fafcf9}.gloss strong{color:#12694e}.gloss p{line-height:1.5;margin:7px 0 0}.boxnote{background:#f5f8f4;border-radius:12px;padding:12px 15px;color:#526b5d;font-size:.9rem}.sources a{overflow-wrap:anywhere}.printhead{display:none}.subtle{font-size:.88rem;color:#567166}.printcard{border-bottom:1px solid #ddd;padding:15px 0}.printcard h3{margin:0 0 8px}.printcard p{margin:7px 0}.hidden{display:none!important}footer{border-top:1px solid var(--line);padding:24px 0 45px;color:var(--muted);font-size:.87rem}.printcontrols{display:flex;gap:15px;flex-wrap:wrap;align-items:center}.printcontrols label{display:flex;align-items:center;gap:8px}select{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.chip-button{border:0;border-radius:999px;background:#e1eee4;padding:6px 9px;color:#135a43;margin:3px;font-size:.8rem}.chip-button:hover{background:#bce0c5}.source-list{line-height:1.8}.source-list a{overflow-wrap:anywhere}

.sourcebox{background:#edf5ee;padding:16px 18px;border-radius:14px;margin:20px 0}.sourcebox ul{margin:8px 0;padding-left:21px}.sourcebox li{margin:6px 0}.explain-part h3{font-size:1.04rem;margin:19px 0 4px;color:#14543e}.explain-part p{margin:3px 0 9px;line-height:1.68}.termchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.edge{padding:15px 0;border-bottom:1px solid var(--line)}.edge h3{margin:8px 0}.edge p{line-height:1.6}@media print{.sourcebox{break-inside:avoid}.sourcebox a{overflow-wrap:anywhere}}.langswitch{display:flex;gap:3px;border:1px solid #658076;border-radius:999px;padding:3px}.langbtn{background:transparent;border:0;color:white;border-radius:999px;padding:6px 10px;font-weight:750}.langbtn.selected{color:#102e27;background:white}@media print{.langswitch{display:none}}</style></head><body><header class="noprint"><div class="shell"><div class="brand">◈ Git-Entdeckungsreise</div><nav><button class="navbtn active" data-page="home">Start</button><button class="navbtn" data-page="quiz">Quiz</button><button class="navbtn" data-page="explore">Verbindungen</button><button class="navbtn" data-page="glossary">Glossar</button><button class="navbtn" data-page="print">Merkliste / PDF</button></nav><div class="langswitch" role="group" aria-label="Language / Sprache"><button class="langbtn selected" data-lang="de" aria-pressed="true">DE</button><button class="langbtn" data-lang="en" aria-pressed="false">EN</button></div></div></header><main class="shell" id="app"></main><footer class="noprint"><div class="shell">Git-Entdeckungsreise · Eigenständig nutzbare HTML-Datei · Alle Inhalte stammen aus den drei Git-Arbeitssammlungen. Verknüpfungen sind begründete Interpretationen, keine zwingenden Kausalbehauptungen. Ergebnisse bleiben nur in diesem geöffneten Browserfenster gespeichert.</div></footer>
<script id="data" type="application/json">{"nodes": [{"id": "M01", "kind": "M", "section": "Plattformen, Zugänglichkeit und lokale Nutzung", "title": "GitHub ist öffentlich, GitLab ist privat.", "claim": "GitHub ist öffentlich, GitLab ist privat.", "sources": [], "kernel": "GitHub ist besonders als Plattform für öffentlich sichtbare Softwareprojekte bekannt; GitLab wird oft auch auf institutionseigenen Servern eingesetzt.", "fallacy": "Die Wahl von GitLab garantiert automatisch, dass nur Projektbeteiligte Zugriff haben und personenbezogene Daten unproblematisch sind.", "detail": "Sowohl GitHub als auch GitLab unterstützen je nach Angebot private und öffentliche Repositorien (also verwaltete Projektverzeichnisse samt Versionsgeschichte). Entscheidend sind Sichtbarkeitseinstellungen, Benutzerrechte, Serverbetrieb, externe Kopien und der tatsächliche Umgang mit Daten. „Privat“ bezeichnet eine Zugriffseinstellung, keine umfassende datenschutzrechtliche Bewertung.", "punch": "Privater Zugang ist nicht dasselbe wie Datenschutz.", "en": {"title": "GitHub is public; GitLab is private.", "claim": "GitHub is public; GitLab is private.", "detail": "Depending on the offer, both GitHub and GitLab support private and public repositories (i.e. managed project directories with version history). Visibility settings, user rights, server operation, external copies and the actual handling of data are crucial. \"Private is an access setting, not a comprehensive data protection assessment.", "label": "Explanation"}}, {"id": "M02", "kind": "M", "section": "Plattformen, Zugänglichkeit und lokale Nutzung", "title": "Git ist GitHub.", "claim": "Git ist GitHub.", "sources": [], "kernel": "Viele kennen Git vor allem über GitHub.", "fallacy": "Wer Git benutzt, muss GitHub verwenden; Funktionen und Regeln von GitHub seien Eigenschaften von Git.", "detail": "Git ist die Versionsverwaltungssoftware; GitHub ist ein Dienst, der Git-Repositorien verwaltet und zusätzliche Funktionen anbietet. Gleiches gilt für GitLab und andere Anbieter. Git funktioniert auch ganz ohne Hosting-Plattform.", "punch": "Technologie und Plattform sind nicht identisch.", "en": {"title": "Git is the same as GitHub.", "claim": "Git is the same as GitHub.", "detail": "Git is the version management software; GitHub is a service that manages Git repositories and offers additional functions. The same applies to GitLab and other providers. Git also works without any hosting platform.", "label": "Explanation"}}, {"id": "M03", "kind": "M", "section": "Plattformen, Zugänglichkeit und lokale Nutzung", "title": "Git ist zu komplex für die editorische Alltagsarbeit.", "claim": "Git ist zu komplex für die editorische Alltagsarbeit.", "sources": [], "kernel": "Git hat viele Funktionen, Fachbegriffe und mögliche Bedienwege; umfassende Kenntnisse erfordern Einarbeitung.", "fallacy": "Deshalb können nur technisch versierte Personen mit Git arbeiten.", "detail": "Grafische Bedienoberflächen sowie Integrationen in Arbeitsprogramme – etwa die Git-Unterstützung im Oxygen XML Editor – vereinfachen häufige Aufgaben wie Änderungen speichern, vergleichen und mit dem gemeinsamen Projektstand abgleichen. Grundbegriffe und ein sorgfältiger Umgang mit Konflikten bleiben wichtig; niemand muss dafür sämtliche Befehle kennen.", "punch": "Die Komplexität der Software ist nicht gleich der Komplexität ihrer Bedienung.", "en": {"title": "Git is too complex for everyday editorial work.", "claim": "Git is too complex for everyday editorial work.", "detail": "Graphic user interfaces as well as integrations into work programs – such as Git support in the Oxygen XML Editor – simplify frequent tasks such as saving, comparing and matching changes with the common project status. Basic concepts and a careful handling of conflicts remain important; no one needs to know all commands for this.", "label": "Explanation"}}, {"id": "M04", "kind": "M", "section": "Plattformen, Zugänglichkeit und lokale Nutzung", "title": "Git ist ausschließlich ein Teamwerkzeug.", "claim": "Git ist ausschließlich ein Teamwerkzeug.", "sources": [], "kernel": "Git unterstützt parallele Arbeit und die Zusammenführung von Änderungen verschiedener Personen.", "fallacy": "Für Einzelpersonen lohnt es sich nicht.", "detail": "Auch allein lassen sich frühere Dateistände wiederherstellen, Experimente durchführen und der eigene Bearbeitungsverlauf nachvollziehen. Dies kann etwa bei Transkription und TEI-Auszeichnung hilfreich sein.", "punch": "Git ermöglicht Teamarbeit, setzt sie aber nicht voraus.", "en": {"title": "Git is only useful for teams.", "claim": "Git is only useful for teams.", "detail": "Even earlier file versions can be restored, experiments can be carried out and the own processing process can be understood. This can be helpful for example with transcription and TEI markup.", "label": "Explanation"}}, {"id": "M05", "kind": "M", "section": "Plattformen, Zugänglichkeit und lokale Nutzung", "title": "Für Git braucht man einen Server und Internetzugang.", "claim": "Für Git braucht man einen Server und Internetzugang.", "sources": [], "kernel": "Viele Projekte synchronisieren ihre Arbeit mit einem Repositorium auf einem Server.", "fallacy": "Ohne GitHub, GitLab oder eine institutionelle Infrastruktur ist Git nutzlos.", "detail": "Git kann vollständig lokal auf einem einzelnen Rechner arbeiten. Erst für die Synchronisierung mit anderen Rechnern oder Menschen wird üblicherweise eine zusätzliche Kopie an anderer Stelle eingerichtet. Ein Commit ist dabei ein bewusst gespeicherter Versionsstand; dafür ist keine Netzwerkverbindung erforderlich.", "punch": "Lokale Versionsverwaltung braucht keine Plattform.", "en": {"title": "Git requires a server and internet access.", "claim": "Git requires a server and internet access.", "detail": "Git can work completely locally on a single computer. Only for synchronisation with other computers or people is an additional copy usually set up elsewhere. A commit is a deliberately stored version; for this no network connection is required.", "label": "Explanation"}}, {"id": "M06", "kind": "M", "section": "Plattformen, Zugänglichkeit und lokale Nutzung", "title": "Git ist eine neutrale technische Lösung ohne Folgen für die Arbeitskultur.", "claim": "Git ist eine neutrale technische Lösung ohne Folgen für die Arbeitskultur.", "sources": [], "kernel": "Git ist zunächst ein Werkzeug zur Verwaltung von Dateiversionen.", "fallacy": "Seine Einführung verändere nur die Technik, nicht die Organisation, Bewertung oder Sichtbarkeit von Arbeit.", "detail": "Die Wahl von Abläufen, Zugriffsmöglichkeiten und Auswertungen beeinflusst, welche Tätigkeiten dokumentiert werden, wer Änderungen freigeben darf und wie Beiträge wahrgenommen werden. Aus einem Werkzeug können implizite Erwartungen an Arbeitsrhythmus und Rechenschaft entstehen.", "punch": "Technische Infrastruktur gestaltet soziale Praxis mit.", "en": {"title": "Git is a neutral tool with no influence on working culture.", "claim": "Git is a neutral tool with no influence on working culture.", "detail": "The choice of processes, access options and evaluations influences which activities are documented, who is allowed to release changes and how contributions are perceived. An implicit expectation of work rhythm and accountability can arise from a tool.", "label": "Explanation"}}, {"id": "M07", "kind": "M", "section": "Sichtbarkeit, Löschen und personenbezogene Daten", "title": "Eine gelöschte Datei ist aus Git verschwunden.", "claim": "Eine gelöschte Datei ist aus Git verschwunden.", "sources": [], "kernel": "Im aktuellen Projektstand ist eine gelöschte Datei nicht mehr sichtbar.", "fallacy": "Damit seien ihre Inhalte endgültig entfernt.", "detail": "Frühere gespeicherte Versionsstände können die Datei weiterhin enthalten. Ein tatsächliches Entfernen aus der Versionsgeschichte verlangt besondere Maßnahmen und berücksichtigt noch nicht automatisch Kopien bei anderen Beteiligten.", "punch": "Aus dem aktuellen Stand gelöscht heißt nicht aus der Geschichte gelöscht.", "en": {"title": "Deleting a file removes it from Git.", "claim": "Deleting a file removes it from Git.", "detail": "Previous saved version levels can still contain the file. An actual removal from the version history requires special measures and does not automatically consider copies from other parties.", "label": "Explanation"}}, {"id": "M08", "kind": "M", "section": "Sichtbarkeit, Löschen und personenbezogene Daten", "title": "Wenn nur die Endfassung veröffentlicht wird, bleiben interne Kommentare verborgen.", "claim": "Wenn nur die Endfassung veröffentlicht wird, bleiben interne Kommentare verborgen.", "sources": [], "kernel": "Eine veröffentlichte Auswahl einzelner aktueller Dateien kann frühere Bearbeitungsstände aussparen.", "fallacy": "Auch bei Veröffentlichung des gesamten Git-Repositoriums sei ausschließlich die Endfassung einsehbar.", "detail": "Wer das Repositorium mitsamt Versionsgeschichte zugänglich macht, kann dadurch ältere Texte, interne Anmerkungen oder zeitweilig enthaltene Dateien offenlegen. Entscheidend ist der Unterschied zwischen der Publikation eines Dateiexports und der Publikation der Repository-Geschichte.", "punch": "Eine Edition veröffentlichen und ihre Arbeitsgeschichte veröffentlichen sind zwei verschiedene Vorgänge.", "en": {"title": "Publishing only the final edition automatically hides internal comments.", "claim": "Publishing only the final edition automatically hides internal comments.", "detail": "Those who make the repository accessible, including version history, can thereby disclose older texts, internal notes or temporarily contained files. The difference between the publication of a file export and the publication of the repository history is crucial.", "label": "Explanation"}}, {"id": "M09", "kind": "M", "section": "Sichtbarkeit, Löschen und personenbezogene Daten", "title": "Pseudonyme machen Git-Aktivitätsdaten anonym.", "claim": "Pseudonyme machen Git-Aktivitätsdaten anonym.", "sources": [], "kernel": "Das Ersetzen von Namen kann eine direkte Identifizierung erschweren.", "fallacy": "Zeitstempel, Änderungsschwerpunkte und Aktivitätsmuster seien damit keine personenbezogenen Daten mehr.", "detail": "Personen können unter Umständen durch Kombination mit anderen Informationen wiedererkannt werden. Pseudonymisierung und Anonymisierung sind nicht gleichbedeutend; ob Identifizierbarkeit besteht, hängt vom konkreten Kontext ab.", "punch": "Ein ersetzter Name beseitigt nicht jede Personenbeziehbarkeit.", "en": {"title": "Using pseudonyms makes Git activity data anonymous.", "claim": "Using pseudonyms makes Git activity data anonymous.", "detail": "People may be recognized by combination with other information. Pseudonymization and anonymisation are not synonymous; whether identity exists depends on the concrete context.", "label": "Explanation"}}, {"id": "M10", "kind": "M", "section": "Sichtbarkeit, Löschen und personenbezogene Daten", "title": "Öffentlich einsehbare Git-Daten dürfen beliebig personenbezogen ausgewertet werden.", "claim": "Öffentlich einsehbare Git-Daten dürfen beliebig personenbezogen ausgewertet werden.", "sources": [], "kernel": "Öffentliche Repositorien erlauben technische Auswertungen von Änderungen, Namen und Zeiten.", "fallacy": "Die öffentliche Sichtbarkeit sei automatisch eine Rechtsgrundlage für jede Analyse, beispielsweise zur Leistungsbeurteilung von Beschäftigten.", "detail": "Commit-Metadaten können personenbezogen sein. Eine Analyse muss gegebenenfalls unter anderem hinsichtlich Rechtsgrundlage, Zweck, Erforderlichkeit und Schutz der Betroffenen bewertet werden. Hinzu kommt: Solche Daten sind methodisch oft ungeeignet, Arbeitszeit oder Leistung direkt zu messen.", "punch": "Öffentlich beobachtbar bedeutet weder rechtlich frei verwertbar noch wissenschaftlich eindeutig.", "en": {"title": "Public Git data may be used for any employee analysis.", "claim": "Public Git data may be used for any employee analysis.", "detail": "Commit metadata may be personal. An analysis must be evaluated, inter alia, with regard to the legal basis, purpose, necessity and protection of the data subject. In addition, such data are often methodologically inappropriate to measure working time or performance directly.", "label": "Explanation"}}, {"id": "M11", "kind": "M", "section": "Sichtbarkeit, Löschen und personenbezogene Daten", "title": "Wer öffentlich an einem Repositorium mitarbeitet, stimmt jeder Auswertung zu.", "claim": "Wer öffentlich an einem Repositorium mitarbeitet, stimmt jeder Auswertung zu.", "sources": [], "kernel": "Beteiligte können wissen, dass ihre Beiträge und Metadaten öffentlich sichtbar werden.", "fallacy": "Damit hätten sie automatisch in jede spätere personenbezogene Forschungs- oder Leistungsanalyse eingewilligt.", "detail": "Sichtbarkeit ist keine pauschale Einwilligung. Eine Verarbeitung kann zwar unter bestimmten Voraussetzungen auch auf einer anderen Rechtsgrundlage beruhen; diese muss aber eigenständig geprüft werden.", "punch": "Zustimmung zur Veröffentlichung ist keine Blankozustimmung zur Beobachtung.", "en": {"title": "Contributing to a public repository means consenting to every analysis.", "claim": "Contributing to a public repository means consenting to every analysis.", "detail": "Visibility is not a flat-rate consent. A processing can also be based on another legal basis under certain conditions, but this must be independently examined.", "label": "Explanation"}}, {"id": "M12", "kind": "M", "section": "Sichtbarkeit, Löschen und personenbezogene Daten", "title": "Was sich aus Git-Aktivität erschließen lässt, ist eine Tatsache über die Person.", "claim": "Was sich aus Git-Aktivität erschließen lässt, ist eine Tatsache über die Person.", "sources": [], "kernel": "Zeitliche Muster können Hinweise auf Arbeitsabläufe geben.", "fallacy": "Aus Phasen ohne Einträge oder ungewöhnlichen Zeitverteilungen könne man sicher auf Urlaub, Betreuungspflichten, Krankheit oder Leistungsfähigkeit schließen.", "detail": "Git erfasst nur bestimmte dokumentierte Handlungen und lässt viele mögliche Ursachen für ein Muster offen. Gerade die Verknüpfung verschiedener Datenquellen kann heikle, aber dennoch unzuverlässige personenbezogene Zuschreibungen erzeugen.", "punch": "Eine plausible statistische Vermutung ist keine biografische Tatsache.", "en": {"title": "An inference from Git activity is a fact about a person.", "claim": "An inference from Git activity is a fact about a person.", "detail": "Git captures only certain documented actions and leaves many possible causes for a pattern open. Especially the linking of different data sources can create delicate, yet unreliable personal attributions.", "label": "Explanation"}}, {"id": "M13", "kind": "M", "section": "Sichtbarkeit, Löschen und personenbezogene Daten", "title": ".gitignore schützt sensible Dateien zuverlässig vor Veröffentlichung.", "claim": ".gitignore schützt sensible Dateien zuverlässig vor Veröffentlichung.", "sources": [], "kernel": "Eine Datei namens .gitignore kann festlegen, welche noch nicht erfassten Dateien Git beim Hinzufügen von Änderungen ignorieren soll.", "fallacy": "Was dort genannt ist, könne nie in der Versionsgeschichte auftauchen.", "detail": "Bereits versionierte Dateien bleiben von dieser Regel unberührt; frühere Versionsstände werden nicht nachträglich gesäubert. Auch versehentlich veröffentlichte Zugangsdaten erfordern eigene Gegenmaßnahmen.", "punch": "Eine Ausschlussregel für die Zukunft löscht keine Vergangenheit.", "en": {"title": ".gitignore safely prevents sensitive files from being published.", "claim": ".gitignore safely prevents sensitive files from being published.", "detail": "Already versioned files remain unaffected by this rule; previous versions are not cleaned afterwards. Also accidentally published access data require own countermeasures.", "label": "Explanation"}}, {"id": "M14", "kind": "M", "section": "Sichtbarkeit, Löschen und personenbezogene Daten", "title": "Mit der Veröffentlichung des Repositoriums sind alle Nutzungsrechte geklärt.", "claim": "Mit der Veröffentlichung des Repositoriums sind alle Nutzungsrechte geklärt.", "sources": [], "kernel": "Ein Projekt kann seine Dateien öffentlich zugänglich machen und gegebenenfalls eine Lizenz vergeben.", "fallacy": "Damit dürften automatisch alle Inhalte frei übernommen, geändert und weiterverbreitet werden.", "detail": "Textedition, Bildmaterial, Transkriptionen, Programmcode und Beiträge Dritter können unterschiedliche Rechte und Lizenzen betreffen. Öffentliche Lesbarkeit allein erteilt keine allgemeine Nachnutzungserlaubnis.", "punch": "Zugang und Nutzungsrecht sind unterschiedliche Fragen.", "en": {"title": "Publishing a repository clears all reuse rights.", "claim": "Publishing a repository clears all reuse rights.", "detail": "Text edition, image material, transcriptions, program code and third party contributions may affect different rights and licenses. Public readability alone does not grant a general re-use permit.", "label": "Explanation"}}, {"id": "M15", "kind": "M", "section": "Was Git über Änderungen tatsächlich festhält", "title": "Ein Git-Repositorium dokumentiert alle editorischen Entscheidungen.", "claim": "Ein Git-Repositorium dokumentiert alle editorischen Entscheidungen.", "sources": [], "kernel": "Gespeicherte Dateistände und Veränderungen können editorische Eingriffe sichtbar machen.", "fallacy": "Aus der Versionsgeschichte ließen sich alle Überlegungen und Gründe der Beteiligten entnehmen.", "detail": "Gespräche, nicht dokumentierte Alternativen, Vorarbeiten und die Motive hinter einer Änderung müssen im Repositorium nicht enthalten sein. Versionierung erfasst Resultate bestimmter Arbeitsschritte besser als deren gedankliche Entstehung.", "punch": "Nachvollziehbare Veränderung ist nicht gleich dokumentierte Begründung.", "en": {"title": "Git records every editorial decision.", "claim": "Git records every editorial decision.", "detail": "Conversations, undocumented alternatives, preparatory work and the motives behind a change need not be included in the repository. Versionation records results of certain work steps better than their mental development.", "label": "Explanation"}}, {"id": "M16", "kind": "M", "section": "Was Git über Änderungen tatsächlich festhält", "title": "git blame zeigt, wer für eine Textstelle verantwortlich ist.", "claim": "git blame zeigt, wer für eine Textstelle verantwortlich ist.", "sources": [], "kernel": "Der Git-Befehl blame kann für eine Dateizeile den letzten zugeordneten Commit und dessen Autorangabe anzeigen.", "fallacy": "Die dort genannte Person habe die betreffende Formulierung wissenschaftlich verantwortet oder ursprünglich erarbeitet.", "detail": "Der letzte Zeileneingriff kann eine formale Korrektur, automatische Umformatierung oder Übernahme fremder Arbeit sein. Die angezeigte Zuordnung ist technisch und hängt auch von den untersuchten Versionsständen ab.", "punch": "Letzte Änderung ist nicht gleich intellektuelle Urheberschaft.", "en": {"title": "git blame identifies the person intellectually responsible for a passage.", "claim": "git blame identifies the person intellectually responsible for a passage.", "detail": "The last line intervention can be a formal correction, automatic reformatting or taking over of foreign work. The displayed assignment is technical and also depends on the examined version levels.", "label": "Explanation"}}, {"id": "M17", "kind": "M", "section": "Was Git über Änderungen tatsächlich festhält", "title": "Git speichert jeden Zwischenstand automatisch.", "claim": "Git speichert jeden Zwischenstand automatisch.", "sources": [], "kernel": "Git kann viele aufeinanderfolgende Versionen eines Projekts speichern.", "fallacy": "Jeder Bearbeitungsschritt sei im späteren Verlauf rekonstruierbar.", "detail": "Gewöhnlich werden erst durch einen Commit – einen explizit gespeicherten Versionsstand – dauerhaft nachvollziehbare Punkte in der Projektgeschichte gesetzt. Nicht gespeicherte Experimente und verworfene Zwischenstände können fehlen.", "punch": "Git zeigt gespeicherte Zustände, nicht jede Sekunde des Schreibens.", "en": {"title": "Git saves every intermediate state automatically.", "claim": "Git saves every intermediate state automatically.", "detail": "Usually only by a commit – an explicitly stored version – permanently comprehensible points in the project history are set. Unsaved experiments and discarded intermediates can be missing.", "label": "Explanation"}}, {"id": "M18", "kind": "M", "section": "Was Git über Änderungen tatsächlich festhält", "title": "Ein Commit entspricht genau einer editorischen Handlung.", "claim": "Ein Commit entspricht genau einer editorischen Handlung.", "sources": [], "kernel": "Ein Commit ist eine abgegrenzte Einheit in der Versionsgeschichte.", "fallacy": "Jeder Commit repräsentiere genau eine fachlich einheitliche Entscheidung.", "detail": "Ein Commit kann mehrere Änderungen bündeln oder eine einzige Arbeit in viele kleine Einträge aufgeteilt werden. Die Granularität hängt von Gewohnheiten und Projektregeln ab.", "punch": "Eine technische Speichereinheit ist keine natürliche Einheit wissenschaftlicher Arbeit.", "en": {"title": "Each commit represents exactly one editorial action.", "claim": "Each commit represents exactly one editorial action.", "detail": "A commit can bundle several changes or split a single work into many small entries. Granularity depends on habits and project rules.", "label": "Explanation"}}, {"id": "M19", "kind": "M", "section": "Was Git über Änderungen tatsächlich festhält", "title": "Die Reihenfolge der Commits ist der tatsächliche Entstehungsprozess.", "claim": "Die Reihenfolge der Commits ist der tatsächliche Entstehungsprozess.", "sources": [], "kernel": "Git kann eine zusammenhängende Abfolge gespeicherter Bearbeitungsstände zeigen.", "fallacy": "Diese Abfolge sei ein unveränderliches Protokoll des realen Arbeitsablaufs.", "detail": "Arbeiten können lange vor ihrer Speicherung erfolgen. Mit Funktionen wie Rebase (nachträgliches Neuordnen bzw. erneutes Anwenden von Commits) oder Squash (Zusammenfassen mehrerer Commits) lässt sich die sichtbare Versionsfolge verändern. Die dokumentierte Geschichte ist also teilweise gestaltbar.", "punch": "Die Versionsgeschichte ist eine Darstellung des Arbeitsprozesses, nicht dessen vollständiges Abbild.", "en": {"title": "Commit order is the true chronological history of the work.", "claim": "Commit order is the true chronological history of the work.", "detail": "Work can be done long before it is saved. Functions such as Rebase (reordering or re-applying commits) or Squash (committing multiple commits) can be used to change the visible version sequence.", "label": "Explanation"}}, {"id": "M20", "kind": "M", "section": "Was Git über Änderungen tatsächlich festhält", "title": "Commit-Zeitstempel belegen den Zeitpunkt einer editorischen Entscheidung.", "claim": "Commit-Zeitstempel belegen den Zeitpunkt einer editorischen Entscheidung.", "sources": [], "kernel": "Jeder Commit enthält Datumsangaben.", "fallacy": "Daraus lasse sich sicher ableiten, wann eine Entscheidung getroffen oder eine Arbeit ausgeführt wurde.", "detail": "Git unterscheidet Angaben zum ursprünglichen Autorzeitpunkt und zum Zeitpunkt der Übernahme in die Geschichte (Author Date und Committer Date). Beide sind Metadaten und nicht automatisch unabhängig beglaubigte Zeitangaben; die eigentliche Arbeit kann früher erfolgt sein.", "punch": "Ein gespeicherter Zeitwert ist kein gesicherter Entscheidungszeitpunkt.", "en": {"title": "Commit timestamps prove when editorial decisions happened.", "claim": "Commit timestamps prove when editorial decisions happened.", "detail": "Git distinguishes information about the original author's time and at the time of taking over into history (Author Date and Committer Date). Both are metadata and not automatically independently certified time data; the actual work may have been done earlier.", "label": "Explanation"}}, {"id": "M21", "kind": "M", "section": "Was Git über Änderungen tatsächlich festhält", "title": "Der angegebene Commit-Autor ist zweifelsfrei die handelnde Person.", "claim": "Der angegebene Commit-Autor ist zweifelsfrei die handelnde Person.", "sources": [], "kernel": "Git speichert zu Commits Autorennamen und häufig E-Mail-Adressen.", "fallacy": "Damit sei die reale Identität technisch nachgewiesen.", "detail": "Diese Angaben sind grundsätzlich konfigurierbar. Bei gemeinsam erarbeiteten, importierten oder automatisiert gespeicherten Änderungen können die Angaben von der tatsächlichen Arbeitsteilung abweichen. Eine gesonderte Signatur- oder Identitätsprüfung ist eine andere Frage.", "punch": "Autorenzuschreibung ist nicht automatisch Identitätsnachweis.", "en": {"title": "The named commit author is certainly the actual contributor.", "claim": "The named commit author is certainly the actual contributor.", "detail": "This information is generally configurable. In the case of jointly developed, imported or automated stored changes, the information may differ from the actual division of work. A separate signature or identity check is another question.", "label": "Explanation"}}, {"id": "M22", "kind": "M", "section": "Was Git über Änderungen tatsächlich festhält", "title": "Alles in einem Commit ist bewusst als editorische Aussage aufgenommen worden.", "claim": "Alles in einem Commit ist bewusst als editorische Aussage aufgenommen worden.", "sources": [], "kernel": "Commits werden typischerweise absichtlich erstellt.", "fallacy": "Deshalb seien sämtliche enthaltenen Einzeländerungen reflektierte wissenschaftliche Entscheidungen.", "detail": "Ein Commit kann neben fachlichen Änderungen auch automatische Formatierung, Nebenfolgen eines Skripts oder versehentlich mitgespeicherte Anpassungen umfassen.", "punch": "Bewusst gespeichert heißt nicht in jedem Detail bewusst entschieden.", "en": {"title": "Everything included in a commit is an intentional editorial statement.", "claim": "Everything included in a commit is an intentional editorial statement.", "detail": "In addition to technical changes, a commit can also include automatic formatting, sub-sequences of a script or accidentally saved adjustments.", "label": "Explanation"}}, {"id": "M23", "kind": "M", "section": "Was Git über Änderungen tatsächlich festhält", "title": "Eine große Änderung in Git ist eine große editorische Veränderung.", "claim": "Eine große Änderung in Git ist eine große editorische Veränderung.", "sources": [], "kernel": "Git kann die Anzahl geänderter Textzeilen ausweisen.", "fallacy": "Viele hinzugefügte und entfernte Zeilen belegten einen großen inhaltlichen Eingriff.", "detail": "Schon eine neue Einrückung oder das Umformatieren einer XML-Datei kann zahlreiche Zeilen als verändert erscheinen lassen, obwohl die editorische Bedeutung nahezu gleich bleibt.", "punch": "Die Größe des technischen Unterschieds ist kein Maß für die fachliche Tragweite.", "en": {"title": "A large Git diff means a major editorial change.", "claim": "A large Git diff means a major editorial change.", "detail": "Already a new indentation or reformatting of a XML file can make numerous lines appear as changed, although the editorial meaning remains almost the same.", "label": "Explanation"}}, {"id": "M24", "kind": "M", "section": "Was Git über Änderungen tatsächlich festhält", "title": "Ein Revert macht die frühere Entscheidung bedeutungslos.", "claim": "Ein Revert macht die frühere Entscheidung bedeutungslos.", "sources": [], "kernel": "Mit einem Revert kann Git eine neue Änderung erzeugen, die die Wirkung einer früheren Änderung rückgängig macht.", "fallacy": "Damit sei die damalige editorische Entscheidung auch wissenschaftlich erledigt.", "detail": "Dass eine Lesart oder Auszeichnung zunächst gewählt und später verworfen wurde, kann für die Geschichte der Edition besonders aufschlussreich sein. Das technische Rückgängigmachen erklärt die Gründe nicht.", "punch": "Auch eine zurückgenommene Entscheidung gehört zur Entscheidungsgeschichte.", "en": {"title": "Reverting a change makes the earlier decision irrelevant.", "claim": "Reverting a change makes the earlier decision irrelevant.", "detail": "The fact that a reading or markup was initially chosen and later rejected can be particularly revealing for the history of the edition. The technical undoing does not explain the reasons.", "label": "Explanation"}}, {"id": "M25", "kind": "M", "section": "Zusammenführen, Branches und fachliche Qualität", "title": "Git verhindert Konflikte und Datenverluste bei gemeinsamer Arbeit.", "claim": "Git verhindert Konflikte und Datenverluste bei gemeinsamer Arbeit.", "sources": [], "kernel": "Git erkennt manche konkurrierenden Änderungen und unterstützt dabei, Versionen zusammenzuführen.", "fallacy": "Mit Git seien versehentliche Überschreibungen, fehlerhafte Entscheidungen oder Datenverluste praktisch ausgeschlossen.", "detail": "Beim Merge – der Zusammenführung zweier Entwicklungsstände – können Konflikte entstehen. Sie müssen sachgerecht gelöst werden. Auch unerkannte Fehler, falsche Bedienung oder ungesicherte Daten bleiben möglich.", "punch": "Werkzeuge zur Konfliktbearbeitung ersetzen keine fachliche Kontrolle.", "en": {"title": "Git prevents collaboration conflicts and data loss.", "claim": "Git prevents collaboration conflicts and data loss.", "detail": "Conflicts can arise when merging two levels of development. They must be resolved properly. Unrecognized errors, incorrect operation or unsecured data are also possible.", "label": "Explanation"}}, {"id": "M26", "kind": "M", "section": "Zusammenführen, Branches und fachliche Qualität", "title": "Wenn Git beim Zusammenführen keinen Konflikt meldet, passen die Änderungen fachlich zusammen.", "claim": "Wenn Git beim Zusammenführen keinen Konflikt meldet, passen die Änderungen fachlich zusammen.", "sources": [], "kernel": "Git kann bestimmte Überschneidungen zwischen gleichzeitig veränderten Textstellen automatisch erkennen.", "fallacy": "Eine konfliktfreie Zusammenführung garantiere einen logisch konsistenten oder editorisch korrekten Gesamtstand.", "detail": "Zwei Änderungen an unterschiedlichen Stellen können sich inhaltlich widersprechen, obwohl Git sie technisch problemlos zusammenfügt – etwa wenn Auszeichnungsrichtlinien an zwei Stellen unterschiedlich umgesetzt werden.", "punch": "Technische Vereinbarkeit ist nicht gleich editorische Verträglichkeit.", "en": {"title": "A conflict-free merge guarantees editorial consistency.", "claim": "A conflict-free merge guarantees editorial consistency.", "detail": "Two changes to different places can contradict each other in terms of content, although Git combines them technically easily – for example when markup guidelines are implemented differently in two places.", "label": "Explanation"}}, {"id": "M27", "kind": "M", "section": "Zusammenführen, Branches und fachliche Qualität", "title": "Branches sind automatisch unterschiedliche wissenschaftliche Textfassungen.", "claim": "Branches sind automatisch unterschiedliche wissenschaftliche Textfassungen.", "sources": [], "kernel": "Ein Branch ist ein benannter Entwicklungszweig, in dem Änderungen zunächst getrennt vom Hauptstand ausprobiert oder bearbeitet werden können.", "fallacy": "Jeder Branch entspreche einer bewusst konzipierten alternativen Edition oder Textfassung.", "detail": "Branches werden ebenso für technische Reparaturen, Experimente, Arbeitsorganisation oder kurzfristige Tests benutzt. Ihre wissenschaftliche Bedeutung ergibt sich aus der konkreten Projektpraxis.", "punch": "Ein technischer Entwicklungszweig ist nicht automatisch eine editorische Variante.", "en": {"title": "Branches are automatically different scholarly versions.", "claim": "Branches are automatically different scholarly versions.", "detail": "Sectors are also used for technical repairs, experiments, work organization or short-term tests. Their scientific significance is derived from the concrete project practice.", "label": "Explanation"}}, {"id": "M28", "kind": "M", "section": "Zusammenführen, Branches und fachliche Qualität", "title": "Git organisiert Teamarbeit von allein.", "claim": "Git organisiert Teamarbeit von allein.", "sources": [], "kernel": "Git bietet Verfahren, mit denen mehrere Personen Änderungen beitragen und verbinden können.", "fallacy": "Sobald alle Zugriff auf dasselbe Repositorium haben, sei die Zusammenarbeit geregelt.", "detail": "Teams benötigen Absprachen über Zuständigkeiten, Speicherhäufigkeit, Benennungen, Konfliktlösung, Qualitätsprüfung und Entscheidungsbefugnisse.", "punch": "Zugriff ist noch keine Arbeitsorganisation.", "en": {"title": "Git organizes teamwork by itself.", "claim": "Git organizes teamwork by itself.", "detail": "Teams need agreements on responsibilities, storage frequency, designations, conflict resolution, quality control and decision-making powers.", "label": "Explanation"}}, {"id": "M29", "kind": "M", "section": "Zusammenführen, Branches und fachliche Qualität", "title": "Ein Pull Request ist automatisch wissenschaftliches Peer Review.", "claim": "Ein Pull Request ist automatisch wissenschaftliches Peer Review.", "sources": [], "kernel": "Auf Plattformen wie GitHub heißen Vorschläge zur Übernahme von Änderungen häufig Pull Requests; bei GitLab spricht man oft von Merge Requests. Andere können die vorgeschlagenen Änderungen dort kommentieren und freigeben.", "fallacy": "Die Verwendung eines solchen Verfahrens belege eine gründliche wissenschaftliche Begutachtung.", "detail": "Die Prüfung kann sich auf technische Funktionsfähigkeit beschränken oder nur formell erfolgen. Inhaltliche Begutachtung benötigt eigene Kriterien und Verantwortlichkeiten. Das Verfahren ist zudem eine Plattformfunktion, keine zwingende Eigenschaft von Git.", "punch": "Ein digitaler Freigabeknopf ist noch kein Qualitätsurteil.", "en": {"title": "A pull request is automatically scholarly peer review.", "claim": "A pull request is automatically scholarly peer review.", "detail": "The examination can be limited to technical functionality or only take place formally. Content assessment requires its own criteria and responsibilities. The procedure is also a platform function, not an imperative feature of Git.", "label": "Explanation"}}, {"id": "M30", "kind": "M", "section": "Zusammenführen, Branches und fachliche Qualität", "title": "Gültiges TEI-XML ist auch editorisch richtig.", "claim": "Gültiges TEI-XML ist auch editorisch richtig.", "sources": [], "kernel": "Technische Prüfungen können feststellen, ob eine XML-Datei syntaktisch korrekt ist und bestimmten formalen Regeln folgt. TEI bezeichnet verbreitete Richtlinien zur digitalen Auszeichnung von Texten.", "fallacy": "Besteht die Datei diese Prüfungen, seien Transkription, Interpretation und editorische Entscheidungen korrekt.", "detail": "Formale Gültigkeit prüft nicht automatisch die historische Richtigkeit einer Lesart, die Begründung einer Normalisierung oder die Angemessenheit einer Auszeichnung.", "punch": "Technische Validität ersetzt keine philologische Begründung.", "en": {"title": "Valid TEI XML is necessarily editorially correct.", "claim": "Valid TEI XML is necessarily editorially correct.", "detail": "Formal validity does not automatically verify the historical correctness of a reading, the justification of a normalization or the appropriateness of an markup.", "label": "Explanation"}}, {"id": "M31", "kind": "M", "section": "Zusammenführen, Branches und fachliche Qualität", "title": "Textbasierte XML-Dateien ergeben automatisch gut lesbare Git-Vergleiche.", "claim": "Textbasierte XML-Dateien ergeben automatisch gut lesbare Git-Vergleiche.", "sources": [], "kernel": "Git lässt sich bei Textdateien besonders gut zum Vergleich einzelner Zeilen einsetzen.", "fallacy": "Die Unterschiede zwischen zwei TEI-XML-Fassungen seien damit stets leicht und fachlich sinnvoll verständlich.", "detail": "Formatierungsänderungen, lange XML-Zeilen oder unterschiedlich angeordnete Elemente erschweren die Interpretation. Git vergleicht zunächst Zeichen bzw. Zeilen und versteht die XML-Struktur oder editorische Semantik nicht von selbst.", "punch": "Textuell vergleichbar heißt nicht semantisch verständlich.", "en": {"title": "Text-based XML always yields readable Git comparisons.", "claim": "Text-based XML always yields readable Git comparisons.", "detail": "Formatting changes, long XML lines or differently arranged elements make interpretation difficult. Git first compares characters or lines and does not understand the XML structure or editorial semantics by itself.", "label": "Explanation"}}, {"id": "M32", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Ein Git-Commit ist ein fälschungssicherer historischer Beleg.", "claim": "Ein Git-Commit ist ein fälschungssicherer historischer Beleg.", "sources": [], "kernel": "Git verwendet kryptografische Prüfsummen, um gespeicherte Inhalte und ihre Verknüpfungen erkennbar zu identifizieren. Unbemerkte Änderungen an bekannten Inhalten werden dadurch erschwert.", "fallacy": "Die Geschichte sei damit automatisch echt, vollständig, unveränderlich und einer realen Person verlässlich zugeordnet.", "detail": "Prüfsummen sichern eine technische Beziehung zwischen Daten und Kennwerten; sie beglaubigen nicht die Wahrheit der eingetragenen Autor-, Zeit- oder Entscheidungsangaben. Versionen können neu aufgebaut werden, und die Echtheit einer Quelle hängt von ihrem Überlieferungskontext ab.", "punch": "Technische Integrität ist nicht historische Authentizität.", "en": {"title": "A commit is a tamper-proof historical certificate.", "claim": "A commit is a tamper-proof historical certificate.", "detail": "checksum secure a technical relationship between data and characteristic values; they do not authenticate the truth of the registered author, time or decision information. Versions can be rebuilt, and the authenticity of a source depends on its transmission context.", "label": "Explanation"}}, {"id": "M33", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Ein gespeicherter Git-Stand macht eine Edition vollständig reproduzierbar.", "claim": "Ein gespeicherter Git-Stand macht eine Edition vollständig reproduzierbar.", "sources": [], "kernel": "Ein bestimmter Commit erlaubt es, versionierte Dateien in einem genau bezeichneten Stand erneut abzurufen.", "fallacy": "Damit ließen sich sämtliche Veröffentlichungsprodukte und Auswertungsergebnisse ohne weitere Informationen reproduzieren.", "detail": "Zusätzlich können Programme, externe Daten, Schriftarten, Betriebssysteme, Konfigurationen, Datenbanken und nicht versionierte Ressourcen nötig sein. Versionierte Quelldaten sind ein wichtiger Baustein, aber nicht die gesamte Ausführungsumgebung.", "punch": "Reproduzierbare Dateien sind nicht automatisch reproduzierbare Forschungsergebnisse.", "en": {"title": "A Git snapshot makes an edition completely reproducible.", "claim": "A Git snapshot makes an edition completely reproducible.", "detail": "In addition, programs, external data, fonts, operating systems, configurations, databases and unversioned resources may be required. Versioned source data is an important building block, but not the entire execution environment.", "label": "Explanation"}}, {"id": "M34", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Git ist ein Backup.", "claim": "Git ist ein Backup.", "sources": [], "kernel": "Zusätzliche Kopien eines Git-Repositoriums können vor dem Verlust von Versionsständen schützen.", "fallacy": "Die Verwendung von Git ersetze eine unabhängige Sicherungsstrategie.", "detail": "Eine einzige lokale Kopie schützt nicht vor Defekten oder Verlust des Geräts. Auch synchronisierte Kopien können Fehler übernehmen; nicht erfasste Dateien und externe Speicherbestände fehlen möglicherweise. Backups benötigen getrennte, getestete Wiederherstellungswege.", "punch": "Versionierung und Datensicherung erfüllen unterschiedliche Aufgaben.", "en": {"title": "Git is a backup.", "claim": "Git is a backup.", "detail": "A single local copy does not protect against defects or loss of the device. Also synchronized copies can take over errors; unrecorded files and external storage may be missing. Backups require separate, tested recovery paths.", "label": "Explanation"}}, {"id": "M35", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Ein Repositorium auf GitHub oder GitLab ist langfristig archiviert.", "claim": "Ein Repositorium auf GitHub oder GitLab ist langfristig archiviert.", "sources": [], "kernel": "Hosting-Dienste halten Git-Repositorien oft über lange Zeit online.", "fallacy": "Plattformzugang bedeute automatisch dauerhafte wissenschaftliche Bewahrung.", "detail": "Hosting-Verträge, Konten, Speicherregeln, Verfügbarkeit externer Dateien und die langfristige Erschließung können sich ändern. Archivierung verlangt organisatorische, technische und dokumentarische Maßnahmen über das bloße Hosting hinaus.", "punch": "Online verfügbar ist nicht gleich archiviert.", "en": {"title": "A repository hosted on GitHub or GitLab is preserved for the long term.", "claim": "A repository hosted on GitHub or GitLab is preserved for the long term.", "detail": "Hosting contracts, accounts, storage rules, availability of external files and long-term development may change. Archiving requires organizational, technical and documentary measures beyond mere hosting.", "label": "Explanation"}}, {"id": "M36", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Ein DOI macht ein Repositorium unveränderlich.", "claim": "Ein DOI macht ein Repositorium unveränderlich.", "sources": [], "kernel": "Ein DOI (Digital Object Identifier) kann eine Veröffentlichung dauerhaft zitierbar und auffindbar machen.", "fallacy": "Die DOI-Vergabe friere alle damit verbundenen Repositoriumsinhalte automatisch ein.", "detail": "Ein DOI identifiziert ein digitales Objekt oder einen Veröffentlichungsstand nach den Regeln des jeweiligen Dienstes. Ob die zugehörigen Daten tatsächlich als unveränderliche Version aufbewahrt werden, hängt von dessen Verfahren ab. Ein laufend veränderliches Repositorium und eine archivierte Veröffentlichungsversion müssen unterschieden werden.", "punch": "Zitierbarkeit ist nicht automatisch Unveränderlichkeit.", "en": {"title": "A DOI makes a Git repository immutable.", "claim": "A DOI makes a Git repository immutable.", "detail": "A DOI identifies a digital object or state of publication according to the rules of the respective service. Whether the associated data are actually kept as an unchangeable version depends on its procedures. An continuously changing repository and archived publication version must be distinguished.", "label": "Explanation"}}, {"id": "M37", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Ein Tag garantiert eine verlässliche Publikationsfassung.", "claim": "Ein Tag garantiert eine verlässliche Publikationsfassung.", "sources": [], "kernel": "Ein Tag ist in Git ein frei vergebbarer Name für einen bestimmten Versionsstand, zum Beispiel Version-1.0.", "fallacy": "Ein solcher Name beweise, dass der Stand fachlich geprüft, veröffentlicht, dauerhaft gespeichert und zitierfähig ist.", "detail": "Tags kennzeichnen technisch einen Versionsstand, begründen aber keinen Qualitätssicherungs- oder Archivierungsprozess. Unter bestimmten Bedingungen können sie auch geändert oder gelöscht werden.", "punch": "Eine Versionsmarkierung ist noch keine wissenschaftliche Edition.", "en": {"title": "A tag guarantees a reliable published edition.", "claim": "A tag guarantees a reliable published edition.", "detail": "Tags technically mark a version, but do not justify a quality assurance or archiving process. Under certain conditions they can also be changed or deleted.", "label": "Explanation"}}, {"id": "M38", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Open Source bei Git bedeutet Unabhängigkeit vom Plattformanbieter.", "claim": "Open Source bei Git bedeutet Unabhängigkeit vom Plattformanbieter.", "sources": [], "kernel": "Git selbst ist freie, quelloffene Software und nicht an einen bestimmten Anbieter gebunden.", "fallacy": "Bei Nutzung eines Hosting-Dienstes entstünden deshalb keinerlei Abhängigkeiten.", "detail": "Zusätzliche Plattformfunktionen – etwa Tickets für Aufgaben, Diskussionen, Zugriffsverwaltung oder automatisierte Abläufe – lassen sich nicht immer vollständig oder verlustfrei auf einen anderen Dienst übertragen.", "punch": "Offene Versionsverwaltung beseitigt nicht jedes Plattformrisiko.", "en": {"title": "Because Git is open source, projects are independent of platform vendors.", "claim": "Because Git is open source, projects are independent of platform vendors.", "detail": "Additional platform functions – such as tickets for tasks, discussions, access management or automated processes – cannot always be transferred completely or loss-free to another service.", "label": "Explanation"}}, {"id": "M39", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Das Repositorium enthält die gesamte Projektdokumentation.", "claim": "Das Repositorium enthält die gesamte Projektdokumentation.", "sources": [], "kernel": "Im Repositorium können Quelltexte, Richtlinien, Programme und Bearbeitungsstände gemeinsam gespeichert werden.", "fallacy": "Wer das Repositorium bewahrt, habe damit alle für die Rekonstruktion des Projekts erforderlichen Informationen.", "detail": "Entscheidungen aus Besprechungen, E-Mails, externen Ticketsystemen und Datenbanken sowie nicht übernommene Arbeitsmaterialien fehlen möglicherweise. Selbst eine vollständige Git-Geschichte ist daher nicht notwendig eine vollständige Projektüberlieferung.", "punch": "Vollständige Versionsdaten sind keine vollständige Arbeitsdokumentation.", "en": {"title": "A repository contains all project documentation.", "claim": "A repository contains all project documentation.", "detail": "Decisions from meetings, e-mails, external ticket systems and databases as well as unaccompanied work materials may be missing. Even a complete Git history is therefore not necessary a complete project transmission.", "label": "Explanation"}}, {"id": "M40", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Git eignet sich für alle Medien und Dateiformate gleich gut.", "claim": "Git eignet sich für alle Medien und Dateiformate gleich gut.", "sources": [], "kernel": "Git kann unterschiedliche Dateitypen verwalten.", "fallacy": "Es sei für Bilddateien, Tonaufnahmen, große Binärdateien und XML-Texte gleich effizient und aussagekräftig.", "detail": "Reine Textdateien lassen sich oft besonders gut vergleichen. Große oder binäre Dateien beanspruchen unter Umständen mehr Speicher und ermöglichen weniger aussagekräftige Vergleiche. Git LFS („Large File Storage“) ist eine Erweiterung, bei der große Inhalte separat gespeichert und im Git-Repositorium über Verweise eingebunden werden; dies schafft eigene Anforderungen an Sicherung und Archivierung.", "punch": "Versionierbar bedeutet nicht gleichermaßen gut versionierbar.", "en": {"title": "Git works equally well for every media format.", "claim": "Git works equally well for every media format.", "detail": "Pure text files can often be compared particularly well. Large or binary files may require more memory and allow for less meaningful comparisons. Git LFS (\"Large File Storage\") is an extension in which large contents are stored separately and integrated into the Git repository via references; this creates its own requirements for backup and archiving.", "label": "Explanation"}}, {"id": "M41", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Eine Git-Versionsgeschichte lässt sich ohne Kontext verstehen.", "claim": "Eine Git-Versionsgeschichte lässt sich ohne Kontext verstehen.", "sources": [], "kernel": "Git protokolliert Veränderungen in einer vergleichsweise einheitlichen technischen Form.", "fallacy": "Außenstehende könnten allein aus dieser technischen Form Ursachen, Bedeutung und Zuständigkeiten rekonstruieren.", "detail": "Editionsrichtlinien, Rollenverteilungen, verwendete Werkzeuge, Arbeitskonventionen und zeitliche Projektphasen geben Änderungen erst ihren historischen Sinn. Eine Umstellung der TEI-Auszeichnung kann fachlich, organisatorisch oder technisch begründet sein.", "punch": "Quellen werden nicht allein durch ihre technische Lesbarkeit verständlich.", "en": {"title": "A Git history explains itself.", "claim": "A Git history explains itself.", "detail": "Edition guidelines, role distributions, used tools, work conventions and project phases only give changes their historical meaning. A conversion of the TEI markup can be based on technical, organizational or technical reasons.", "label": "Explanation"}}, {"id": "M42", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Aus einem Git-Unterschied lässt sich die editorische Entscheidung automatisch ablesen.", "claim": "Aus einem Git-Unterschied lässt sich die editorische Entscheidung automatisch ablesen.", "sources": [], "kernel": "Ein Diff – die Anzeige der Unterschiede zwischen zwei Dateiständen – kann zeigen, welche Zeichen oder XML-Auszeichnungen geändert wurden.", "fallacy": "Damit seien die wissenschaftlichen Gründe für die Änderung bekannt.", "detail": "Dieselbe sichtbare Änderung kann durch eine neue Interpretationsentscheidung, ein geändertes Auszeichnungsschema, eine automatische Umwandlung oder die Korrektur eines Fehlers entstanden sein.", "punch": "Die Rekonstruktion einer Änderung ist nicht ihre Erklärung.", "en": {"title": "A Git diff automatically explains the editorial rationale.", "claim": "A Git diff automatically explains the editorial rationale.", "detail": "The same visible change may have been caused by a new interpretation decision, an altered markup scheme, automatic conversion or correction of an error.", "label": "Explanation"}}, {"id": "M43", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Viele Commits bedeuten hohe Produktivität.", "claim": "Viele Commits bedeuten hohe Produktivität.", "sources": [], "kernel": "Commitzahlen lassen sich aus Git einfach ermitteln.", "fallacy": "Wer viele Versionen speichert, hat mehr oder besser gearbeitet.", "detail": "Menschen und Projekte speichern Änderungen unterschiedlich häufig; automatische Prozesse können zusätzliche Einträge erzeugen. Zahl und Qualität wissenschaftlicher Entscheidungen sind aus der bloßen Commitmenge nicht abzuleiten.", "punch": "Zählbarkeit ist nicht Leistungsbewertung.", "en": {"title": "More commits mean greater productivity.", "claim": "More commits mean greater productivity.", "detail": "People and projects store changes in different ways; automatic processes can generate additional entries. Number and quality of scientific decisions cannot be derived from the mere commit amount.", "label": "Explanation"}}, {"id": "M44", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Wer keine Commits erzeugt, arbeitet nicht.", "claim": "Wer keine Commits erzeugt, arbeitet nicht.", "sources": [], "kernel": "Phasen ohne neue Versionsstände zeigen, dass in der betrachteten Git-Geschichte nichts hinzugekommen ist.", "fallacy": "In dieser Zeit habe keine editorische oder wissenschaftliche Arbeit stattgefunden.", "detail": "Literaturrecherche, Quellenvergleich, Diskussion, Korrekturlesen, konzeptionelle Arbeit und lokale Bearbeitungen ohne anschließenden Commit können unsichtbar bleiben.", "punch": "Keine Git-Aktivität bedeutet nicht keine Arbeit.", "en": {"title": "No commits means no work happened.", "claim": "No commits means no work happened.", "detail": "Literature research, comparison of sources, discussion, proofreading, conceptual work and local editing without a subsequent commit can remain invisible.", "label": "Explanation"}}, {"id": "M45", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Commit-Zeiten sind Arbeitszeiten.", "claim": "Commit-Zeiten sind Arbeitszeiten.", "sources": [], "kernel": "Git speichert Zeitangaben zu den versionierten Bearbeitungsständen.", "fallacy": "Aus ihnen ließen sich Arbeitsbeginn, Arbeitsende, Stundenumfang oder Freizeitverhalten unmittelbar rekonstruieren.", "detail": "Commits können gebündelt, verzögert, automatisiert oder zu anderen Zeitpunkten als der eigentlichen Arbeit erstellt werden. Sie bilden weder die gesamte Tätigkeit noch zwingend deren zeitliche Dauer ab.", "punch": "Zeitpunkte gespeicherter Änderungen sind keine Stundenzettel.", "en": {"title": "Commit timestamps show working hours.", "claim": "Commit timestamps show working hours.", "detail": "Commits can be bundled, delayed, automated or created at times other than the actual work. They neither represent the entire activity nor necessarily its duration.", "label": "Explanation"}}, {"id": "M46", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Viele bearbeitete Dateien zeigen einen hohen Editionsfortschritt.", "claim": "Viele bearbeitete Dateien zeigen einen hohen Editionsfortschritt.", "sources": [], "kernel": "Die Anzahl veränderter Dateien oder Zeilen kann bestimmte Arbeitsschwerpunkte sichtbar machen.", "fallacy": "Daraus lasse sich direkt ablesen, wie viel einer Edition fachlich fertiggestellt ist.", "detail": "Ein einzelner schwieriger Quellenbefund kann erheblichen Aufwand erfordern, während automatisierte Umformungen tausende Dateien betreffen. Fachlicher Fortschritt braucht projektspezifische Kriterien.", "punch": "Bearbeitungsumfang ist nicht gleich Erkenntnis- oder Projektfortschritt.", "en": {"title": "Editing many files proves substantial editorial progress.", "claim": "Editing many files proves substantial editorial progress.", "detail": "A single difficult source finding may require considerable effort, while automated transformations affect thousands of files. Technical progress requires project-specific criteria.", "label": "Explanation"}}, {"id": "M47", "kind": "M", "section": "Reproduzierbarkeit, Belege und Langzeitverfügbarkeit", "title": "Git-Daten verschiedener Editionsprojekte sind direkt vergleichbar.", "claim": "Git-Daten verschiedener Editionsprojekte sind direkt vergleichbar.", "sources": [], "kernel": "Git speichert in unterschiedlichen Projekten ähnliche technische Daten, die sich mit denselben Programmen auswerten lassen.", "fallacy": "Identische Messgrößen hätten deshalb projektübergreifend dieselbe fachliche Bedeutung.", "detail": "Projekte unterscheiden sich unter anderem nach Dateigröße, Aufgaben, Mitarbeitendenzahl, Arbeitsabläufen, Commit-Praxis, Automatisierungsgrad und Repositoriumstyp. Ein Arbeitsrepositorium dokumentiert laufende Bearbeitung meist anders als ein Publikationsrepositorium, das vor allem bereitgestellte Ausgaben enthält. Vergleiche brauchen daher Kontext und methodische Normalisierung.", "punch": "Gleich messbar heißt nicht gleich bedeutend.", "en": {"title": "Git statistics are directly comparable across edition projects.", "claim": "Git statistics are directly comparable across edition projects.", "detail": "Projects differ, among other things, by file size, tasks, number of employees, workflows, commit practice, degree of automation and repository type. A working repositorysitory usually documents ongoing processing unlike a publication repositorysitory, which contains mainly provided issues. Comparisons therefore need context and methodical normalization.", "label": "Explanation"}}, {"id": "F01", "kind": "F", "section": "Git kann mehr, als Dateien zu speichern", "title": "Git lässt sich direkt aus Oxygen XML Editor bedienen", "claim": "Git lässt sich direkt aus Oxygen XML Editor bedienen", "sources": [{"label": "Oxygen – Git Client Add-on", "url": "https://www.oxygenxml.com/doc/ug-addons/git-client/git-addon.html"}, {"label": "Oxygen – Add-on-Übersicht", "url": "https://www.oxygenxml.com/addons/com.oxygenxml.git.html"}], "surprise": "Das Git Client Add-on für Oxygen XML Editor stellt häufige Git-Funktionen in der gewohnten XML-Arbeitsumgebung bereit: Unterschiede prüfen, Commits anlegen, Änderungen übertragen und empfangen, Entwicklungszweige verwalten und Konflikte behandeln. Für diese Standardaufgaben muss man nicht zwingend Befehle eintippen.", "utility": "Wer mit TEI/XML arbeitet, kann Versionsverwaltung und Textbearbeitung in einer Anwendung verbinden. Das senkt die Einstiegshürde.", "limits": "Die Oberfläche vereinfacht die Bedienung, ersetzt aber kein Grundverständnis der Versionsverwaltung. Ein Konflikt bei der Zusammenführung muss weiterhin inhaltlich beurteilt werden.", "en": {"title": "Oxygen XML Editor can control Git directly.", "claim": "Oxygen XML Editor can control Git directly.", "detail": "The Git Client Add-on for Oxygen XML Editor provides common Git functions in the usual XML working environment: Check differences, create commits, transfer and receive changes, manage development branches and handle conflicts. You don't have to type commands for these default tasks. If you work with TEI/XML, you can connect version management and text editing in one application, which lowers the entry threshold. The interface simplifies operation, but does not replace a basic understanding of version management. A conflict in merging must continue to be assessed in terms of content.", "label": "How it works and why it matters"}}, {"id": "F02", "kind": "F", "section": "Git kann mehr, als Dateien zu speichern", "title": "Beim Hochladen von Änderungen können automatische Prüfungen starten", "claim": "Beim Hochladen von Änderungen können automatische Prüfungen starten", "sources": [{"label": "GitHub Actions – auslösende Ereignisse", "url": "https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows"}, {"label": "GitLab – CI/CD", "url": "https://docs.gitlab.com/ci/"}], "surprise": "Ein Push (Übertragung lokaler Commits an ein entferntes Repo) kann auf Hosting-Plattformen automatisierte Arbeitsabläufe auslösen. Diese werden häufig CI/CD-Pipelines genannt: definierte Prüfschritte oder Verarbeitungsschritte, die nach einem Ereignis ausgeführt werden.", "utility": "TEI-Dateien können automatisch auf wohlgeformtes XML, die Einhaltung eines Relax-NG-Schemas oder zusätzliche Schematron-Regeln geprüft werden. Ein fehlerhafter Datenstand fällt frühzeitig auf.", "limits": "Git selbst führt durch einen Push nicht automatisch eine Schema-Prüfung aus. Dafür braucht es eingerichtete Programme und eine Ausführungsumgebung, etwa GitHub Actions oder GitLab CI/CD. Schema-Gültigkeit ist keine Garantie editorischer Richtigkeit.", "en": {"title": "Uploading changes can trigger automatic validation.", "claim": "Uploading changes can trigger automatic validation.", "detail": "A push (transfer of local commits to a remote repo) can trigger automated workflows on hosting platforms, often called CI/CD pipelines: defined test steps or processing steps that are executed after an event. TEI files can be automatically checked for well-formed XML, compliance with a Relax NG scheme or additional schematron rules. A faulty data level is noticeable early on. Git does not automatically perform a schema check through a push. To do this, you need installed programs and an execution environment such as GitHub Actions or GitLab CI/CD. schema validity is not a guarantee of editorial correctness.", "label": "How it works and why it matters"}}, {"id": "F03", "kind": "F", "section": "Git kann mehr, als Dateien zu speichern", "title": "Aus einem Commit kann automatisch eine neue Editionsvorschau entstehen", "claim": "Aus einem Commit kann automatisch eine neue Editionsvorschau entstehen", "sources": [{"label": "GitHub Pages", "url": "https://docs.github.com/en/pages"}, {"label": "GitLab Pages", "url": "https://docs.gitlab.com/user/project/pages/"}, {"label": "GitHub Actions", "url": "https://docs.github.com/en/actions"}], "surprise": "Die Automatisierung kann über Prüfungen hinausgehen: Aus TEI/XML lassen sich bei neuen Commits mittels XSLT und weiterer Werkzeuge HTML-Seiten, Register, Suchindizes oder Publikationsdateien erzeugen.", "utility": "Die veröffentlichte Ansicht kann wiederholt und nachvollziehbar aus einem festgelegten Datenstand erstellt werden; Änderungen werden zeitnah sichtbar.", "limits": "Das ist ein zusätzlich eingerichteter Publikationsprozess, keine eingebaute Eigenschaft von Git. Für Wiederholbarkeit müssen auch Softwareversionen, externe Daten und Einstellungen dokumentiert werden.", "en": {"title": "A commit can trigger a new edition preview.", "claim": "A commit can trigger a new edition preview.", "detail": "Automation can go beyond testing: With new commits using XSLT and other tools, you can create HTML pages, index, search indices or publication files from TEI/XML. The published view can be generated repeatedly and easily from a specified data status; changes become visible in a timely manner. This is an additional publication process, not a built-in property of Git. Software versions, external data and settings must also be documented for repeatability.", "label": "How it works and why it matters"}}, {"id": "F04", "kind": "F", "section": "Git kann mehr, als Dateien zu speichern", "title": "Ein Repository kann die Übernahme ungeprüfter Änderungen erschweren", "claim": "Ein Repository kann die Übernahme ungeprüfter Änderungen erschweren", "sources": [{"label": "GitHub – Protected Branches", "url": "https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches"}, {"label": "GitLab – Protected Branches", "url": "https://docs.gitlab.com/user/project/repository/branches/protected/"}], "surprise": "Hosting-Plattformen unterstützen Schutzregeln für wichtige Branches (Entwicklungszweige). Man kann beispielsweise verlangen, dass automatische Tests erfolgreich sind oder eine zweite Person die Änderung geprüft hat, bevor sie in die gemeinsame Hauptfassung gelangt.", "utility": "Ein Team kann technische Mindeststandards – etwa erfolgreiche XML-Validierung – verbindlich in den Arbeitsablauf integrieren.", "limits": "Solche Regeln gelten nur dort, wo sie eingerichtet und nicht umgangen werden können. Eine Freigabe ist nicht automatisch eine wissenschaftliche Begutachtung.", "en": {"title": "Repositories can require checks before accepting changes.", "claim": "Repositories can require checks before accepting changes.", "detail": "Hosting platforms support protection rules for important industries (development branches). One can, for example, demand that automatic tests are successful or a second person has checked the change before entering the common main version. A team can integrate minimum technical standards – such as successful XML validation – into the workflow. Such rules apply only where they can be set up and not circumvented. A approval is not automatically a scientific review.", "label": "How it works and why it matters"}}, {"id": "F05", "kind": "F", "section": "Git kann mehr, als Dateien zu speichern", "title": "Schon vor dem Anlegen eines Commits können Programme gestartet werden", "claim": "Schon vor dem Anlegen eines Commits können Programme gestartet werden", "sources": [{"label": "Pro Git – Git Hooks", "url": "https://git-scm.com/book/en/v2/Customizing-Git-Git-Hooks"}], "surprise": "Git Hooks sind Skripte, die auf bestimmte Git-Ereignisse reagieren. Ein pre-commit hook wird beispielsweise vor dem Anlegen eines neuen Commits ausgeführt.", "utility": "Auf einem lokalen Rechner kann automatisch eine XML-Prüfung, eine Formatkontrolle oder die Suche nach versehentlich aufgenommenen Dateien beginnen.", "limits": "Lokale Hooks müssen eingerichtet werden und lassen sich umgehen. Sie ersetzen keine zentralen Regeln für gemeinsam veröffentlichte Daten.", "en": {"title": "Programs can run even before a commit is saved.", "claim": "Programs can run even before a commit is saved.", "detail": "Git Hooks are scripts that respond to certain Git events. For example, a pre-commit hook is executed before creating a new commit. On a local machine, a XML check, format check or search for accidentally recorded files can start automatically. Local hooks need to be set up and can be bypassed. They do not replace central rules for jointly published data.", "label": "How it works and why it matters"}}, {"id": "F06", "kind": "F", "section": "Git kann mehr, als Dateien zu speichern", "title": "Mehrere Entwicklungsstände können gleichzeitig geöffnet bleiben", "claim": "Mehrere Entwicklungsstände können gleichzeitig geöffnet bleiben", "sources": [{"label": "Git – git-worktree", "url": "https://git-scm.com/docs/git-worktree"}], "surprise": "Mit Git Worktree lassen sich mehrere Arbeitsverzeichnisse anlegen, die auf unterschiedliche Branches desselben Repositories zeigen.", "utility": "Man kann etwa die veröffentlichte Edition in einem Verzeichnis betrachten und eine neue TEI-Auszeichnungsstrategie parallel in einem anderen erproben.", "limits": "Die Trennung betrifft Arbeitsverzeichnisse, nicht automatisch unabhängige Datenbestände, Zugriffskontrollen oder Archivkopien.", "en": {"title": "Several project versions can be open simultaneously.", "claim": "Several project versions can be open simultaneously.", "detail": "With Git Worktree you can create several work directories that show on different branches of the same repository. One can look at the published edition in one directory and test a new TEI markup strategy in parallel in another. The separation concerns working directories, not automatically independent data stocks, access controls or archive copies.", "label": "How it works and why it matters"}}, {"id": "F07", "kind": "F", "section": "In der Versionsgeschichte steckt mehr, als zunächst sichtbar ist", "title": "Ein Commit enthält weit mehr als eine Commit-Nachricht", "claim": "Ein Commit enthält weit mehr als eine Commit-Nachricht", "sources": [{"label": "Git – git-show", "url": "https://git-scm.com/docs/git-show"}], "surprise": "Ein Commit enthält eine eindeutige Kennung, einen Verweis auf den gespeicherten Dateibestand, Verweise auf Vorgänger-Commits, Angaben zu Autor und Ersteller, Zeitangaben und eine Nachricht. Gegebenenfalls kommt eine digitale Signatur hinzu. Die Unterschiede zwischen zwei Ständen lassen sich daraus und aus den zugehörigen Dateibeständen berechnen.", "utility": "Es lassen sich technische Abfolgen, Zuschreibungen und Bearbeitungskontexte untersuchen – auch wenn die erklärende Nachricht knapp ist.", "limits": "Die Metadaten beweisen nicht ohne Weiteres die Identität der handelnden Person, die Arbeitsdauer oder die Gründe einer Entscheidung.", "en": {"title": "A commit holds much more than a message.", "claim": "A commit holds much more than a message.", "detail": "A commit contains a unique identifier, a reference to the stored file stock, references to previous commits, information about author and creator, time details and a message. If necessary, a digital signature is added. The differences between two levels can be calculated from it and from the corresponding file stocks. Technical sequences, attributions and editing contexts can be investigated – even if the explaining message is scarce. The metadata does not easily prove the identity of the person acting, the length of work or the reasons for a decision.", "label": "How it works and why it matters"}}, {"id": "F08", "kind": "F", "section": "In der Versionsgeschichte steckt mehr, als zunächst sichtbar ist", "title": "Autor und technische Erstellerin eines Commits können verschieden sein", "claim": "Autor und technische Erstellerin eines Commits können verschieden sein", "sources": [{"label": "Git – git-show", "url": "https://git-scm.com/docs/git-show"}], "surprise": "Git unterscheidet Author (wem die Änderung zugeschrieben wird) und Committer (wer den Commit in seiner vorliegenden Form erzeugt hat).", "utility": "Das hilft, eingereichte Beiträge, übernommene Änderungen oder die Übertragung älterer Projektbestände differenzierter zu verstehen.", "limits": "Beide Angaben sind konfigurierbare Metadaten, nicht automatisch überprüfte Identitätsnachweise.", "en": {"title": "A commit can have a different author and committer.", "claim": "A commit can have a different author and committer.", "detail": "Git distinguishes author (who is attributed the change) and committer (who has created the commit in its present form). This helps to understand more differentiatedly submitted contributions, adopted changes or the transfer of older project portfolios. Both data are configurable metadata, not automatically verified proofs of identity.", "label": "How it works and why it matters"}}, {"id": "F09", "kind": "F", "section": "In der Versionsgeschichte steckt mehr, als zunächst sichtbar ist", "title": "Die Geschichte einzelner Textzeilen lässt sich verfolgen", "claim": "Die Geschichte einzelner Textzeilen lässt sich verfolgen", "sources": [{"label": "Git – git-blame", "url": "https://git-scm.com/docs/git-blame"}], "surprise": "git blame kann anzeigen, welcher Commit eine Zeile zuletzt geändert hat; bestimmte Optionen berücksichtigen auch verschobene oder kopierte Zeilen.", "utility": "Die Entstehung einer Lesart oder einer TEI-Auszeichnung lässt sich bis zu einem früheren Bearbeitungsstand zurückverfolgen.", "limits": "Bei Umformatierungen kann die Zuordnung irreführend werden. Der zuletzt dokumentierte Eingriff sagt nicht automatisch etwas über wissenschaftliche Verantwortung aus.", "en": {"title": "You can trace the recorded history of individual lines.", "claim": "You can trace the recorded history of individual lines.", "detail": "git blame can show which commit has last changed a line; certain options also take into account moved or copied lines. The creation of a read or TEI markup can be traced back to an earlier editing state. When reformatting, the assignment can be misleading. The last documented intervention does not automatically say anything about scientific responsibility.", "label": "How it works and why it matters"}}, {"id": "F10", "kind": "F", "section": "In der Versionsgeschichte steckt mehr, als zunächst sichtbar ist", "title": "Man kann die Geschichte nach bestimmten Textänderungen durchsuchen", "claim": "Man kann die Geschichte nach bestimmten Textänderungen durchsuchen", "sources": [{"label": "Git – git-log", "url": "https://git-scm.com/docs/git-log"}, {"label": "Git – diff-options", "url": "https://git-scm.com/docs/diff-options"}], "surprise": "Git kann nach Commits suchen, bei denen eine Zeichenfolge hinzugefügt oder entfernt wurde. Die dafür bekannte Suchfunktion heißt Pickaxe.", "utility": "So lässt sich beispielsweise untersuchen, wann bestimmte TEI-Elemente, Namensformen oder Referenzen häufiger beziehungsweise seltener wurden.", "limits": "Die Suche ist zeichenfolgenorientiert und kein vollwertiger semantischer XML-Vergleich. Sie deckt nicht automatisch jede inhaltlich relevante Änderung auf.", "en": {"title": "You can search history for a particular text change.", "claim": "You can search history for a particular text change.", "detail": "Git can search for commits where a string has been added or removed. The known search function is Pickaxe. For example, it is possible to examine when certain TEI elements, name forms or references became more common or rarer. The search is string-oriented and not a full-fledged semantic XML comparison. It does not automatically reveal any relevant change in content.", "label": "How it works and why it matters"}}, {"id"
