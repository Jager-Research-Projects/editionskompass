: "F11", "kind": "F", "section": "In der Versionsgeschichte steckt mehr, als zunächst sichtbar ist", "title": "Beliebige historische Projektstände lassen sich vergleichen", "claim": "Beliebige historische Projektstände lassen sich vergleichen", "sources": [{"label": "Git – git-diff", "url": "https://git-scm.com/docs/git-diff"}], "surprise": "Ein Diff ist die Darstellung von Unterschieden zwischen zwei Bearbeitungsständen. Git kann auch Stände vergleichen, zwischen denen Jahre und sehr viele Commits liegen.", "utility": "Sichtbar werden langfristige Umstrukturierungen, neue Dokumentgruppen und die Entwicklung einer Editionsfassung.", "limits": "Der Vergleich zeigt Unterschiede zwischen den gewählten Zuständen, nicht alle dazwischenliegenden Überlegungen oder Entscheidungen.", "en": {"title": "You can compare project states years apart.", "claim": "You can compare project states years apart.", "detail": "A diff is the representation of differences between two editing levels. Git can also compare states between which years and very many commits lie. Long-term restructurings, new document groups and the development of an edition will become visible. The comparison shows differences between the chosen states, not all intervening considerations or decisions.", "label": "How it works and why it matters"}}, {"id": "F12", "kind": "F", "section": "In der Versionsgeschichte steckt mehr, als zunächst sichtbar ist", "title": "Git kann Umbenennungen von Dateien erkennen", "claim": "Git kann Umbenennungen von Dateien erkennen", "sources": [{"label": "Git – git-log", "url": "https://git-scm.com/docs/git-log"}], "surprise": "Beim Vergleich von Bearbeitungsständen kann Git anhand inhaltlicher Ähnlichkeit darauf schließen, dass eine Datei verschoben oder umbenannt wurde.", "utility": "Das hilft, Texte durch Änderungen von Ordnerstruktur, Signaturen oder Dateinamen hinweg zu verfolgen.", "limits": "Eine Umbenennung wird in Git nicht grundsätzlich als eigenes Ereignis gespeichert; die Erkennung ist abhängig von Vergleichsoptionen und Ähnlichkeitsgrenzen.", "en": {"title": "Git can infer that a file was renamed.", "claim": "Git can infer that a file was renamed.", "detail": "When comparing editing positions, Git can use similar content to suggest that a file has been moved or renamed. This helps track texts by changing folder structure, signatures or file names. A renaming is not generally stored in Git as an own event; the recognition depends on comparison options and similarities.", "label": "How it works and why it matters"}}, {"id": "F13", "kind": "F", "section": "In der Versionsgeschichte steckt mehr, als zunächst sichtbar ist", "title": "Der Ursprung eines Fehlers lässt sich durch systematisches Halbieren finden", "claim": "Der Ursprung eines Fehlers lässt sich durch systematisches Halbieren finden", "sources": [{"label": "Git – git-bisect", "url": "https://git-scm.com/docs/git-bisect/"}], "surprise": "git bisect prüft schrittweise ältere Commits, um den Übergang von einem funktionierenden zu einem fehlerhaften Zustand einzugrenzen.", "utility": "Hilfreich, wenn eine XSLT-Transformation, ein Register oder die Generierung einer Editionswebsite irgendwann fehlerhaft geworden ist.", "limits": "Man benötigt einen sinnvollen Test, mit dem sich für untersuchte Versionen feststellen lässt, ob das Problem schon auftritt.", "en": {"title": "Git can locate the first version containing a fault.", "claim": "Git can locate the first version containing a fault.", "detail": "git bisect gradually checks older commits to limit the transition from a functioning to a faulty state. Helpful if an XSLT transformation, a index or the generation of an edition website has eventually become flawed. One needs a useful test, with which it can be determined for examined versions whether the problem already occurs.", "label": "How it works and why it matters"}}, {"id": "F14", "kind": "F", "section": "In der Versionsgeschichte steckt mehr, als zunächst sichtbar ist", "title": "Ältere Commits lassen sich nachträglich kommentieren, ohne sie umzuschreiben", "claim": "Ältere Commits lassen sich nachträglich kommentieren, ohne sie umzuschreiben", "sources": [{"label": "Git – git-notes", "url": "https://git-scm.com/docs/git-notes"}], "surprise": "Git Notes sind zusätzliche Anmerkungen, die einem Commit zugeordnet werden können, ohne dessen ursprünglichen Inhalt zu verändern.", "utility": "Eine spätere quellenkritische Einordnung kann von der ursprünglich überlieferten Bearbeitung getrennt bleiben.", "limits": "Solche Notizen werden nicht in allen Programmen angezeigt und nicht automatisch bei jeder Synchronisierung übertragen.", "en": {"title": "You can annotate an older commit without rewriting it.", "claim": "You can annotate an older commit without rewriting it.", "detail": "Git Notes are additional notes that can be assigned to a commit without changing its original content. A later source-critical classification can remain separate from the originally handed down editing. Such notes are not displayed in all programs and are not automatically transmitted with each synchronization.", "label": "How it works and why it matters"}}, {"id": "F15", "kind": "F", "section": "In der Versionsgeschichte steckt mehr, als zunächst sichtbar ist", "title": "Manche vermeintlich verlorenen Bearbeitungsstände lassen sich wiederfinden", "claim": "Manche vermeintlich verlorenen Bearbeitungsstände lassen sich wiederfinden", "sources": [{"label": "Git – git-reflog", "url": "https://git-scm.com/docs/git-reflog"}], "surprise": "Das lokale Reflog zeichnet auf, wohin Git-Verweise zuletzt gezeigt haben. Damit lassen sich unter Umständen auch nach einer versehentlichen Rücksetzung ältere Commits wiederfinden.", "utility": "Nützlich bei Bedienfehlern oder versehentlich verworfenen Entwicklungszweigen.", "limits": "Die Aufzeichnungen sind lokal, können ablaufen und bereinigt werden. Das Reflog ist kein Backup.", "en": {"title": "Some apparently lost commits can be recovered.", "claim": "Some apparently lost commits can be recovered.", "detail": "The local reflog records where Git-Vweise last showed. This may also be possible after an accidental reset of older commits. Useful in case of operating errors or accidentally discarded developmental branches. The records are local, can run and be cleaned up. Reflog is not a backup.", "label": "How it works and why it matters"}}, {"id": "F16", "kind": "F", "section": "Versionsgeschichten lassen sich anschaulich visualisieren", "title": "Die gesamte Entwicklung lässt sich als verzweigtes Diagramm ansehen", "claim": "Die gesamte Entwicklung lässt sich als verzweigtes Diagramm ansehen", "sources": [{"label": "GitKraken", "url": "https://www.gitkraken.com/"}, {"label": "Sourcetree", "url": "https://www.sourcetreeapp.com/"}, {"label": "Oxygen Git Client", "url": "https://www.oxygenxml.com/addons/com.oxygenxml.git.html"}], "surprise": "Grafische Git-Programme stellen Commits als Punkte und ihre technischen Beziehungen als Verbindungslinien dar. So sieht man Entwicklungszweige und deren Zusammenführung (Merge) auf einen Blick.", "utility": "Parallele Bearbeitung, Integrationsphasen und längere Entwicklungslinien werden leichter verständlich.", "limits": "Das Diagramm zeigt Beziehungen zwischen gespeicherten Ständen, nicht alle Kommunikations- oder Entscheidungsprozesse.", "en": {"title": "Project history can be viewed as a branching diagram.", "claim": "Project history can be viewed as a branching diagram.", "detail": "Graphical Git programs represent commits as points and their technical relationships as connecting lines. Thus one sees development branches and their merging (merge) at a glance. Parallel processing, integration phases and longer development lines become easier to understand. The diagram shows relationships between stored levels, not all communication or decision-making processes.", "label": "How it works and why it matters"}}, {"id": "F17", "kind": "F", "section": "Versionsgeschichten lassen sich anschaulich visualisieren", "title": "Ein Git-Projekt kann als animierte Landschaft gezeigt werden", "claim": "Ein Git-Projekt kann als animierte Landschaft gezeigt werden", "sources": [{"label": "Gource – offizielle Website", "url": "https://gource.io/"}], "surprise": "Das Visualisierungsprogramm Gource zeigt die Entwicklung eines Repositories als Animation: Verzeichnisse, Dateien und protokollierte Beiträge erscheinen als bewegte Elemente.", "utility": "Sehr geeignet, um Entstehung, Wachstum und Umstrukturierung eines Projekts in einem Vortrag zu zeigen.", "limits": "Die Animation basiert auf den sichtbaren Git-Daten. Sie zeigt nicht den gesamten Arbeitsaufwand und kann Muster ästhetisch eindrucksvoller erscheinen lassen, als sie methodisch belastbar sind.", "en": {"title": "Git history can become an animated landscape.", "claim": "Git history can become an animated landscape.", "detail": "The Gource visualization program shows the development of a repository as an animation: directories, files and logged posts appear as moving elements. Very suitable to show the emergence, growth and restructuring of a project in a lecture. The animation is based on the visible Git data. It does not show the entire workload and can make patterns appear aesthetically more impressive than they are methodically resilient.", "label": "How it works and why it matters"}}, {"id": "F18", "kind": "F", "section": "Versionsgeschichten lassen sich anschaulich visualisieren", "title": "Aus Git-Metadaten lassen sich Zeitreihen und Aktivitätsdiagramme erzeugen", "claim": "Aus Git-Metadaten lassen sich Zeitreihen und Aktivitätsdiagramme erzeugen", "sources": [{"label": "Git – git-log", "url": "https://git-scm.com/docs/git-log"}, {"label": "GitHub – Repository Insights", "url": "https://docs.github.com/en/repositories/viewing-activity-and-data-for-your-repository"}], "surprise": "Commit-Zeitpunkte, geänderte Dateien und dokumentierte Bearbeitungshäufigkeiten lassen sich statistisch aufbereiten und visualisieren.", "utility": "Damit lassen sich Arbeitsphasen, technische Umstrukturierungen und unterschiedliche Projektpraktiken untersuchen.", "limits": "Die Zahl der Commits ist weder ein verlässlicher Arbeitszeitnachweis noch ein objektives Produktivitätsmaß. Personenbezogene Analysen werfen zusätzliche Datenschutzfragen auf.", "en": {"title": "Git metadata can power activity charts.", "claim": "Git metadata can power activity charts.", "detail": "Commit times, modified files and documented editing frequencies can be statistically processed and visualized. This allows the study of work phases, technical restructuring and different project practices. The number of commits is neither a reliable proof of working time nor an objective measure of productivity. Personal analyses raise additional data protection questions.", "label": "How it works and why it matters"}}, {"id": "F19", "kind": "F", "section": "Versionsgeschichten lassen sich anschaulich visualisieren", "title": "Unterschiede lassen sich auch innerhalb einzelner Zeilen hervorheben", "claim": "Unterschiede lassen sich auch innerhalb einzelner Zeilen hervorheben", "sources": [{"label": "Git – git-diff", "url": "https://git-scm.com/docs/git-diff"}], "surprise": "Git kann statt ganzer geänderter Zeilen auch kleinere Textelemente als Unterschiede hervorheben; diese Darstellung heißt Word Diff.", "utility": "Besonders hilfreich bei langen XML-Zeilen, in denen nur ein Wort oder ein kleiner Abschnitt geändert wurde.", "limits": "Ein Wortvergleich ist noch kein Vergleich der semantischen Bedeutung von TEI-Elementen.", "en": {"title": "Git can highlight differences within a line.", "claim": "Git can highlight differences within a line.", "detail": "Git can also highlight smaller text elements as differences instead of completely changed lines; this representation is called Word Diff. Especially helpful for long XML lines where only one word or a small section has been changed. A word comparison is not yet a comparison of the semantic meaning of TEI elements.", "label": "How it works and why it matters"}}, {"id": "F20", "kind": "F", "section": "Versionsgeschichten lassen sich anschaulich visualisieren", "title": "Vergleiche lassen sich für unterschiedliche Dateitypen anpassen", "claim": "Vergleiche lassen sich für unterschiedliche Dateitypen anpassen", "sources": [{"label": "Git – gitattributes", "url": "https://git-scm.com/docs/gitattributes"}], "surprise": "Mit einer Git-Konfigurationsdatei namens .gitattributes können Dateitypen unterschiedlich behandelt und eigene Vergleichsprogramme eingebunden werden.", "utility": "XML-Dateien lassen sich für Vergleiche gezielt aufbereiten, um rein technische Formatierungsänderungen besser von inhaltlich interessanten Eingriffen zu trennen.", "limits": "Ein projektspezifischer Vergleich benötigt zusätzliche Einrichtung und ist nicht automatisch wissenschaftlich interpretierend.", "en": {"title": "Git comparisons can be adapted to file types.", "claim": "Git comparisons can be adapted to file types.", "detail": "With a Git configuration file called .gitattributes, file types can be handled differently and own comparison programs can be integrated. XML files can be prepared specifically for comparisons in order to better separate purely technical formatting changes from content-related interesting interventions. A project-specific comparison requires additional institution and is not automatically scientifically interpretative.", "label": "How it works and why it matters"}}, {"id": "F21", "kind": "F", "section": "Edition, Forschung, Publikation und Archivierung", "title": "Git funktioniert auch vollständig lokal und offline", "claim": "Git funktioniert auch vollständig lokal und offline", "sources": [{"label": "Pro Git – About Version Control", "url": "https://git-scm.com/book/en/v2/Getting-Started-About-Version-Control"}], "surprise": "Dateien versionieren, Commits anlegen, Unterschiede vergleichen und Branches verwalten funktioniert ohne Hosting-Plattform und ohne Internetzugang.", "utility": "Auch Einzelpersonen können die eigene Transkriptions- und Auszeichnungspraxis nachvollziehbar gestalten.", "limits": "Ohne eine zusätzliche, unabhängig aufbewahrte Kopie ist die lokale Versionsgeschichte nicht vor Geräteverlust geschützt.", "en": {"title": "Git works fully offline.", "claim": "Git works fully offline.", "detail": "Versioning files, creating commits, comparing differences and managing industries works without hosting platform or Internet access. Individuals can also make their own transcription and markup practice comprehensible. Without an additional, independently stored copy, the local version history is not protected from device loss.", "label": "How it works and why it matters"}}, {"id": "F22", "kind": "F", "section": "Edition, Forschung, Publikation und Archivierung", "title": "Eine Git-Versionsgeschichte lässt sich in einer Datei bündeln", "claim": "Eine Git-Versionsgeschichte lässt sich in einer Datei bündeln", "sources": [{"label": "Git – git-bundle", "url": "https://git-scm.com/docs/git-bundle"}], "surprise": "Ein Git Bundle ist eine transportable Datei, die ausgewählte Git-Objekte und Verweise eines Repositories enthält. Sie kann ohne einen laufenden Git-Server weitergegeben und wieder eingelesen werden.", "utility": "Geeignet für Offline-Transfers, technische Projektübergaben und bestimmte Sicherungsszenarien.", "limits": "Ein Bundle enthält nicht automatisch ungespeicherte Arbeitsdateien, sämtliche lokalen Einstellungen oder extern gespeicherte Inhalte wie Git-LFS-Objekte.", "en": {"title": "A Git history can be packed into one portable file.", "claim": "A Git history can be packed into one portable file.", "detail": "A Git Bundle is a portable file containing selected Git objects and references of a repository. It can be passed on and reread without a running Git server. Suitable for offline transfers, technical project transfers and certain backup scenarios. A bundle does not automatically contain unsaved working files, all local settings or externally stored content such as Git LFS objects.", "label": "How it works and why it matters"}}, {"id": "F23", "kind": "F", "section": "Edition, Forschung, Publikation und Archivierung", "title": "Aus einem historischen Stand lässt sich ein reines Datenarchiv erzeugen", "claim": "Aus einem historischen Stand lässt sich ein reines Datenarchiv erzeugen", "sources": [{"label": "Git – git-archive", "url": "https://git-scm.com/docs/git-archive"}], "surprise": "Mit git archive kann man die Dateien eines bestimmten Commits als ZIP- oder TAR-Archiv exportieren – ohne die ganze Git-Historie mitzugeben.", "utility": "Damit kann ein klar definierter Publikationsstand veröffentlicht werden, während die interne Arbeitsgeschichte im Projekt bleibt.", "limits": "Ein Dateiexport ohne Versionsgeschichte dokumentiert selbst nicht, wie die Daten entstanden sind. Auch externe Abhängigkeiten müssen gesondert berücksichtigt werden.", "en": {"title": "You can export just the files from a historic version.", "claim": "You can export just the files from a historic version.", "detail": "With git archive, you can export the files of a particular commit as ZIP or TAR archives – without giving the whole Git history. This enables a clearly defined publication status to be published, while the internal work history remains in the project. A file export without a version history does not document how the data was created. External dependencies must also be taken into account separately.", "label": "How it works and why it matters"}}, {"id": "F24", "kind": "F", "section": "Edition, Forschung, Publikation und Archivierung", "title": "Veröffentlichungsstände lassen sich mit Namen markieren", "claim": "Veröffentlichungsstände lassen sich mit Namen markieren", "sources": [{"label": "Pro Git – Tagging", "url": "https://git-scm.com/book/en/v2/Git-Basics-Tagging"}], "surprise": "Ein Tag ist eine benannte Markierung eines bestimmten Commits – ähnlich einem Lesezeichen in der Geschichte des Projekts. edition-1.0 könnte beispielsweise den Stand einer veröffentlichten Edition bezeichnen.", "utility": "Bestimmte Fassungen werden wiederauffindbar und lassen sich leichter zitieren oder exportieren.", "limits": "Ein Tag ist noch keine Publikation, kein DOI und kein Archivierungsnachweis. Solche Markierungen können technisch verändert oder gelöscht werden.", "en": {"title": "Published states can be given memorable names.", "claim": "Published states can be given memorable names.", "detail": "A tag is a named tag of a particular commit – similar to a bookmark in the history of the project. edition-1.0 could, for example, refer to the version of a published edition. Some versions are found and can be cited or exported more easily. A tag is not yet a publication, no DOI and no archival proof. Such markings can be changed or deleted technically.", "label": "How it works and why it matters"}}, {"id": "F25", "kind": "F", "section": "Edition, Forschung, Publikation und Archivierung", "title": "Commits und Tags können digital signiert werden", "claim": "Commits und Tags können digital signiert werden", "sources": [{"label": "Pro Git – Signing Your Work", "url": "https://git-scm.com/book/en/v2/Git-Tools-Signing-Your-Work.html"}], "surprise": "Bestimmte Git-Objekte lassen sich kryptografisch signieren. Unter geeigneten Bedingungen lässt sich dann prüfen, ob der signierte Stand zur verwendeten Signatur und dem entsprechenden Schlüssel passt.", "utility": "Signaturen können technische Nachweise zu einer freigegebenen Fassung unterstützen.", "limits": "Sie beweisen weder die inhaltliche Richtigkeit der Edition noch allein die reale Identität oder wissenschaftliche Verantwortung einer Person.", "en": {"title": "Commits and tags can carry digital signatures.", "claim": "Commits and tags can carry digital signatures.", "detail": "Certain Git objects can be signed cryptographically. Under suitable conditions, it is possible to check whether the signed version matches the signature used and the corresponding key. Signatures may support technical evidence of a released version. They prove neither the contentual correctness of the edition nor the real identity or scientific responsibility of a person alone.", "label": "How it works and why it matters"}}, {"id": "F26", "kind": "F", "section": "Edition, Forschung, Publikation und Archivierung", "title": "Auf einzelne Zeilen eines bestimmten historischen Stands lässt sich verlinken", "claim": "Auf einzelne Zeilen eines bestimmten historischen Stands lässt sich verlinken", "sources": [{"label": "GitHub – Permanent links to files", "url": "https://docs.github.com/en/repositories/working-with-files/using-files/getting-permanent-links-to-files"}], "surprise": "Plattformen wie GitHub können dauerhafter angelegte Links auf Dateien in einem ganz bestimmten Commit bereitstellen, gegebenenfalls bis zur einzelnen Zeile.", "utility": "In einer Forschungsdiskussion lässt sich auf den genauen damaligen Stand einer TEI-Datei verweisen statt auf die stets veränderliche aktuelle Fassung.", "limits": "Die dauerhafte Erreichbarkeit hängt von der Aufbewahrung und Zugänglichkeit ab. Zeilennummern sind keine editorisch stabilen Textanker.", "en": {"title": "You can link to lines in an exact historical version.", "claim": "You can link to lines in an exact historical version.", "detail": "Platforms such as GitHub can provide more permanent created links to files in a specific commit, if necessary up to the single line. In a research discussion you can refer to the exact version of a TEI file at that time rather than to the always variable current version. Permanent accessibility depends on storage and accessibility. Line numbers are not editorially stable text anchors.", "label": "How it works and why it matters"}}, {"id": "F27", "kind": "F", "section": "Edition, Forschung, Publikation und Archivierung", "title": "Die Entwicklung des Textes und seiner Werkzeuge kann gemeinsam dokumentiert werden", "claim": "Die Entwicklung des Textes und seiner Werkzeuge kann gemeinsam dokumentiert werden", "sources": [{"label": "Pro Git – Recording Changes", "url": "https://git-scm.com/book/en/v2/Git-Basics-Recording-Changes-to-the-Repository"}], "surprise": "Im selben Repository können neben TEI-Dateien auch Schema-Dateien, XSLT-Transformationen, Skripte, ODD-Spezifikationen und Konfigurationen versioniert werden.", "utility": "Ein späterer Vergleich kann zeigen, ob Änderungen an der Datenauszeichnung zusammen mit Änderungen der Editionsrichtlinien oder technischen Verarbeitung vorgenommen wurden.", "limits": "Die gemeinsame Aufbewahrung erzeugt noch keine automatische Erklärung kausaler Zusammenhänge. Externe Systeme müssen zusätzlich dokumentiert werden.", "en": {"title": "Text and editing tools can have a shared history.", "claim": "Text and editing tools can have a shared history.", "detail": "In addition to TEI files, schema files, XSLT transformations, scripts, ODD specifications and configurations can be versioned in the same repository. A later comparison can show whether changes have been made to the data display along with changes to the edition guidelines or technical processing. The joint storage does not yet generate an automatic explanation of causal relationships. External systems must be additionally documented.", "label": "How it works and why it matters"}}, {"id": "F28", "kind": "F", "section": "Edition, Forschung, Publikation und Archivierung", "title": "Alternative Editionsrichtlinien lassen sich ausprobieren, ohne den Hauptstand zu überschreiben", "claim": "Alternative Editionsrichtlinien lassen sich ausprobieren, ohne den Hauptstand zu überschreiben", "sources": [{"label": "Pro Git – Branches in a Nutshell", "url": "https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell"}], "surprise": "Ein Branch ist ein Entwicklungszweig, in dem man Änderungen unabhängig vom gemeinsam genutzten Hauptstand weiterführen kann. Später lassen sich die Arbeiten gegebenenfalls wieder zusammenführen (Merge).", "utility": "Alternative TEI-Auszeichnungsmodelle, Normalisierungen oder Transformationswege können erprobt und verglichen werden.", "limits": "Die spätere Zusammenführung kann technische Konflikte erzeugen. Auch konfliktfreie Änderungen können editorisch unvereinbar sein.", "en": {"title": "You can experiment with editorial rules without replacing the main version.", "claim": "You can experiment with editorial rules without replacing the main version.", "detail": "A branch is a branch of development in which changes can be continued independently of the shared main status. Later, the work can be reunited (merge) if necessary. Alternative TEI markup models, normalizations or transformation paths can be tested and compared. The later merging can create technical conflicts. Also conflict-free changes can be editorially incompatible.", "label": "How it works and why it matters"}}, {"id": "F29", "kind": "F", "section": "Weitere Funktionen für den Alltag und die Langzeitperspektive", "title": "Ein Commit muss nicht alle Änderungen einer Datei enthalten", "claim": "Ein Commit muss nicht alle Änderungen einer Datei enthalten", "sources": [{"label": "Pro Git – Interactive Staging", "url": "https://git-scm.com/book/en/v2/Git-Tools-Interactive-Staging"}], "surprise": "Git kann einzelne Änderungsabschnitte für einen Commit auswählen. Das wird oft Partial Staging genannt – also das gezielte Vormerken nur eines Teils der Änderungen.", "utility": "Eine orthografische Korrektur und eine Änderung der XML-Auszeichnung können getrennt dokumentiert werden, obwohl sie dieselbe Datei betreffen.", "limits": "Ausgewählte Teilschritte können vorübergehend ungültiges XML ergeben. Deshalb sollte der zu speichernde Gesamtzustand geprüft werden.", "en": {"title": "A commit can contain only selected changes.", "claim": "A commit can contain only selected changes.", "detail": "Git can select individual change sections for a commit. This is often called partial staging – i.e. the targeted prefixing of only part of the changes. An orthographic correction and a modification of the XML markup can be documented separately, although they concern the same file. Selected substeps can result in temporarily invalid XML. Therefore, the overall state to be saved should be checked.", "label": "How it works and why it matters"}}, {"id": "F30", "kind": "F", "section": "Weitere Funktionen für den Alltag und die Langzeitperspektive", "title": "Unfertige Arbeit lässt sich zwischenspeichern", "claim": "Unfertige Arbeit lässt sich zwischenspeichern", "sources": [{"label": "Pro Git – Stashing and Cleaning", "url": "https://git-scm.com/book/en/v2/Git-Tools-Stashing-and-Cleaning.html"}], "surprise": "Mit Git Stash können noch nicht in einem Commit festgehaltene Änderungen zeitweilig beiseitegelegt und später wieder eingespielt werden.", "utility": "Man kann kurzfristig eine dringende Korrektur vornehmen und anschließend zu einer längeren, noch unfertigen Bearbeitung zurückkehren.", "limits": "Diese Zwischenspeicherung ist keine langfristige wissenschaftliche Dokumentation und keine sichere Backup-Strategie.", "en": {"title": "Unfinished work can be temporarily put aside.", "claim": "Unfinished work can be temporarily put aside.", "detail": "With Git Stash, changes not yet recorded in a commit can be temporarily set aside and replayed later. One can make an urgent correction in the short term and then return to a longer, still unfinished processing. This intermediate storage is not a long-term scientific documentation and no secure backup strategy.", "label": "How it works and why it matters"}}, {"id": "F31", "kind": "F", "section": "Weitere Funktionen für den Alltag und die Langzeitperspektive", "title": "Ein Clone enthält häufig auch die Vorgeschichte", "claim": "Ein Clone enthält häufig auch die Vorgeschichte", "sources": [{"label": "Git – git-clone", "url": "https://git-scm.com/docs/git-clone"}], "surprise": "Ein Clone ist eine lokale Kopie eines Repositories. Im Normalfall werden dabei nicht bloß die aktuellen Dateien, sondern auch die erreichbare Git-Geschichte übertragen.", "utility": "Ein Repo kann unabhängig von der Serververbindung untersucht und weiterbearbeitet werden.", "limits": "Es gibt auch eingeschränkte Kopierverfahren. Für Datenschutz und Veröffentlichung entscheidend ist, dass historische Metadaten und frühere Dateifassungen mitverbreitet werden können.", "en": {"title": "Cloning a repository often copies its earlier history too.", "claim": "Cloning a repository often copies its earlier history too.", "detail": "A clone is a local copy of a repository. Normally not only the current files, but also the achievable Git history are transferred. A repo can be examined and processed independently of the server connection. There are also limited copying procedures. For data protection and publication, it is crucial that historical metadata and previous file versions can be shared.", "label": "How it works and why it matters"}}, {"id": "F32", "kind": "F", "section": "Weitere Funktionen für den Alltag und die Langzeitperspektive", "title": "Unterschiedliche Namensangaben können für Statistiken zusammengeführt werden", "claim": "Unterschiedliche Namensangaben können für Statistiken zusammengeführt werden", "sources": [{"label": "Git – gitmailmap", "url": "https://git-scm.com/docs/gitmailmap"}], "surprise": "Mit einer Datei namens .mailmap lassen sich unterschiedliche Namen oder E-Mail-Adressen derselben Person für bestimmte Anzeigen und Auswertungen vereinheitlichen, ohne die alten Commits umzuschreiben.", "utility": "Besonders wichtig bei langfristigen Projekten, in denen Beteiligte unter mehreren Adressen oder Schreibweisen auftauchen.", "limits": "Die Zuordnung ist interpretativ und muss begründet werden; gleiche Namen bedeuten nicht zwingend gleiche Personen.", "en": {"title": "Different author names can be combined for display and statistics.", "claim": "Different author names can be combined for display and statistics.", "detail": "With a file called .mailmap, different names or email addresses of the same person can be unified for certain ads and evaluations without rewriting the old commits. Particularly important in long-term projects where stakeholders appear under several addresses or spellings. The assignment is interpretative and must be justified; the same names do not necessarily mean equal persons.", "label": "How it works and why it matters"}}, {"id": "F33", "kind": "F", "section": "Weitere Funktionen für den Alltag und die Langzeitperspektive", "title": "Manche Dateien lassen sich bewusst anders vergleichen", "claim": "Manche Dateien lassen sich bewusst anders vergleichen", "sources": [{"label": "Git – gitattributes", "url": "https://git-scm.com/docs/gitattributes"}], "surprise": "Über .gitattributes kann Git für bestimmte Dateien beispielsweise auf die gewöhnliche zeilenweise Vergleichsdarstellung verzichten oder externe Vergleichswerkzeuge einsetzen.", "utility": "Für erzeugte, binäre oder strukturell besondere Dateien lässt sich eine passende Darstellung wählen.", "limits": "Eine andersartige Darstellung verbirgt den Inhalt nicht vor berechtigten Nutzenden; sie ist keine Datenschutz- oder Zugriffsschutzfunktion.", "en": {"title": "Files can deliberately be compared differently.", "claim": "Files can deliberately be compared differently.", "detail": "About .gitattributes, for example, Git can dispense with the usual line-by-line comparison display for certain files or use external comparison tools. For created, binary or structurally special files you can choose a suitable representation. A different presentation does not hide the content from legitimate users; it is not a data protection or access protection function.", "label": "How it works and why it matters"}}, {"id": "F34", "kind": "F", "section": "Weitere Funktionen für den Alltag und die Langzeitperspektive", "title": "Große Begleitdateien können außerhalb der gewöhnlichen Git-Objekte liegen", "claim": "Große Begleitdateien können außerhalb der gewöhnlichen Git-Objekte liegen", "sources": [{"label": "Git LFS – offizielle Website", "url": "https://git-lfs.com/"}], "surprise": "Git Large File Storage (Git LFS) ergänzt Git um ein Verfahren für große Dateien: Im Git-Repository liegen Verweise, die eigentlichen Inhalte werden in einer zusätzlichen Speicherstruktur abgelegt.", "utility": "Hilfreich für hochauflösende Faksimiles, Audio-/Videodateien oder große Binärbestände.", "limits": "Für vollständige Übergaben und Langzeitarchivierung müssen die externen Dateiobjekte ausdrücklich mitgesichert werden.", "en": {"title": "Large media can live outside ordinary Git objects.", "claim": "Large media can live outside ordinary Git objects.", "detail": "Git Large File Storage (Git LFS) adds a procedure for large files: There are references in the Git repository, the actual content is stored in an additional storage structure. Helpful for high resolution facsimiles, audio/video files or large binary stocks. For complete handovers and long-term preservation the external file objects must be explicitly backed up.", "label": "How it works and why it matters"}}, {"id": "F35", "kind": "F", "section": "Weitere Funktionen für den Alltag und die Langzeitperspektive", "title": "Arbeitsgeschichte und veröffentlichte Daten können getrennt werden", "claim": "Arbeitsgeschichte und veröffentlichte Daten können getrennt werden", "sources": [{"label": "Git – git-archive", "url": "https://git-scm.com/docs/git-archive"}, {"label": "GitHub Actions", "url": "https://docs.github.com/en/actions"}], "surprise": "Man kann intern ein umfassendes Arbeitsrepository führen und für die Öffentlichkeit nur geprüfte Dateien oder einen bereinigten Datenexport bereitstellen – auch automatisiert.", "utility": "Das erlaubt Transparenz über publizierte Forschungsdaten, ohne sämtliche internen Diskussions- und Arbeitsmetadaten offenlegen zu müssen.", "limits": "Die Trennung muss konzeptionell und technisch zuverlässig eingerichtet werden; eine bloße Sichtbarkeitseinstellung bereinigt keine bereits veröffentlichte Versionsgeschichte.", "en": {"title": "Working history and published data can be kept separate.", "claim": "Working history and published data can be kept separate.", "detail": "You can run a comprehensive working repositorysitory internally and only provide audited files or an adjusted data export to the public – also automated. This allows transparency over published research data without having to disclose all internal discussion and work metadata. The separation has to be set up conceptually and technically reliably; a mere visibility setting does not clean up an already published version history.", "label": "How it works and why it matters"}}, {"id": "F36", "kind": "F", "section": "Weitere Funktionen für den Alltag und die Langzeitperspektive", "title": "Ein Git-Projekt ist nicht an eine Hosting-Plattform gebunden", "claim": "Ein Git-Projekt ist nicht an eine Hosting-Plattform gebunden", "sources": [{"label": "Pro Git – Git on the Server", "url": "https://git-scm.com/book/en/v2/Git-on-the-Server-The-Protocols"}], "surprise": "Die eigentliche Git-Geschichte lässt sich grundsätzlich auf einen anderen Dienst oder einen institutionellen Server übertragen.", "utility": "Das schafft Spielraum für Migration, institutionelle Kontrolle und langfristige Verfügbarkeit von Forschungsdaten.", "limits": "Plattformgebundene Zusatzinformationen wie Tickets (Issues), Diskussionsverläufe, Freigaben oder Zugriffsregeln sind nicht automatisch Teil der portablen Git-Geschichte.", "en": {"title": "A Git project is portable between hosting platforms.", "claim": "A Git project is portable between hosting platforms.", "detail": "The actual Git history can basically be transferred to another service or institutional server. This creates scope for migration, institutional control and long-term availability of research data. Platform-based additional information such as tickets (issues), discussion processes, approvals or access rules are not automatically part of the portable Git history.", "label": "How it works and why it matters"}}], "relations": [{"id": "R001", "a": "M01", "b": "F35", "direction": "→", "type": "Korrektur", "why": "Eine private oder öffentliche Plattformwahl ersetzt weder die bewusste Trennung von Arbeits- und Publikationsdaten noch die Prüfung der Zugriffslage.", "reverse": "Die Rückrichtung ist keine entsprechende Korrektur: Die Feature-Möglichkeit belegt nicht, dass jemand die Fehlannahme tatsächlich vertritt.", "en": {"type": "Correction", "why": "A private or public platform choice does not replace the deliberate separation of work and publication data nor the examination of the access situation.", "reverse": "The reverse is not a corresponding correction: The feature option does not prove that someone actually represents the misacceptance.", "id": "R001"}}, {"id": "R002", "a": "M02", "b": "F36", "direction": "→", "type": "Korrektur", "why": "Dass Git-Repositorien von Plattformen unabhängig übertragen werden können, trennt Git als Technologie von GitHub oder GitLab.", "reverse": "Die Rückrichtung ist keine entsprechende Korrektur: Die Feature-Möglichkeit belegt nicht, dass jemand die Fehlannahme tatsächlich vertritt.", "en": {"type": "Correction", "why": "Git separates Git as a technology from GitHub or GitLab that Git repositories can be transferred independently from platforms.", "reverse": "The reverse is not a corresponding correction: The feature option does not prove that someone actually represents the misacceptance.", "id": "R002"}}, {"id": "R003", "a": "M03", "b": "F01", "direction": "→", "type": "Korrektur", "why": "Die grafische Integration in Oxygen senkt die Hürde bei Alltagsoperationen; sie macht Git nicht konzeptionell voraussetzungslos.", "reverse": "Die Rückrichtung ist keine entsprechende Korrektur: Die Feature-Möglichkeit belegt nicht, dass jemand die Fehlannahme tatsächlich vertritt.", "en": {"type": "Correction", "why": "The graphical integration in Oxygen lowers the hurdle in everyday operations; it does not make Git conceptually unconditional.", "reverse": "The reverse is not a corresponding correction: The feature option does not prove that someone actually represents the misacceptance.", "id": "R003"}}, {"id": "R004", "a": "M04", "b": "F21", "direction": "→", "type": "Korrektur", "why": "Lokale Offline-Versionierung ist auch ohne Team ein eigenständiger Nutzungsfall.", "reverse": "Die Rückrichtung ist keine entsprechende Korrektur: Die Feature-Möglichkeit belegt nicht, dass jemand die Fehlannahme tatsächlich vertritt.", "en": {"type": "Correction", "why": "Local offline versioning is also an independent use case without a team.", "reverse": "The reverse is not a corresponding correction: The feature option does not prove that someone actually represents the misacceptance.", "id": "R004"}}, {"id": "R005", "a": "M05", "b": "F21", "direction": "→", "type": "Korrektur", "why": "Commits, Vergleiche und Entwicklungszweige funktionieren auf einem einzelnen Rechner ohne Internet.", "reverse": "Die Rückrichtung ist keine entsprechende Korrektur: Die Feature-Möglichkeit belegt nicht, dass jemand die Fehlannahme tatsächlich vertritt.", "en": {"type": "Correction", "why": "Commits, comparisons and development branches work on a single computer without the Internet.", "reverse": "The reverse is not a corresponding correction: The feature option does not prove that someone actually represents the misacceptance.", "id": "R005"}}, {"id": "R006", "a": "M06", "b": "F04", "direction": "↔", "type": "Ergänzung", "why": "Schutzregeln machen sichtbar, wie technische Konfigurationen Freigaberechte und Arbeitsabläufe prägen.", "reverse": "Beide Richtungen sind als Vergleich lesbar; daraus folgt keine Gleichsetzung.", "en": {"type": "Supplement", "why": "Protection rules make it visible how he commits."}}, {"term": "Reflog", "description": "Lokale Aufzeichnung darüber, auf welche Commits bestimmte Git-Verweise zuletzt gezeigt haben.", "en": {"term": "Reflog", "description": "A local record of where Git references pointed recently; sometimes useful for recovery."}}, {"term": "Git LFS", "description": "Erweiterung, die große Dateiinhalte außerhalb der üblichen Git-Objektspeicherung verwaltet.", "en": {"term": "Git LFS", "description": "Git Large File Storage: an extension for managing large files outside ordinary Git objects."}}, {"term": ".gitattributes", "description": "Konfigurationsdatei für die Behandlung bestimmter Dateitypen durch Git.", "en": {"term": ".gitattributes", "description": "A configuration file that controls how Git handles selected file types."}}, {"term": ".mailmap", "description": "Datei zur Vereinheitlichung verschiedener Autorenangaben in bestimmten Anzeigen und Statistiken.", "en": {"term": ".mailmap", "description": "A configuration file used to normalize author names and email addresses for display."}}, {"term": "TEI/XML", "description": "Strukturierte Textauszeichnung, häufig Grundlage digitaler wissenschaftlicher Editionen.", "en": {"term": "TEI/XML", "description": "Structured text encoded using XML following the Text Encoding Initiative guidelines."}}, {"term": "Relax NG / Schematron", "description": "Verfahren, mit denen sich XML-Dokumente gegen strukturelle beziehungsweise zusätzliche Regeln prüfen lassen.", "en": {"term": "Relax NG / Schematron", "description": "Technologies for validating XML structure and more specific rules."}}, {"term": "XSLT", "description": "Sprache zur Umwandlung von XML-Daten in andere Darstellungen oder Formate.", "en": {"term": "XSLT", "description": "A language for transforming XML, for example into HTML."}}, {"term": "ODD", "description": "Bei TEI ein Verfahren zur Spezifikation und Dokumentation eines projektspezifischen Auszeichnungsmodells.", "en": {"term": "ODD", "description": "The TEI s function start(type='mix'){state.quizType=type;state.round=[];state.index=0;state.score=0;state.answered=null;let recent=new Set(state.history.slice(-20));let mistakes=shuffle(DB.nodes.filter(n=>n.kind==='M'&&!recent.has(n.id)));let facts=shuffle(DB.nodes.filter(n=>n.kind==='F'&&!recent.has(n.id)));if(mistakes.length<4)mistakes=shuffle(DB.nodes.filter(n=>n.kind==='M'));if(facts.length<4)facts=shuffle(DB.nodes.filter(n=>n.kind==='F'));
for(let i=0;i<6;i++){let mode=type==='mix'?(i%3===0?'single':i%3===1?'pairLinked':'pairRandom'):type;let falseN=mistakes.pop()||pick(DB.nodes.filter(n=>n.kind==='M'));let trueN=facts.pop()||pick(DB.nodes.filter(n=>n.kind==='F'));let rel=null;
if(mode==='pairLinked'){let pairs=shuffle(DB.relations.filter(r=>(r.a.startsWith('M')&&r.b.startsWith('F'))||(r.a.startsWith('F')&&r.b.startsWith('M'))));rel=pairs.find(r=>!recent.has(r.a)&&!recent.has(r.b)&&!state.round.some(q=>q.ids.includes(r.a)||q.ids.includes(r.b)))||pick(pairs);falseN=NODE[rel.a.startsWith('M')?rel.a:rel.b];trueN=NODE[rel.a.startsWith('F')?rel.a:rel.b]}
if(mode==='single'){const n=i%2===0?falseN:trueN;state.round.push({mode,ids:[n.id],correct:n.kind==='F'?0:1,question:n})}
else{let opts=shuffle([falseN,trueN]);state.round.push({mode,ids:[falseN.id,trueN.id],opts,correct:opts.findIndex(n=>n.kind==='F'),rel})}}
go('quiz')}
function answer(choice){if(state.answered!==null)return;let q=state.round[state.index];state.answered=choice;if(choice===q.correct)state.score++;for(let id of q.ids){state.seen.add(id);state.history.push(id)}render()}
function next(){if(state.index<state.round.length-1){state.index++;state.answered=null;render()}else{state.page='result';render()}}
function scoreMessage(){return state.score===6?'Großartig – alle sechs richtig!':state.score>=4?'Sehr gut! Einige überraschende Details warten noch.':'Gut entdeckt: Gerade Irrtümer machen die Git-Welt interessant.'}
function home(){return `<section class="hero"><div><div class="eyebrow">Digitale Editionen spielerisch entdecken</div><h1>Git kann mehr.<br>Und manches stimmt ganz anders.</h1><p>Wahr oder falsch? Zwei Aussagen – welche stimmt? Und welches Thema hängt mit welchem zusammen? Entdecke Git ohne technisches Vorwissen, mit verständlichen Auflösungen und einem Glossar zum Nachschlagen.</p><div class="buttons"><button class="btn" data-start="mix">6 Fragen spielen →</button><button class="btn secondary" data-page="explore">Zusammenhänge entdecken</button></div></div><div class="art" aria-hidden="true"><svg viewBox="0 0 340 240"><path d="M52 37V165Q52 190 85 190H280" stroke="#579d7c" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M52 87H200Q236 87 236 128V164" stroke="#f4ad76" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="52" cy="37" r="18" fill="#12694e" stroke="#fff" stroke-width="5"/><circle cx="52" cy="87" r="17" fill="#ba563d" stroke="#fff" stroke-width="5"/><circle cx="236" cy="166" r="18" fill="#12694e" stroke="#fff" stroke-width="5"/><circle cx="280" cy="190" r="17" fill="#f4ad76" stroke="#fff" stroke-width="5"/><text x="110" y="51" font-size="23" font-weight="800" fill="#173e30">Wahr?</text><text x="126" y="155" font-size="23" font-weight="800" fill="#a34b31">Falsch?</text></svg></div></section><section class="stats noprint" style="margin-top:20px"><div class="stat"><strong>47</strong><span>Missverständnisse</span></div><div class="stat"><strong>36</strong><span>verblüffende Fakten</span></div><div class="stat"><strong>101</strong><span>erklärte Verbindungen</span></div></section><section class="cards noprint"><div class="mode"><div class="tag">Modus 01</div><h3>Wahr oder falsch?</h3><p>Eine Behauptung, deine Entscheidung – danach erklären wir die Hintergründe.</p><button class="btn secondary" data-start="single">Diesen Modus spielen</button></div><div class="mode"><div class="tag">Modus 02</div><h3>Welche Aussage stimmt?</h3><p>Wähle zwischen zwei Aussagen: zufällig kombiniert oder inhaltlich miteinander verknüpft.</p><div class="buttons"><button class="btn secondary" data-start="pairRandom">Zufall</button><button class="btn secondary" data-start="pairLinked">Verknüpft</button></div></div><div class="mode"><div class="tag">Modus 03</div><h3>Verlinktes Hüpfen</h3><p>Starte mit einem Thema und folge begründeten Beziehungen zum nächsten.</p><button class="btn secondary" data-page="explore">Erkunden</button></div></section><div class="panel"><h2>Was du mitnehmen kannst</h2><p class="detail">Jede Auflösung enthält eine Erklärung, Grenzen der Aussage und – bei den Fakten – weiterführende Quellen. Bereits behandelte Themen kannst du als Lernblatt zusammenstellen und über den Browser ausdrucken oder als PDF speichern. Alles funktioniert in dieser einzelnen HTML-Datei auch offline; nur die externen Quellenlinks brauchen Internet.</p><button class="btn ghost" data-page="glossary">Alle 24 Fachbegriffe ansehen</button></div>`}
function quiz(){let q=state.round[state.index];if(!q)return home();let finished=state.answered!==null;let matched=q.mode==='single'?[q.question]:q.opts;let choices=q.mode==='single'?['Stimmt','Stimmt nicht']:q.opts.map(n=>claim(n));let correctIndex=q.correct;return `<div class="section-head noprint"><div class="smallcaps">${q.mode==='single'?'Wahr oder falsch?':q.mode==='pairLinked'?'Zwei zusammenhängende Behauptungen':'Zwei zufällig kombinierte Behauptungen'} · Frage ${state.index+1} von ${state.round.length}</div><button class="btn ghost small" data-page="glossary">Glossar ↗</button></div><div class="progress noprint"><div class="bar" style="width:${((state.index+(finished?1:0))/state.round.length)*100}%"></div></div><div class="panel"><div class="smallcaps">${q.mode==='single'?'Entscheide, ob die Aussage zutrifft':'Nur eine Aussage ist richtig. Welche?'}</div>${q.mode==='single'?`<div class="question">„${esc(claim(q.question))}“</div>`:`<div class="question">Welche der beiden Behauptungen trifft zu?</div>`}<div class="answer-grid noprint">${choices.map((c,i)=>`<button class="choice ${finished?(i===correctIndex?'correct':i===state.answered?'wrong':''):''}" data-choice="${i}" ${finished?'disabled':''}><span class="smallcaps">${q.mode==='single'?'':`Aussage ${i===0?'A':'B'}`} ${finished&&i===correctIndex?' · ✓ richtig':finished&&i===state.answered?' · ✕ falsch':''}</span><div style="margin-top:8px">${esc(c)}</div></button>`).join('')}</div>${finished?`<div class="feedback ${state.answered===q.correct?'':'wrong'}"><h3>${state.answered===q.correct?'✓ Richtig entschieden!':'✦ Interessanter Irrtum!'}</h3>${q.mode!=='single'?`<p><strong>Die richtige Aussage:</strong> ${esc(claim(q.opts[q.correct]))}</p>`:''}<p>${q.mode==='single'&&q.question.kind==='M'?'Diese verbreitete Behauptung enthält einen wahren Kern, führt aber zu einem Fehlschluss.':q.mode==='single'?'Das ist eine tatsächlich mögliche Eigenschaft oder Anwendung von Git.':'Warum die zweite Aussage nicht ohne Weiteres stimmt, zeigt die folgende Gegenüberstellung.'}</p></div>${matched.map(n=>`<div class="panel" style="margin-top:14px"><span class="smallcaps">${n.kind==='M'?'Fehlannahme':'überraschende Möglichkeit'}</span><h2>${esc(title(n))}</h2>${details(n)}<div class="buttons noprint"><button class="btn secondary small" data-deeper="${n.id}">Thema vertiefen und Verbindungen entdecken →</button></div></div>`).join('')}${q.rel?`<div class="boxnote" style="margin-top:15px"><strong>Warum gehören diese Aussagen zusammen?</strong><p><strong>${esc(title(NODE[q.rel.a]))} ${q.rel.direction} ${esc(title(NODE[q.rel.b]))}</strong> · ${esc(relField(q.rel,'type'))}: ${esc(relField(q.rel,'why'))}</p><p class="muted">${esc(relField(q.rel,'reverse'))}</p></div>`:''}<div class="buttons noprint"><button class="btn" data-next="1">${state.index===5?'Auswertung ansehen →':'Nächste Frage →'}</button><button class="btn ghost" data-page="print">Erkenntnisse sammeln</button></div>`:`<p class="muted small">Wähle deine Antwort. Danach erscheint die ausführliche Auflösung mit Beispielen und Grenzen.</p>`}</div>`}
function result(){return `<div class="panel"><div class="eyebrow">Runde abgeschlossen</div><h2>Du hast ${state.score} von 6 Fragen richtig beantwortet.</h2><p class="detail">${scoreMessage()}</p><div class="stats"><div class="stat"><strong>${state.score}/6</strong><span>richtige Antworten</span></div><div class="stat"><strong>${state.seen.size}</strong><span>kennengelernte Themen</span></div><div class="stat"><strong>${DB.nodes.length-state.seen.size}</strong><span>noch zu entdecken</span></div></div><div class="buttons noprint"><button class="btn" data-start="mix">Neue Zufallsrunde →</button><button class="btn secondary" data-page="explore">Verbindungen erkunden</button><button class="btn ghost" data-page="print">Lernblatt / PDF</button></div></div><div class="panel"><h2>In dieser Runde behandelt</h2><div class="browse-list">${[...new Set(state.round.flatMap(q=>q.ids))].map(id=>`<button class="browse-item" data-explore="${id}">${esc(title(NODE[id]))}</button>`).join('')}</div></div>`}
function explore(){let n=NODE[state.exploreId];let rel=related(n.id);let hits=DB.nodes.filter(x=>[x.id,title(x),x.detail,x.en?.detail,x.surprise,x.utility].join(' ').toLowerCase().includes(state.search.toLowerCase())).slice(0,90);return `<div class="section-head noprint"><div><div class="eyebrow">Wissensnetz</div><h1 style="margin:8px 0">Von Thema zu Thema springen</h1></div><button class="btn secondary" data-randomnode="1">Zufälliger Ausgangspunkt ↝</button></div><div class="panel"><label class="smallcaps" for="search">Thema oder Begriff suchen</label><input id="search" class="search" placeholder="Beispiel: XML, Datenschutz, Commit, Oxygen ..." value="${esc(state.search)}"><div class="browse-list" id="search-results" style="margin-top:10px;max-height:160px">${hits.slice(0,12).map(x=>`<button class="browse-item" data-explore="${x.id}">${esc(title(x))}</button>`).join('')}</div></div><div class="panel"><div class="tag">Aktuelles Thema</div><h2>${esc(title(n))}</h2>${details(n)}</div><div class="panel"><div class="section-head"><h2>Verwandte Aussagen (${rel.length})</h2><span class="subtle">→ gerichtet · ↔ wechselseitig</span></div>${rel.length?`<div class="relations">${rel.map(e=>{let other=e.a===n.id?e.b:e.a;return `<div class="edge"><div class="edge-header"><span class="pill">${esc(relField(e,'type'))}</span><strong>${e.direction==='↔'?'Wechselseitiger Bezug':'Gerichtete Verbindung'}</strong></div><p>${esc(relField(e,'why'))}</p><p class="muted small">Zur Richtung: ${esc(relField(e,'reverse'))}</p><button data-explore="${other}">${esc(title(NODE[other]))} →</button></div>`}).join('')}</div>`:'<p>Hier sind in unserer Sammlung noch keine Beziehungen dokumentiert.</p>'}</div><div class="boxnote">Hinweis: Eine gerichtete Beziehung beschreibt den angegebenen Argumentationsweg. Sie beweist nicht automatisch Ursache und Wirkung. Die Verbindungserklärungen stammen aus unserer Beziehungslandkarte.</div>`}
function glossary(){let filtered=DB.glossary.filter(g=>(gn(g).term+' '+gn(g).description).toLowerCase().includes(state.glossSearch.toLowerCase()));return `<div class="eyebrow">Nachschlagen ohne Vorwissen</div><h1>Das Git-Glossar</h1><p class="detail">24 kurze Erklärungen aus unserer Sammlung „Verblüffende Fakten“. Die Begriffe sind auch in den Auflösungen als kleine Nachschlage-Schaltflächen verlinkt.</p><input class="search noprint" id="gloss-search" placeholder="Begriff suchen ..." value="${esc(state.glossSearch)}"><div class="gloss" style="margin-top:15px">${filtered.map(g=>`<article id="term-${esc(gn(g).term)}"><strong>${esc(gn(g).term)}</strong><p>${esc(gn(g).description)}</p></article>`).join('')}</div>`}
function printPage(){let all=state.printScope==='all'?DB.nodes:DB.nodes.filter(n=>state.seen.has(n.id));return `<div class="printhead"><h1>Git-Entdeckungsreise – Lernblatt</h1><p>Wissenspunkte und Erklärungen zu Git für digitale Editionen</p></div><div class="noprint"><div class="eyebrow">Wissenssammlung</div><h1>Dein Lernblatt</h1><p class="detail">Stelle behandelte Themen oder die gesamte Sammlung zusammen. Über „Drucken / Als PDF speichern“ öffnet sich der Druckdialog des Browsers – dort kann eine PDF-Datei gespeichert werden.</p><div class="panel"><div class="printcontrols"><label>Inhalt <select id="print-scope"><option value="seen" ${state.printScope==='seen'?'selected':''}>Meine behandelten Themen (${state.seen.size})</option><option value="all" ${state.printScope==='all'?'selected':''}>Alle 83 Themen</option></select></label><label><input type="checkbox" id="print-gloss" ${state.printGloss?'checked':''}> Glossar anhängen</label></div><div class="buttons"><button class="btn" data-print="1">Drucken / Als PDF speichern</button><button class="btn ghost" data-page="quiz">Weiter spielen</button></div></div></div><section id="printable"><h2>${state.printScope==='all'?'Alle Themen':'Behandelte Themen'} · ${all.length}</h2>${all.length?all.map(n=>`<article class="printcard"><h3>${esc(title(n))}</h3>${details(n)}</article>`).join(''):'<div class="panel">Noch keine Themen behandelt. Spiele eine Runde oder erkunde einige Verbindungen.</div>'}${state.printGloss?`<h2>Glossar</h2><div class="gloss">${DB.glossary.map(g=>`<article><strong>${esc(gn(g).term)}</strong><p>${esc(gn(g).description)}</p></article>`).join('')}</div>`:''}</section>`}

function translateUI(){if(state.lang!=='en')return;let app=$('#app');let walker=document.createTreeWalker(app,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){let text=node.nodeValue;if(!text.trim())continue;for(const [de,en] of UI_PAIRS){if(text.includes(de))text=text.replaceAll(de,en)}text=text.replace(/Frage (\d+) von (\d+)/g,'Question $1 of $2').replace(/Du hast (\d+) von (\d+) Fragen richtig beantwortet\./g,'You answered $1 of $2 questions correctly.').replace(/Verwandte Aussagen \((\d+)\)/g,'Related statements ($1)').replace(/Noch zu entdecken/g,'Still to explore');node.nodeValue=text;}for(const input of app.querySelectorAll('[placeholder]')){let p=input.placeholder;if(p.startsWith('Beispiel:'))input.placeholder='Example: XML, privacy, commit, Oxygen ...';else if(p==='Begriff suchen ...')input.placeholder='Search for a term ...';}}
function syncLang(){document.documentElement.lang=state.lang;document.title=state.lang==='en'?'Git Discovery · Facts, misconceptions and connections':'Git-Entdeckungsreise · Fakten, Irrtümer und Verbindungen';document.querySelectorAll('[data-lang]').forEach(b=>{let active=b.dataset.lang===state.lang;b.classList.toggle('selected',active);b.setAttribute('aria-pressed',active)});for(const b of document.querySelectorAll('header [data-page]')){let de={home:'Start',quiz:'Quiz',explore:'Verbindungen',glossary:'Glossar',print:'Merkliste / PDF'}[b.dataset.page];b.textContent=state.lang==='en'?({'Start':'Home','Quiz':'Quiz','Verbindungen':'Connections','Glossar':'Glossary','Merkliste / PDF':'Learning sheet / PDF'}[de]):de;}document.querySelector('.brand').textContent=state.lang==='en'?'◈ Git Discovery':'◈ Git-Entdeckungsreise';document.querySelector('footer .shell').textContent=state.lang==='en'?UI_EN['Git-Entdeckungsreise · Eigenständig nutzbare HTML-Datei · Alle Inhalte stammen aus den drei Git-Arbeitssammlungen. Verknüpfungen sind begründete Interpretationen, keine zwingenden Kausalbehauptungen. Ergebnisse bleiben nur in diesem geöffneten Browserfenster gespeichert.']:'Git-Entdeckungsreise · Eigenständig nutzbare HTML-Datei · Alle Inhalte stammen aus den drei Git-Arbeitssammlungen. Verknüpfungen sind begründete Interpretationen, keine zwingenden Kausalbehauptungen. Ergebnisse bleiben nur in diesem geöffneten Browserfenster gespeichert.';}

function render(){document.querySelectorAll('header [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));$('#app').innerHTML=({home,quiz,result,explore,glossary,print:printPage,detail:()=>deeper(NODE[state.detailId])}[state.page]||home)();syncLang();translateUI();}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.lang){state.lang=b.dataset.lang;render()}else if(b.dataset.page){go(b.dataset.page)}else if(b.dataset.start){start(b.dataset.start)}else if('choice'in b.dataset){answer(Number(b.dataset.choice))}else if('next'in b.dataset){next()}else if(b.dataset.deeper){state.returnPage=state.page==='detail'?state.returnPage:state.page;state.detailId=b.dataset.deeper;state.seen.add(state.detailId);go('detail')}else if('back'in b.dataset){go(state.returnPage)}else if(b.dataset.explore){state.exploreId=b.dataset.explore;state.seen.add(state.exploreId);go('explore')}else if('randomnode'in b.dataset){state.exploreId=pick(DB.nodes).id;state.seen.add(state.exploreId);render()}else if(b.dataset.term){let g=DB.glossary.find(g=>g.term===b.dataset.term);if(g)alert(gn(g).term+'\n\n'+gn(g).description)}else if('print'in b.dataset){window.print()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;let hits=DB.nodes.filter(x=>[x.id,title(x),x.detail,x.en?.detail,x.surprise,x.utility].join(' ').toLowerCase().includes(state.search.toLowerCase())).slice(0,12);$('#search-results').innerHTML=hits.map(x=>`<button class="browse-item" data-explore="${x.id}">${esc(title(x))}</button>`).join('')}else if(e.target.id==='gloss-search'){state.glossSearch=e.target.value;let pos=e.target.selectionStart;render();$('#gloss-search').focus();$('#gloss-search').setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='print-scope'){state.printScope=e.target.value;render()}else if(e.target.id==='print-gloss'){state.printGloss=e.target.checked;render()}});
render();
</script></body></html>
